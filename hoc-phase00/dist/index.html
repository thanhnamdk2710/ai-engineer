<title>Sổ học Phase 00</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sổ tay kỹ thuật kiểu bản vẽ (blueprint) — mục lục bài bên trái, cột đọc ~68ch ở giữa, mục lục mục bên phải trên màn rộng. */
:root {
  --bg: #f5f6fa;
  --bg-surface: #eaedf6;
  --bg-raised: #ffffff;
  --ink: #151a2c;
  --ink-soft: #454c66;
  --ink-mute: #6d7490;
  --rule-soft: #d7dbea;
  --rule: #c3c9de;
  --blueprint: #2a45d4;
  --blueprint-wash: #e3e8ff;
  --warn: #a2700a;
  --ok: #17784a;
  --ok-wash: #def3e8;
  --bad: #b23a33;
  --bad-wash: #fbe5e3;
  --code-bg: #eceff8;
  --syn-kw: #7a2fbf;
  --syn-str: #17784a;
  --syn-com: #7d84a0;
  --syn-num: #b4540c;
  --syn-fn: #2a45d4;
  --font-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease-out: cubic-bezier(.23,1,.32,1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1120; --bg-surface: #161a2c; --bg-raised: #1a1f33; --ink: #e5e8f3; --ink-soft: #b2b8cf; --ink-mute: #8a91ab;
    --rule-soft: #272d45; --rule: #343b58; --blueprint: #8fa2ff; --blueprint-wash: #1f2850; --warn: #e2b14b;
    --ok: #5cc68f; --ok-wash: #15301f; --bad: #f08079; --bad-wash: #3a1b1b; --code-bg: #131729;
    --syn-kw: #c79bff; --syn-str: #7fd6a4; --syn-com: #7a819c; --syn-num: #f2a56a; --syn-fn: #9fb1ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1120; --bg-surface: #161a2c; --bg-raised: #1a1f33; --ink: #e5e8f3; --ink-soft: #b2b8cf; --ink-mute: #8a91ab;
  --rule-soft: #272d45; --rule: #343b58; --blueprint: #8fa2ff; --blueprint-wash: #1f2850; --warn: #e2b14b;
  --ok: #5cc68f; --ok-wash: #15301f; --bad: #f08079; --bad-wash: #3a1b1b; --code-bg: #131729;
  --syn-kw: #c79bff; --syn-str: #7fd6a4; --syn-com: #7a819c; --syn-num: #f2a56a; --syn-fn: #9fb1ff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: calc(72px + env(safe-area-inset-top, 0px)); }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--bg); }
a { color: var(--blueprint); text-underline-offset: 3px; text-decoration-thickness: 1px; }
:focus-visible { outline: 2px solid var(--blueprint); outline-offset: 2px; border-radius: 3px; }
button { font: inherit; color: inherit; }

.app { display: grid; grid-template-columns: 284px minmax(0, 1fr); min-height: 100vh; }

/* ---------- Sidebar ---------- */
.side {
  position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto;
  border-right: 1px solid var(--rule-soft); background: var(--bg-surface);
  padding-block: 20px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
  display: flex; flex-direction: column; gap: 18px;
}
.brand { display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: var(--ink); padding: 4px 8px; border-radius: 6px; }
.brand:hover { background: var(--bg-raised); }
.brand small { font-family: var(--font-mono); font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--blueprint); }
.brand b { font-size: 1.08rem; font-weight: 700; line-height: 1.3; }
.side-progress { padding: 0 8px; display: grid; gap: 6px; }
.side-progress .row { display: flex; justify-content: space-between; font-size: .8rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 99px; background: var(--rule-soft); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--blueprint); border-radius: inherit; transition: width .4s var(--ease-out); }
.nav { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.nav a {
  display: grid; grid-template-columns: 44px 1fr 16px; align-items: center; gap: 6px;
  padding: 7px 8px; border-radius: 6px; text-decoration: none; color: var(--ink-soft); font-size: .9rem; line-height: 1.35;
}
.nav a:hover { background: var(--bg-raised); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--bg-raised); color: var(--ink); box-shadow: inset 2px 0 0 var(--blueprint); }
.nav .num { font-family: var(--font-mono); font-size: .74rem; color: var(--ink-mute); font-variant-numeric: tabular-nums; }
.nav .dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--rule); justify-self: end; }
.nav .done .dot { border-color: var(--ok); background: var(--ok); box-shadow: inset 0 0 0 2.5px var(--bg-surface); }
.side-foot { margin-top: auto; font-size: .76rem; color: var(--ink-mute); padding: 0 8px; line-height: 1.5; }

/* ---------- Main ---------- */
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 10px; min-height: 56px;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--rule-soft);
}
.menu-btn { display: none; border: 1px solid var(--rule); background: var(--bg-raised); border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: .85rem; }
.crumb { font-family: var(--font-mono); font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.crumb b { color: var(--ink); font-weight: 500; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; background: var(--bg-raised); flex-shrink: 0; }
.seg button { border: 0; background: none; padding: 5px 11px; font-size: .8rem; cursor: pointer; color: var(--ink-soft); }
.seg button[aria-pressed="true"] { background: var(--blueprint); color: var(--bg); }

.wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 40px; padding-block: 32px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1180px; width: 100%; margin: 0 auto; }
.wrap.has-toc { grid-template-columns: minmax(0, 1fr) 220px; }
.col { min-width: 0; max-width: 720px; width: 100%; margin: 0 auto; }

/* ---------- Lesson header ---------- */
.lhead { display: grid; gap: 14px; margin-bottom: 26px; }
.eyebrow { font-family: var(--font-mono); font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; color: var(--blueprint); display: flex; gap: 10px; flex-wrap: wrap; }
.eyebrow span + span::before { content: "/"; margin-right: 10px; color: var(--ink-mute); }
.lhead h1 { font-size: clamp(1.8rem, 1.3rem + 2vw, 2.5rem); line-height: 1.15; margin: 0; font-weight: 800; letter-spacing: -.02em; text-wrap: balance; }
.tagline { margin: 0; font-size: 1.12rem; color: var(--ink-soft); line-height: 1.55; text-wrap: pretty; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--rule-soft); border: 1px solid var(--rule-soft); border-radius: 8px; overflow: hidden; }
.meta div { background: var(--bg-raised); padding: 9px 12px; display: grid; gap: 1px; min-width: 0; }
.meta dt { font-family: var(--font-mono); font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-mute); }
.meta dd { margin: 0; font-size: .88rem; line-height: 1.4; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--rule-soft); margin-bottom: 28px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 14px; cursor: pointer; font-size: .92rem; color: var(--ink-soft); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--blueprint); font-weight: 600; }
.tabs .count { font-family: var(--font-mono); font-size: .72rem; color: var(--ink-mute); margin-left: 4px; }

/* ---------- Prose ---------- */
.prose { font-size: 1.02rem; }
.prose > * + * { margin-top: 1em; }
.prose h2 { font-size: 1.5rem; line-height: 1.25; margin: 2.2em 0 .2em; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; padding-top: .9em; border-top: 1px solid var(--rule-soft); }
.prose h3 { font-size: 1.17rem; line-height: 1.3; margin: 1.8em 0 .1em; font-weight: 650; text-wrap: balance; }
.prose h4 { font-size: 1rem; margin: 1.5em 0 0; }
.prose p, .prose li { text-wrap: pretty; }
.prose ul, .prose ol { padding-left: 1.4em; }
.prose li + li { margin-top: .35em; }
.prose li::marker { color: var(--ink-mute); }
.prose strong { font-weight: 650; }
.prose blockquote { margin-left: 0; margin-right: 0; padding: 10px 16px; border-left: 3px solid var(--blueprint); background: var(--blueprint-wash); border-radius: 0 6px 6px 0; color: var(--ink); }
.prose blockquote > :first-child { margin-top: 0; } .prose blockquote > :last-child { margin-bottom: 0; }
.prose hr { border: 0; border-top: 1px solid var(--rule-soft); margin: 2em 0; }
.prose :not(pre) > code { font-family: var(--font-mono); font-size: .86em; background: var(--code-bg); border: 1px solid var(--rule-soft); padding: .08em .35em; border-radius: 4px; overflow-wrap: anywhere; }
.prose .table-wrap { overflow-x: auto; border: 1px solid var(--rule-soft); border-radius: 8px; }
.prose table { border-collapse: collapse; width: 100%; font-size: .92rem; }
.prose th, .prose td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--rule-soft); }
.prose th { background: var(--bg-surface); font-weight: 600; font-size: .82rem; }
.prose tr:last-child td { border-bottom: 0; }
.prose img { max-width: 100%; }

.code { border: 1px solid var(--rule-soft); border-radius: 8px; background: var(--code-bg); overflow: hidden; }
.code-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 6px 4px 12px; border-bottom: 1px solid var(--rule-soft); font-family: var(--font-mono); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-mute); }
.copy { border: 0; background: none; cursor: pointer; font-family: var(--font-mono); font-size: .7rem; letter-spacing: .06em; padding: 6px 8px; border-radius: 5px; color: var(--ink-soft); min-height: 32px; }
.copy:hover { background: var(--bg-raised); color: var(--blueprint); }
.code pre { margin: 0; padding: 14px 16px; overflow-x: auto; font-family: var(--font-mono); font-size: .84rem; line-height: 1.6; tab-size: 4; }
.code pre code { font-family: inherit; background: none; border: 0; padding: 0; }
.hljs-keyword, .hljs-built_in, .hljs-selector-tag, .hljs-meta .hljs-keyword, .hljs-type { color: var(--syn-kw); }
.hljs-string, .hljs-attr .hljs-string, .hljs-regexp, .hljs-addition { color: var(--syn-str); }
.hljs-comment, .hljs-quote, .hljs-meta { color: var(--syn-com); font-style: italic; }
.hljs-number, .hljs-literal, .hljs-variable, .hljs-template-variable, .hljs-symbol, .hljs-deletion { color: var(--syn-num); }
.hljs-title, .hljs-function .hljs-title, .hljs-title.function_, .hljs-section, .hljs-attr, .hljs-attribute, .hljs-name { color: var(--syn-fn); }

.prose pre.mermaid { background: var(--bg-raised); border: 1px solid var(--rule-soft); border-radius: 8px; padding: 16px; text-align: center; overflow-x: auto; font-family: var(--font-mono); font-size: .8rem; white-space: pre; }
.prose pre.mermaid[data-processed] { white-space: normal; }
.prose pre.mermaid svg { max-width: 100%; height: auto; }
.prose .lesson-figure { border-radius: 8px; overflow: hidden; }

/* ---------- TOC ---------- */
.toc { position: sticky; top: calc(76px + env(safe-area-inset-top, 0px)); align-self: start; max-height: calc(100vh - 100px); overflow-y: auto; font-size: .84rem; }
.toc h2 { font-family: var(--font-mono); font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-mute); margin: 0 0 10px; font-weight: 500; }
.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; border-left: 1px solid var(--rule-soft); }
.toc a { display: block; padding: 4px 10px; color: var(--ink-soft); text-decoration: none; line-height: 1.4; margin-left: -1px; border-left: 2px solid transparent; }
.toc a.h3 { padding-left: 22px; font-size: .8rem; }
.toc a:hover { color: var(--ink); }
.toc a.active { color: var(--blueprint); border-left-color: var(--blueprint); }
.toc-inline { display: none; border: 1px solid var(--rule-soft); border-radius: 8px; background: var(--bg-raised); margin-bottom: 24px; font-size: .9rem; }
.toc-inline summary { padding: 10px 14px; cursor: pointer; font-weight: 600; }
.toc-inline ol { margin: 0; padding: 0 14px 12px 34px; display: grid; gap: 3px; }
.toc-inline a { color: var(--ink-soft); text-decoration: none; }

/* ---------- Lesson footer ---------- */
.lfoot { margin-top: 56px; display: grid; gap: 16px; }
.done-card { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; border: 1px solid var(--rule-soft); border-radius: 10px; background: var(--bg-raised); }
.done-card p { margin: 0; color: var(--ink-soft); font-size: .92rem; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--rule); background: var(--bg-raised); border-radius: 8px; padding: 9px 16px; cursor: pointer; font-size: .92rem; font-weight: 600; text-decoration: none; color: var(--ink); min-height: 40px; }
.btn:hover { border-color: var(--blueprint); color: var(--blueprint); }
.btn.primary { background: var(--blueprint); border-color: var(--blueprint); color: var(--bg); }
.btn.primary:hover { filter: brightness(1.08); color: var(--bg); }
.btn.is-done { background: var(--ok-wash); border-color: var(--ok); color: var(--ok); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pager a { display: grid; gap: 2px; padding: 12px 16px; border: 1px solid var(--rule-soft); border-radius: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.pager a:hover { border-color: var(--blueprint); }
.pager a small { font-family: var(--font-mono); font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-mute); }
.pager a span { font-weight: 600; overflow-wrap: anywhere; }
.pager .next { text-align: right; grid-column: 2; }

/* ---------- Code tab ---------- */
.files { display: grid; gap: 22px; }
.file-list { display: flex; flex-wrap: wrap; gap: 6px; }
.file-list button { border: 1px solid var(--rule); background: var(--bg-raised); border-radius: 6px; padding: 5px 10px; font-family: var(--font-mono); font-size: .78rem; cursor: pointer; color: var(--ink-soft); }
.file-list button[aria-pressed="true"] { border-color: var(--blueprint); color: var(--blueprint); background: var(--blueprint-wash); }
.hint { font-size: .9rem; color: var(--ink-soft); margin: 0; }
.hint code { font-family: var(--font-mono); font-size: .84em; background: var(--code-bg); padding: .08em .35em; border-radius: 4px; overflow-wrap: anywhere; }

/* ---------- Quiz ---------- */
.quiz { display: grid; gap: 28px; }
.score { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-radius: 10px; background: var(--bg-raised); border: 1px solid var(--rule-soft); }
.score b { font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.score span { color: var(--ink-soft); font-size: .9rem; }
.qgroup h2 { font-size: 1.1rem; margin: 0 0 4px; }
.qgroup > p { margin: 0 0 14px; color: var(--ink-soft); font-size: .92rem; }
.qcard { border: 1px solid var(--rule-soft); border-radius: 10px; background: var(--bg-raised); padding: 16px 18px; display: grid; gap: 12px; }
.qcard + .qcard { margin-top: 12px; }
.qcard .q { font-weight: 600; margin: 0; line-height: 1.5; }
.qcard .q small { display: block; font-family: var(--font-mono); font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-mute); font-weight: 400; margin-bottom: 4px; }
.opts { display: grid; gap: 6px; }
.opt { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; text-align: left; border: 1px solid var(--rule-soft); background: var(--bg); border-radius: 8px; padding: 9px 12px; cursor: pointer; line-height: 1.45; font-size: .95rem; }
.opt:hover:not(:disabled) { border-color: var(--blueprint); }
.opt .k { font-family: var(--font-mono); font-size: .76rem; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--rule); display: grid; place-items: center; color: var(--ink-mute); }
.opt:disabled { cursor: default; }
.opt.ok { border-color: var(--ok); background: var(--ok-wash); }
.opt.ok .k { border-color: var(--ok); background: var(--ok); color: var(--bg); }
.opt.bad { border-color: var(--bad); background: var(--bad-wash); }
.opt.bad .k { border-color: var(--bad); background: var(--bad); color: var(--bg); }
.opt.dim { opacity: .6; }
.explain { margin: 0; font-size: .92rem; color: var(--ink-soft); padding: 10px 12px; border-left: 3px solid var(--rule); background: var(--bg-surface); border-radius: 0 6px 6px 0; }
.explain b { color: var(--ink); }
.explain.ok { border-left-color: var(--ok); } .explain.bad { border-left-color: var(--bad); }
.qcard code, .explain code, .opt code { font-family: var(--font-mono); font-size: .85em; background: var(--code-bg); padding: .05em .3em; border-radius: 4px; overflow-wrap: anywhere; }

/* ---------- Home ---------- */
.home { display: grid; gap: 40px; }
.hero { display: grid; gap: 14px; padding-top: 8px; }
.hero h1 { margin: 0; font-size: clamp(2rem, 1.4rem + 2.6vw, 3rem); line-height: 1.08; font-weight: 800; letter-spacing: -.025em; text-wrap: balance; }
.hero h1 em { font-style: normal; color: var(--blueprint); }
.hero p { margin: 0; font-size: 1.12rem; color: var(--ink-soft); max-width: 60ch; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { border: 1px solid var(--rule-soft); border-radius: 10px; padding: 14px 16px; background: var(--bg-raised); display: grid; gap: 4px; }
.stat small { font-family: var(--font-mono); font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-mute); }
.stat b { font-size: 1.6rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .bar { margin-top: 6px; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; }
.section-title { font-size: 1.25rem; margin: 0 0 12px; font-weight: 700; }
.steps { counter-reset: s; display: grid; gap: 10px; padding: 0; margin: 0; list-style: none; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; color: var(--ink-soft); min-width: 0; }
.steps li > div { min-width: 0; }
.steps li::before { content: counter(s); font-family: var(--font-mono); font-size: .78rem; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--rule); display: grid; place-items: center; color: var(--blueprint); }
.lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.lcard { display: grid; grid-template-rows: auto 1fr auto; gap: 8px; padding: 14px 16px; border: 1px solid var(--rule-soft); border-radius: 10px; background: var(--bg-raised); text-decoration: none; color: var(--ink); transition: border-color .15s var(--ease-out), transform .15s var(--ease-out); }
.lcard:hover { border-color: var(--blueprint); transform: translateY(-1px); }
.lcard .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: .72rem; color: var(--ink-mute); }
.lcard h3 { margin: 0; font-size: 1.02rem; line-height: 1.35; font-weight: 650; }
.lcard .bottom { display: flex; flex-wrap: wrap; gap: 6px; font-size: .76rem; }
.pill { font-family: var(--font-mono); font-size: .68rem; letter-spacing: .04em; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--rule); color: var(--ink-soft); white-space: nowrap; }
.pill.build { border-color: var(--blueprint); color: var(--blueprint); }
.pill.done { border-color: var(--ok); color: var(--ok); background: var(--ok-wash); }
.foot { font-size: .82rem; color: var(--ink-mute); border-top: 1px solid var(--rule-soft); padding-top: 18px; line-height: 1.6; }

.scrim { display: none; }

@media (max-width: 1180px) {
  .wrap.has-toc { grid-template-columns: minmax(0, 1fr); }
  .toc { display: none; }

<script id="data" type="application/json">{"phase": "00-setup-and-tooling", "lessons": [{"id": "01", "slug": "01-dev-environment", "title_en": "Dev Environment", "title_vi": "Môi trường phát triển", "en": "# Dev Environment\n\n> Your tools shape your thinking. Set them up once, set them up right.\n\n**Type:** Build\n**Languages:** Python, Node.js, Rust\n**Prerequisites:** None\n**Time:** ~45 minutes\n\n## Learning Objectives\n\n- Set up Python 3.11+, Node.js 20+, and Rust toolchains from scratch\n- Configure virtual environments and package managers for reproducible builds\n- Verify GPU access with CUDA/MPS and run a test tensor operation\n- Understand the four-layer stack: system, packages, runtimes, AI libraries\n\n## The Problem\n\nYou're about to learn AI engineering across 500+ lessons using Python, TypeScript, Rust, and Julia. If your environment is broken, every single lesson becomes a fight against tooling instead of learning.\n\nMost people skip environment setup. Then they spend hours debugging import errors, version conflicts, and missing CUDA drivers. We're going to do this once, properly.\n\n## The Concept\n\nAn AI engineering environment has four layers:\n\n```mermaid\ngraph TD\n    A[\"4. AI/ML Libraries\\nPyTorch, JAX, transformers, etc.\"] --> B[\"3. Language Runtimes\\nPython 3.11+, Node 20+, Rust, Julia\"]\n    B --> C[\"2. Package Managers\\nuv, pnpm, cargo, juliaup\"]\n    C --> D[\"1. System Foundation\\nOS, shell, git, editor, GPU drivers\"]\n```\n\nWe install bottom-up. Each layer depends on the one below it.\n\n```figure\ns0-env-stack\n```\n\n## Build It\n\n### Step 1: System Foundation\n\nCheck your system and install the basics.\n\n```bash\n# macOS\nxcode-select --install\nbrew install git curl wget\n\n# Ubuntu/Debian\nsudo apt update && sudo apt install -y build-essential git curl wget unzip\n\n# Windows (use WSL2)\nwsl --install -d Ubuntu-24.04\n```\n\n### Step 2: Python with uv\n\nWe use `uv` — it's 10-100x faster than pip and handles virtual environments automatically.\n\n```bash\ncurl -LsSf https://astral.sh/uv/install.sh | sh\n\nuv python install 3.12\n\nuv venv\nsource .venv/bin/activate  # or .venv\\Scripts\\activate on Windows\n\nuv pip install numpy matplotlib jupyter\n```\n\nVerify:\n\n```python\nimport sys\nprint(f\"Python {sys.version}\")\n\nimport numpy as np\nprint(f\"NumPy {np.__version__}\")\na = np.array([1, 2, 3])\nprint(f\"Vector: {a}, dot product with itself: {np.dot(a, a)}\")\n```\n\n### Step 3: Node.js with pnpm\n\nFor TypeScript lessons (agents, MCP servers, web apps).\n\n```bash\ncurl -fsSL https://fnm.vercel.app/install | bash\nfnm install 22\nfnm use 22\n\nnpm install -g pnpm\n\nnode -e \"console.log('Node', process.version)\"\n```\n\nThe fnm installer checks for `unzip` first and exits with `Not installing fnm due to missing dependencies.` when it is absent: on Linux it unpacks a zip archive, on macOS it installs through Homebrew. macOS ships `unzip`; Ubuntu, Debian, and WSL2 get it from the Step 1 apt line (`sudo apt install -y unzip` if you skipped that step).\n\n**macOS / Apple Silicon (M1/M2/M3/M4):** If the installer stops with `Error: Cannot install under Rosetta 2 in ARM default prefix (/opt/homebrew)`, your terminal is running under Rosetta 2 (`arch` prints `i386`) while Homebrew is a native arm64 build. Install fnm forcing arm64, wire it into your shell, then rerun the commands above from `fnm install 22`:\n\n```bash\narch -arm64 brew install fnm\necho 'eval \"$(fnm env --use-on-cd)\"' >> ~/.zshrc\nsource ~/.zshrc\n```\n\n### Step 4: Rust\n\nFor performance-critical lessons (inference, systems).\n\n```bash\ncurl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh\n\nrustc --version\ncargo --version\n```\n\n### Step 5: Julia (Optional)\n\nFor math-heavy lessons where Julia shines.\n\n```bash\ncurl -fsSL https://install.julialang.org | sh\n\njulia -e 'println(\"Julia \", VERSION)'\n```\n\n### Step 6: GPU Setup (If You Have One)\n\n**NVIDIA (Linux / Windows):**\n\n```bash\nnvidia-smi\n\n# Install PyTorch with CUDA\nuv pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu124\n```\n\n**macOS / Apple Silicon (M1/M2/M3/M4):** There is no CUDA on a Mac — that's expected, not a failure. Do **not** pass `--index-url .../cuXXX` (those wheels are Linux/Windows only, so the install fails). Install the plain build, which includes Apple's MPS (Metal) GPU backend:\n\n```bash\nuv pip install torch torchvision torchaudio\n```\n\nVerify (works on any platform):\n\n```python\nimport torch\nprint(f\"CUDA available: {torch.cuda.is_available()}\")           # False on macOS — expected\nprint(f\"MPS available:  {torch.backends.mps.is_available()}\")   # True on Apple Silicon\nif torch.cuda.is_available():\n    print(f\"GPU: {torch.cuda.get_device_name(0)}\")\n```\n\nNo GPU? No problem. Most lessons work on CPU. For training-heavy lessons, use Google Colab or cloud GPUs.\n\n### Step 7: Verify the route you want to start\n\nRun every command in this lesson from the repository root, the directory that\ncontains `README.md` and `phases/`. The preflight checks only what you need to\nstart the selected route. It skips later tools by default so a new learner sees\none clear answer instead of a wall of warnings.\n\nStart the full beginner sequence:\n\n```bash\npython3 phases/00-setup-and-tooling/01-dev-environment/code/verify.py --route beginner\n```\n\nOr check only the route you want:\n\n```bash\npython3 phases/00-setup-and-tooling/01-dev-environment/code/verify.py --route ml-foundations\npython3 phases/00-setup-and-tooling/01-dev-environment/code/verify.py --route llm-engineering\npython3 phases/00-setup-and-tooling/01-dev-environment/code/verify.py --route agents\npython3 phases/00-setup-and-tooling/01-dev-environment/code/verify.py --route mcp\npython3 phases/00-setup-and-tooling/01-dev-environment/code/verify.py --route agent-skills\npython3 phases/00-setup-and-tooling/01-dev-environment/code/verify.py --route certification\n```\n\nAdd `--show-later` when you want the same preflight to inspect optional tools\nand dependencies used by later lessons. A missing later tool never blocks the\nselected route.\n\nEach failed required check includes the detected path or import error and an\nexact corrective command. The Agent Skills and certification routes also show\nmanual host checks because a Python script cannot prove that an AI host has\ndiscovered a skill or that your chosen skill scope is writable.\n\nWhen the beginner preflight passes, it prints the exact first runnable lesson:\n\n```text\nReady to start Beginner course.\nNext: python3 phases/01-math-foundations/01-linear-algebra-intuition/code/vectors.py\n```\n\n## Use It\n\nYour environment is ready to start the route you checked. Install later tools\nwhen a lesson asks for them instead of blocking your first lesson on the whole\nstack. Here is what you will use across the curriculum:\n\n| Language | Used In | Package Manager |\n|----------|---------|-----------------|\n| Python | Phases 1-12 (ML, DL, NLP, Vision, Audio, LLMs) | uv |\n| TypeScript | Phases 13-17 (Tools, Agents, Swarms, Infra) | pnpm |\n| Rust | Phases 12, 15-17 (Performance-critical systems) | cargo |\n| Julia | Phase 1 (Math foundations) | Pkg |\n\n## Ship It\n\nThis lesson produces a verification script that anyone can run to check their setup.\n\nSee `outputs/prompt-env-check.md` for a prompt that helps AI assistants diagnose environment issues.\n\n## Exercises\n\n1. Run the verification script and fix any failures\n2. Create a Python virtual environment for this course and install PyTorch\n3. Write a \"hello world\" in all four languages and run each one\n\n### Hints\n\n**Exercise 1.** Run `python3 phases/00-setup-and-tooling/01-dev-environment/code/verify.py --route beginner` from the repository root and fix the first failed line before you look at the next one. The check is done when you run the script again and every required probe passes.\n\n**Exercise 2.** Make the environment with `uv venv` in the repository root, activate it, then install PyTorch with the command from Step 6 that matches your hardware. Run `python -c \"import torch; print(torch.__version__)\"` inside the environment; a version number means the install worked.\n\n**Exercise 3.** Use the four runtimes from the stack in The Concept: Python, TypeScript on Node.js, Rust, and Julia. Write one small file for each and run it with `python3`, `npx tsx` (Node.js cannot run a `.ts` file directly), `cargo run` or `rustc`, and `julia`. Each run must print your message and exit with code 0.\n", "vi": "# Môi trường phát triển\n\n> Công cụ định hình cách bạn tư duy. Hãy cài đặt một lần, và cài cho đúng.\n\n**Type:** Build\n**Languages:** Python, Node.js, Rust\n**Prerequisites:** None\n**Time:** ~45 minutes\n\n## Mục tiêu bài học\n\n- Cài đặt từ đầu Python 3.11+, Node.js 20+ và toolchain Rust\n- Cấu hình môi trường ảo (venv) và trình quản lý package để có build tái lập được\n- Kiểm tra quyền truy cập GPU qua CUDA/MPS và chạy thử một phép toán tensor\n- Hiểu stack bốn tầng: hệ thống, package, runtime, thư viện AI\n\n## Vấn đề\n\nBạn sắp học AI engineering qua hơn 500 bài học với Python, TypeScript, Rust và Julia. Nếu môi trường bị hỏng, mỗi bài học sẽ biến thành một cuộc vật lộn với công cụ thay vì việc học.\n\nPhần lớn mọi người bỏ qua bước thiết lập môi trường. Rồi họ mất hàng giờ debug lỗi import, xung đột phiên bản và thiếu driver CUDA. Chúng ta sẽ làm việc này một lần, và làm cho đàng hoàng.\n\n## Khái niệm\n\nMột môi trường AI engineering có bốn tầng:\n\n```mermaid\ngraph TD\n    A[\"4. AI/ML Libraries\\nPyTorch, JAX, transformers, etc.\"] --> B[\"3. Language Runtimes\\nPython 3.11+, Node 20+, Rust, Julia\"]\n    B --> C[\"2. Package Managers\\nuv, pnpm, cargo, juliaup\"]\n    C --> D[\"1. System Foundation\\nOS, shell, git, editor, GPU drivers\"]\n```\n\nChúng ta cài từ dưới lên. Mỗi tầng phụ thuộc vào tầng ngay bên dưới.\n\n```figure\ns0-env-stack\n```\n\n## Tự xây dựng\n\n### Bước 1: Nền tảng hệ thống\n\nKiểm tra hệ thống và cài các công cụ cơ bản.\n\n```bash\n# macOS\nxcode-select --install\nbrew install git curl wget\n\n# Ubuntu/Debian\nsudo apt update && sudo apt install -y build-essential git curl wget unzip\n\n# Windows (use WSL2)\nwsl --install -d Ubuntu-24.04\n```\n\n### Bước 2: Python với uv\n\nChúng ta dùng `uv` — nó nhanh hơn pip từ 10-100 lần và tự động quản lý môi trường ảo.\n\n```bash\ncurl -LsSf https://astral.sh/uv/install.sh | sh\n\nuv python install 3.12\n\nuv venv\nsource .venv/bin/activate  # or .venv\\Scripts\\activate on Windows\n\nuv pip install numpy matplotlib jupyter\n```\n\nKiểm tra:\n\n```python\nimport sys\nprint(f\"Python {sys.version}\")\n\nimport numpy as np\nprint(f\"NumPy {np.__version__}\")\na = np.array([1, 2, 3])\nprint(f\"Vector: {a}, dot product with itself: {np.dot(a, a)}\")\n```\n\n### Bước 3: Node.js với pnpm\n\nDành cho các bài học TypeScript (agent, MCP server, web app).\n\n```bash\ncurl -fsSL https://fnm.vercel.app/install | bash\nfnm install 22\nfnm use 22\n\nnpm install -g pnpm\n\nnode -e \"console.log('Node', process.version)\"\n```\n\nTrình cài đặt fnm sẽ kiểm tra `unzip` trước, và nếu không có thì thoát với thông báo `Not installing fnm due to missing dependencies.`: trên Linux nó giải nén một file zip, còn trên macOS nó cài qua Homebrew. macOS có sẵn `unzip`; Ubuntu, Debian và WSL2 đã có nó từ dòng apt ở Bước 1 (chạy `sudo apt install -y unzip` nếu bạn đã bỏ qua bước đó).\n\n**macOS / Apple Silicon (M1/M2/M3/M4):** Nếu trình cài đặt dừng lại với lỗi `Error: Cannot install under Rosetta 2 in ARM default prefix (/opt/homebrew)`, nghĩa là terminal của bạn đang chạy dưới Rosetta 2 (`arch` in ra `i386`) trong khi Homebrew là bản build arm64 native. Hãy cài fnm với arm64 bắt buộc, nối nó vào shell, rồi chạy lại các lệnh ở trên bắt đầu từ `fnm install 22`:\n\n```bash\narch -arm64 brew install fnm\necho 'eval \"$(fnm env --use-on-cd)\"' >> ~/.zshrc\nsource ~/.zshrc\n```\n\n### Bước 4: Rust\n\nDành cho các bài học cần hiệu năng cao (inference, hệ thống).\n\n```bash\ncurl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh\n\nrustc --version\ncargo --version\n```\n\n### Bước 5: Julia (Tùy chọn)\n\nDành cho các bài học nặng về toán, nơi Julia tỏa sáng.\n\n```bash\ncurl -fsSL https://install.julialang.org | sh\n\njulia -e 'println(\"Julia \", VERSION)'\n```\n\n### Bước 6: Thiết lập GPU (nếu bạn có)\n\n**NVIDIA (Linux / Windows):**\n\n```bash\nnvidia-smi\n\n# Install PyTorch with CUDA\nuv pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu124\n```\n\n**macOS / Apple Silicon (M1/M2/M3/M4):** Mac không có CUDA — điều này là bình thường, không phải lỗi. **Không** truyền `--index-url .../cuXXX` (các wheel đó chỉ dành cho Linux/Windows, nên cài sẽ thất bại). Hãy cài bản build thông thường, vốn đã có sẵn backend GPU MPS (Metal) của Apple:\n\n```bash\nuv pip install torch torchvision torchaudio\n```\n\nKiểm tra (chạy được trên mọi nền tảng):\n\n```python\nimport torch\nprint(f\"CUDA available: {torch.cuda.is_available()}\")           # False on macOS — expected\nprint(f\"MPS available:  {torch.backends.mps.is_available()}\")   # True on Apple Silicon\nif torch.cuda.is_available():\n    print(f\"GPU: {torch.cuda.get_device_name(0)}\")\n```\n\nKhông có GPU? Không sao. Hầu hết bài học chạy được trên CPU. Với các bài học cần train nặng, hãy dùng Google Colab hoặc GPU trên cloud.\n\n### Bước 7: Kiểm tra lộ trình bạn muốn bắt đầu\n\nChạy mọi lệnh trong bài này từ thư mục gốc của repo, tức thư mục chứa\n`README.md` và `phases/`. Bước kiểm tra trước (preflight) chỉ kiểm tra những gì bạn cần\nđể bắt đầu lộ trình đã chọn. Mặc định nó bỏ qua các công cụ dùng ở phần sau, để người mới\nnhận được một câu trả lời rõ ràng thay vì cả một bức tường cảnh báo.\n\nBắt đầu với toàn bộ chuỗi bài cho người mới:\n\n```bash\npython3 phases/00-setup-and-tooling/01-dev-environment/code/verify.py --route beginner\n```\n\nHoặc chỉ kiểm tra lộ trình bạn muốn:\n\n```bash\npython3 phases/00-setup-and-tooling/01-dev-environment/code/verify.py --route ml-foundations\npython3 phases/00-setup-and-tooling/01-dev-environment/code/verify.py --route llm-engineering\npython3 phases/00-setup-and-tooling/01-dev-environment/code/verify.py --route agents\npython3 phases/00-setup-and-tooling/01-dev-environment/code/verify.py --route mcp\npython3 phases/00-setup-and-tooling/01-dev-environment/code/verify.py --route agent-skills\npython3 phases/00-setup-and-tooling/01-dev-environment/code/verify.py --route certification\n```\n\nThêm `--show-later` khi bạn muốn chính bước preflight đó kiểm tra cả các công cụ tùy chọn\nvà dependency được dùng trong các bài học sau. Thiếu một công cụ dùng ở phần sau không bao giờ\nchặn lộ trình đã chọn.\n\nMỗi bước kiểm tra bắt buộc bị thất bại sẽ kèm theo đường dẫn phát hiện được hoặc lỗi import, cùng\nmột lệnh khắc phục cụ thể. Lộ trình Agent Skills và certification còn hiển thị thêm các bước\nkiểm tra thủ công trên host, vì một script Python không thể chứng minh rằng AI host đã\nnhận diện được một skill, hay phạm vi skill bạn chọn có ghi được hay không.\n\nKhi preflight cho người mới chạy thành công, nó in ra chính xác bài học đầu tiên có thể chạy được:\n\n```text\nReady to start Beginner course.\nNext: python3 phases/01-math-foundations/01-linear-algebra-intuition/code/vectors.py\n```\n\n## Ứng dụng\n\nMôi trường của bạn đã sẵn sàng để bắt đầu lộ trình vừa kiểm tra. Hãy cài các công cụ khác\nkhi bài học yêu cầu, thay vì để bài học đầu tiên bị chặn bởi việc cài cả\nstack. Đây là những gì bạn sẽ dùng xuyên suốt chương trình học:\n\n| Ngôn ngữ | Dùng trong | Trình quản lý package |\n|----------|---------|-----------------|\n| Python | Phase 1-12 (ML, DL, NLP, Vision, Audio, LLM) | uv |\n| TypeScript | Phase 13-17 (Tool, Agent, Swarm, Hạ tầng) | pnpm |\n| Rust | Phase 12, 15-17 (Hệ thống cần hiệu năng cao) | cargo |\n| Julia | Phase 1 (Nền tảng toán học) | Pkg |\n\n## Đóng gói & sử dụng\n\nBài học này tạo ra một script kiểm tra mà bất kỳ ai cũng có thể chạy để kiểm tra thiết lập của mình.\n\nXem `outputs/prompt-env-check.md` để có một prompt giúp các trợ lý AI chẩn đoán vấn đề về môi trường.\n\n## Bài tập\n\n1. Chạy script kiểm tra và sửa mọi lỗi\n2. Tạo một môi trường ảo Python cho khóa học này và cài PyTorch\n3. Viết chương trình \"hello world\" bằng cả bốn ngôn ngữ và chạy từng cái\n\n### Gợi ý\n\n**Bài tập 1.** Chạy `python3 phases/00-setup-and-tooling/01-dev-environment/code/verify.py --route beginner` từ thư mục gốc của repo và sửa dòng lỗi đầu tiên trước khi xem dòng tiếp theo. Bài tập hoàn thành khi bạn chạy lại script và mọi bước kiểm tra bắt buộc đều qua.\n\n**Bài tập 2.** Tạo môi trường bằng `uv venv` ở thư mục gốc của repo, kích hoạt nó, rồi cài PyTorch bằng lệnh ở Bước 6 phù hợp với phần cứng của bạn. Chạy `python -c \"import torch; print(torch.__version__)\"` bên trong môi trường; nếu in ra số phiên bản nghĩa là cài đặt đã thành công.\n\n**Bài tập 3.** Dùng bốn runtime trong stack ở phần Khái niệm: Python, TypeScript trên Node.js, Rust và Julia. Viết một file nhỏ cho mỗi ngôn ngữ và chạy bằng `python3`, `npx tsx` (Node.js không chạy trực tiếp được file `.ts`), `cargo run` hoặc `rustc`, và `julia`. Mỗi lần chạy phải in ra thông điệp của bạn và thoát với mã 0.\n", "quiz": {"questions": [{"stage": "pre", "question": "Vì sao các dự án AI cần một môi trường ảo (venv) riêng?", "options": ["Python bắt buộc phải có môi trường ảo mới import được package", "Môi trường ảo cô lập dependency để các dự án khác nhau không xung đột", "Môi trường ảo giúp code chạy nhanh hơn", "Môi trường ảo cấp quyền truy cập GPU"], "correct": 1, "explanation": "Môi trường ảo cô lập phiên bản package theo từng dự án. Nếu không có nó, việc nâng cấp PyTorch cho dự án này có thể làm hỏng dự án khác đang phụ thuộc vào phiên bản cũ hơn."}, {"stage": "pre", "question": "CUDA cung cấp gì cho các workload AI?", "options": ["Tính toán song song trên GPU NVIDIA cho các phép toán ma trận", "Một trình quản lý package Python cho các thư viện ML", "Một web framework để triển khai mô hình", "Một container runtime để serve mô hình"], "correct": 0, "explanation": "CUDA là nền tảng tính toán song song của NVIDIA, cho phép bạn chạy phép toán ma trận trên hàng nghìn nhân GPU cùng lúc. PyTorch và TensorFlow dùng nó ở bên dưới."}, {"stage": "post", "question": "Trong stack môi trường bốn tầng, tầng nào phải được cài đặt đầu tiên?", "options": ["Language Runtime (Python, Node.js)", "Nền tảng hệ thống (OS, shell, GPU driver)", "Trình quản lý package (pip, npm, cargo)", "Thư viện AI/ML (PyTorch, JAX)"], "correct": 1, "explanation": "Bạn cài từ dưới lên: nền tảng hệ thống trước (OS, driver), sau đó là trình quản lý package, rồi language runtime, cuối cùng là thư viện AI. Mỗi tầng phụ thuộc vào tầng bên dưới."}, {"stage": "post", "question": "uv dùng để làm gì trong một dự án AI bằng Python?", "options": ["Một công cụ giám sát GPU", "Một thư viện trực quan hóa mạng nơ-ron", "Một công cụ cài đặt và resolve package Python cực nhanh", "Một compiler CUDA cho custom kernel"], "correct": 2, "explanation": "uv là công cụ cài package Python rất nhanh, viết bằng Rust. Nó thay thế pip với tốc độ resolve và cài dependency nhanh hơn nhiều, thường gấp 10-100 lần."}, {"stage": "post", "question": "Làm sao để kiểm tra PyTorch có truy cập được GPU của bạn hay không?", "options": ["python -c 'import gpu'", "import torch; print(torch.cuda.is_available())", "import torch; print(torch.__version__)", "nvidia-smi --query"], "correct": 1, "explanation": "torch.cuda.is_available() trả về True nếu PyTorch truy cập được GPU CUDA. Trên Apple Silicon, dùng torch.backends.mps.is_available() để kiểm tra Metal Performance Shaders."}]}, "quiz_lang": "vi", "code": [{"path": "code/main.rs", "lang": "rust", "content": "// Lesson: Dev Environment (phase 00 / lesson 01)\n// Topic: verify that the four-layer toolchain (system, package managers, runtimes, libs)\n// is reachable from a Rust binary. Spawns each tool with `--version`, captures stdout,\n// reports PASS/FAIL plus the parsed version string. Stdlib only.\n// Refs:\n//   https://doc.rust-lang.org/std/process/struct.Command.html\n//   https://doc.rust-lang.org/std/process/struct.Output.html\n//   https://doc.rust-lang.org/book/ch12-00-an-io-project.html\n// Build: rustc --edition 2021 code/main.rs -o /tmp/lesson_dev_env && /tmp/lesson_dev_env\n\nuse std::process::{Command, ExitCode};\n\nstruct Check {\n    name: &'static str,\n    program: &'static str,\n    args: &'static [&'static str],\n    optional: bool,\n}\n\nimpl Check {\n    const fn new(name: &'static str, program: &'static str, optional: bool) -> Self {\n        Check {\n            name,\n            program,\n            args: &[\"--version\"],\n            optional,\n        }\n    }\n}\n\nconst CHECKS: &[Check] = &[\n    Check::new(\"Git\", \"git\", false),\n    Check::new(\"Python 3.10+\", \"python3\", false),\n    Check::new(\"Node.js\", \"node\", false),\n    Check::new(\"Rust (rustc)\", \"rustc\", false),\n    Check::new(\"Cargo\", \"cargo\", false),\n    Check::new(\"uv (Python)\", \"uv\", true),\n    Check::new(\"pnpm\", \"pnpm\", true),\n    Check::new(\"Julia\", \"julia\", true),\n];\n\nfn run_check(check: &Check) -> Result<String, String> {\n    let output = Command::new(check.program)\n        .args(check.args)\n        .output()\n        .map_err(|e| format!(\"{}: {}\", check.program, e))?;\n\n    if !output.status.success() {\n        return Err(format!(\"exit code {:?}\", output.status.code()));\n    }\n\n    let combined = if !output.stdout.is_empty() {\n        &output.stdout\n    } else {\n        &output.stderr\n    };\n\n    let raw = String::from_utf8_lossy(combined);\n    let line = raw.lines().next().unwrap_or(\"\").trim().to_string();\n    if line.is_empty() {\n        Err(\"empty version output\".to_string())\n    } else {\n        Ok(line)\n    }\n}\n\nfn parse_minor_python(version_line: &str) -> Option<(u32, u32)> {\n    let trimmed = version_line.trim_start_matches(\"Python\").trim();\n    let mut parts = trimmed.split('.');\n    let major: u32 = parts.next()?.parse().ok()?;\n    let minor: u32 = parts.next()?.parse().ok()?;\n    Some((major, minor))\n}\n\nfn print_header() {\n    println!();\n    println!(\"=== AI Engineering from Scratch — Environment Check (Rust) ===\");\n    println!();\n    println!(\"Layer 1 (system) -> Layer 2 (package managers) -> Layer 3 (runtimes) -> Layer 4 (libs)\");\n    println!();\n}\n\nfn main() -> ExitCode {\n    print_header();\n\n    let mut required_pass = 0u32;\n    let mut required_total = 0u32;\n    let mut optional_pass = 0u32;\n    let mut optional_total = 0u32;\n\n    let mut python_ok = true;\n\n    println!(\"Required tools:\");\n    for check in CHECKS.iter().filter(|c| !c.optional) {\n        required_total += 1;\n        match run_check(check) {\n            Ok(version) => {\n                if check.name.starts_with(\"Python\") {\n                    match parse_minor_python(&version) {\n                        Some((major, minor)) if (major, minor) >= (3, 10) => {}\n                        _ => {\n                            println!(\"  [FAIL] {:<14} {} (need parseable Python 3.10+)\", check.name, version);\n                            python_ok = false;\n                            continue;\n                        }\n                    }\n                }\n                required_pass += 1;\n                println!(\"  [PASS] {:<14} {}\", check.name, version);\n            }\n            Err(why) => {\n                println!(\"  [FAIL] {:<14} {}\", check.name, why);\n                if check.name.starts_with(\"Python\") {\n                    python_ok = false;\n                }\n            }\n        }\n    }\n\n    println!();\n    println!(\"Optional tools:\");\n    for check in CHECKS.iter().filter(|c| c.optional) {\n        optional_total += 1;\n        match run_check(check) {\n            Ok(version) => {\n                optional_pass += 1;\n                println!(\"  [PASS] {:<14} {}\", check.name, version);\n            }\n            Err(_) => {\n                println!(\"  [skip] {:<14} not installed\", check.name);\n            }\n        }\n    }\n\n    println!();\n    println!(\"Summary: {}/{} required, {}/{} optional\",\n             required_pass, required_total, optional_pass, optional_total);\n\n    if required_pass == required_total && python_ok {\n        println!();\n        println!(\"Environment is ready. Start with Phase 1.\");\n        ExitCode::SUCCESS\n    } else {\n        println!();\n        println!(\"Fix the failed checks above, then run this again.\");\n        ExitCode::from(1)\n    }\n}\n"}, {"path": "code/verify.py", "lang": "python", "content": "\"\"\"Route-aware environment preflight for AI Engineering from Scratch.\n\nLesson: phases/00-setup-and-tooling/01-dev-environment/docs/en.md\nRun this file from the repository root before starting a learning route.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport importlib.util\nimport platform\nimport shutil\nimport subprocess\nimport sys\nfrom dataclasses import dataclass\nfrom typing import Callable\n\n\n@dataclass(frozen=True)\nclass Result:\n    ok: bool\n    detail: str\n\n\n@dataclass(frozen=True)\nclass Probe:\n    label: str\n    run: Callable[[], Result]\n    fix: str\n\n\n@dataclass(frozen=True)\nclass Route:\n    label: str\n    required: tuple[str, ...]\n    optional: tuple[str, ...]\n    next_command: str\n    manual: tuple[str, ...] = ()\n\n\ndef command_result(command: str, minimum_major: int | None = None) -> Result:\n    path = shutil.which(command)\n    if path is None:\n        return Result(False, f\"{command!r} was not found on PATH\")\n\n    try:\n        process = subprocess.run(\n            [path, \"--version\"],\n            check=False,\n            capture_output=True,\n            text=True,\n            timeout=5,\n        )\n    except (OSError, subprocess.SubprocessError) as exc:\n        return Result(False, f\"could not run {path}: {exc}\")\n\n    output = (process.stdout or process.stderr).strip().splitlines()\n    detail = output[0] if output else f\"exit code {process.returncode} with no version output\"\n    if process.returncode != 0:\n        return Result(False, detail)\n\n    if minimum_major is not None:\n        digits = \"\".join(character if character.isdigit() else \" \" for character in detail)\n        parts = digits.split()\n        if not parts:\n            return Result(False, f\"could not parse a version from {detail!r}\")\n        major = int(parts[0])\n        if major < minimum_major:\n            return Result(False, f\"found {detail}; need version {minimum_major}+\")\n\n    return Result(True, f\"{detail} at {path}\")\n\n\ndef python_result() -> Result:\n    version = platform.python_version()\n    executable = sys.executable\n    if sys.version_info < (3, 11):\n        return Result(False, f\"found Python {version} at {executable}; need Python 3.11+\")\n    return Result(True, f\"Python {version} at {executable}\")\n\n\ndef module_result(module: str) -> Result:\n    if importlib.util.find_spec(module) is None:\n        return Result(False, f\"{module!r} is not importable by {sys.executable}\")\n    return Result(True, f\"importable by {sys.executable}\")\n\n\ndef gpu_result() -> Result:\n    if importlib.util.find_spec(\"torch\") is None:\n        return Result(False, \"PyTorch is not installed, so no accelerator backend was checked\")\n\n    try:\n        import torch\n    except Exception as exc:\n        return Result(False, f\"PyTorch could not be imported: {type(exc).__name__}: {exc}\")\n\n    if torch.cuda.is_available():\n        return Result(True, f\"CUDA: {torch.cuda.get_device_name(0)}\")\n    mps = getattr(getattr(torch, \"backends\", None), \"mps\", None)\n    if mps is not None and mps.is_available():\n        return Result(True, \"Apple MPS is available\")\n    return Result(True, \"CPU only; a GPU is optional for the starting lessons\")\n\n\ndef git_fix() -> str:\n    system = platform.system()\n    if system == \"Darwin\":\n        return \"Run `xcode-select --install`, then `git --version`.\"\n    if system == \"Windows\":\n        return \"Run `winget install --id Git.Git -e`, then `git --version`.\"\n    return \"Run `sudo apt-get update && sudo apt-get install -y git`, then `git --version`.\"\n\n\nPROBES = {\n    \"python\": Probe(\n        \"Python 3.11+\",\n        python_result,\n        \"Install it with `uv python install 3.12`, activate that environment, and rerun with `python3`.\",\n    ),\n    \"git\": Probe(\"Git\", lambda: command_result(\"git\"), git_fix()),\n    \"node\": Probe(\n        \"Node.js 20+\",\n        lambda: command_result(\"node\", minimum_major=20),\n        \"Run `fnm install 22 && fnm use 22`, then `node --version`.\",\n    ),\n    \"npx\": Probe(\n        \"npx\",\n        lambda: command_result(\"npx\"),\n        \"Install Node.js 22, then run `npm install -g npm` and `npx --version`.\",\n    ),\n    \"cargo\": Probe(\n        \"Rust cargo\",\n        lambda: command_result(\"cargo\"),\n        \"Install Rust with rustup, restart the shell, then run `cargo --version`.\",\n    ),\n    \"julia\": Probe(\n        \"Julia\",\n        lambda: command_result(\"julia\"),\n        \"Install Julia with juliaup, restart the shell, then run `julia --version`.\",\n    ),\n    \"numpy\": Probe(\n        \"NumPy\",\n        lambda: module_result(\"numpy\"),\n        \"Activate the course environment and run `python3 -m pip install numpy`.\",\n    ),\n    \"matplotlib\": Probe(\n        \"Matplotlib\",\n        lambda: module_result(\"matplotlib\"),\n        \"Activate the course environment and run `python3 -m pip install matplotlib`.\",\n    ),\n    \"jupyter\": Probe(\n        \"Jupyter\",\n        lambda: module_result(\"jupyter\"),\n        \"Activate the course environment and run `python3 -m pip install jupyter`.\",\n    ),\n    \"torch\": Probe(\n        \"PyTorch\",\n        lambda: module_result(\"torch\"),\n        \"Activate the course environment and run `python3 -m pip install torch`.\",\n    ),\n    \"gpu\": Probe(\n        \"Accelerator backend\",\n        gpu_result,\n        \"A GPU is optional. Install PyTorch first if you want CUDA or Apple MPS detection.\",\n    ),\n}\n\n\nBASE_OPTIONAL = (\"node\", \"npx\", \"numpy\", \"matplotlib\", \"jupyter\", \"torch\", \"gpu\", \"cargo\", \"julia\")\n\nROUTES = {\n    \"beginner\": Route(\n        \"Beginner course\",\n        (\"python\", \"git\"),\n        BASE_OPTIONAL,\n        \"python3 phases/01-math-foundations/01-linear-algebra-intuition/code/vectors.py\",\n    ),\n    \"ml-foundations\": Route(\n        \"Math and ML foundations\",\n        (\"python\", \"git\", \"numpy\"),\n        (\"matplotlib\", \"jupyter\", \"torch\", \"gpu\", \"julia\"),\n        \"python3 phases/01-math-foundations/01-linear-algebra-intuition/code/vectors.py\",\n    ),\n    \"llm-engineering\": Route(\n        \"LLM engineering\",\n        (\"python\", \"git\"),\n        (\"numpy\", \"torch\", \"gpu\", \"node\", \"npx\", \"cargo\"),\n        \"python3 phases/11-llm-engineering/01-prompt-engineering/code/prompt_engineering.py\",\n    ),\n    \"agents\": Route(\n        \"Agent engineering\",\n        (\"python\", \"git\"),\n        (\"node\", \"npx\", \"numpy\", \"torch\"),\n        \"python3 phases/14-agent-engineering/01-the-agent-loop/code/main.py\",\n    ),\n    \"mcp\": Route(\n        \"Model Context Protocol (MCP)\",\n        (\"python\", \"git\"),\n        (\"node\", \"npx\"),\n        \"python3 phases/13-tools-and-protocols/06-mcp-fundamentals/code/main.py\",\n    ),\n    \"agent-skills\": Route(\n        \"Agent Skills engineering\",\n        (\"python\", \"git\", \"node\", \"npx\"),\n        (),\n        \"python3 phases/13-tools-and-protocols/22-skills-and-agent-sdks/code/main.py\",\n        (\n            \"Choose one skill-capable host and confirm it is installed.\",\n            \"Choose a user or project skill scope and confirm it is writable.\",\n        ),\n    ),\n    \"certification\": Route(\n        \"Claude certification preparation\",\n        (\"python\", \"git\"),\n        (\"node\", \"npx\"),\n        \"Open certifications/claude/GETTING_STARTED.md and choose a track.\",\n        (\"If using the AI tutor, confirm your selected host can read repository skills.\",),\n    ),\n}\n\n\ndef parse_args() -> argparse.Namespace:\n    parser = argparse.ArgumentParser(\n        description=\"Check only the tools needed to start a selected curriculum route.\"\n    )\n    parser.add_argument(\n        \"--route\",\n        choices=tuple(ROUTES),\n        default=\"beginner\",\n        help=\"learning route to prepare for (default: beginner)\",\n    )\n    parser.add_argument(\n        \"--show-later\",\n        action=\"store_true\",\n        help=\"also check tools that are optional now or required by later lessons\",\n    )\n    return parser.parse_args()\n\n\ndef print_probe(key: str, required: bool) -> bool:\n    probe = PROBES[key]\n    result = probe.run()\n    if result.ok:\n        status = \"PASS\"\n    elif required:\n        status = \"FAIL\"\n    else:\n        status = \"LATER\"\n    timing = \"required now\" if required else \"optional or needed later\"\n    print(f\"  [{status}] {probe.label} ({timing})\")\n    print(f\"         {result.detail}\")\n    if not result.ok:\n        print(f\"         Fix: {probe.fix}\")\n    return result.ok\n\n\ndef main() -> int:\n    args = parse_args()\n    route = ROUTES[args.route]\n\n    print(\"\\n=== AI Engineering from Scratch: Environment Check ===\\n\")\n    print(f\"Route: {route.label} (`--route {args.route}`)\\n\")\n\n    passed = 0\n    for key in route.required:\n        passed += int(print_probe(key, required=True))\n\n    if route.optional and args.show_later:\n        print(\"\\nOptional or needed later:\")\n        for key in route.optional:\n            print_probe(key, required=False)\n    elif route.optional:\n        print(\n            f\"\\nLater checks skipped: {len(route.optional)} tools are not needed to start. \"\n            \"Add `--show-later` when you want to inspect them.\"\n        )\n\n    if route.manual:\n        print(\"\\nManual checks:\")\n        for item in route.manual:\n            print(f\"  [MANUAL] {item}\")\n\n    total = len(route.required)\n    print(f\"\\nResult: {passed}/{total} required checks passed\")\n    if passed == total:\n        print(f\"Ready to start {route.label}.\")\n        print(f\"Next: {route.next_command}\\n\")\n        return 0\n\n    print(\"Not ready yet. Run each Fix command above, then repeat this preflight.\\n\")\n    return 1\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n"}, {"path": "code/verify.ts", "lang": "typescript", "content": "// Phase 0 · Lesson 01 — Dev Environment verifier (TypeScript port).\n// Probes node version + presence of git, python3, cargo, deno; mirrors verify.py.\n// Refs: https://nodejs.org/api/process.html  https://nodejs.org/api/child_process.html\n\nimport { execFileSync } from \"node:child_process\";\nimport process from \"node:process\";\n\ntype ProbeFn = () => { ok: boolean; detail?: string };\n\ntype Probe = {\n  name: string;\n  required: boolean;\n  run: ProbeFn;\n};\n\nfunction whichVersion(cmd: string, args: string[] = [\"--version\"]): ReturnType<ProbeFn> {\n  // execFile (not exec) avoids a shell, so user PATH lookups can't be re-interpreted.\n  try {\n    const out = execFileSync(cmd, args, {\n      stdio: [\"ignore\", \"pipe\", \"ignore\"],\n      encoding: \"utf8\",\n      timeout: 4000,\n    });\n    return { ok: true, detail: out.trim().split(\"\\n\")[0] };\n  } catch {\n    return { ok: false };\n  }\n}\n\nconst PROBES: Probe[] = [\n  {\n    name: \"Node.js 20+\",\n    required: true,\n    run: () => {\n      const major = Number.parseInt(process.versions.node.split(\".\")[0]!, 10);\n      return { ok: major >= 20, detail: `v${process.versions.node}` };\n    },\n  },\n  {\n    name: \"TypeScript runner (tsx)\",\n    required: false,\n    run: () => whichVersion(\"npx\", [\"-y\", \"tsx\", \"--version\"]),\n  },\n  {\n    name: \"Git\",\n    required: true,\n    run: () => whichVersion(\"git\"),\n  },\n  {\n    name: \"Python 3.10+\",\n    required: true,\n    run: () => {\n      const probe = whichVersion(\"python3\");\n      if (!probe.ok || !probe.detail) return probe;\n      // Detail looks like \"Python 3.11.7\"; pull major.minor.\n      const match = probe.detail.match(/(\\d+)\\.(\\d+)/);\n      if (!match) return { ok: false, detail: probe.detail };\n      const [major, minor] = [Number(match[1]), Number(match[2])];\n      const ok = major > 3 || (major === 3 && minor >= 10);\n      return { ok, detail: probe.detail };\n    },\n  },\n  {\n    name: \"Rust (cargo)\",\n    required: false,\n    run: () => whichVersion(\"cargo\"),\n  },\n  {\n    name: \"Deno\",\n    required: false,\n    run: () => whichVersion(\"deno\"),\n  },\n];\n\nfunction run(): number {\n  process.stdout.write(\"\\n=== AI Engineering from Scratch — Environment Check ===\\n\\n\");\n\n  let requiredPassed = 0;\n  let requiredTotal = 0;\n\n  for (const probe of PROBES) {\n    const result = probe.run();\n    const tag = result.ok ? \"PASS\" : \"FAIL\";\n    const detail = result.detail ? ` (${result.detail})` : \"\";\n    const flag = probe.required ? \"\" : \"  [optional]\";\n    process.stdout.write(`  [${tag}] ${probe.name}${detail}${flag}\\n`);\n    if (probe.required) {\n      requiredTotal += 1;\n      if (result.ok) requiredPassed += 1;\n    }\n  }\n\n  process.stdout.write(`\\nResult: ${requiredPassed}/${requiredTotal} required checks passed\\n`);\n  if (requiredPassed === requiredTotal) {\n    process.stdout.write(\"\\nYou're ready. Start with Phase 1.\\n\\n\");\n    return 0;\n  }\n  process.stdout.write(\"\\nFix the failed required checks above, then re-run.\\n\\n\");\n  return 1;\n}\n\nprocess.exit(run());\n"}, {"path": "outputs/prompt-env-check.md", "lang": "markdown", "content": "---\nname: prompt-env-check\ndescription: Diagnose and fix AI engineering environment setup issues\nphase: 0\nlesson: 1\n---\n\nYou are an AI engineering environment diagnostician. The user is setting up their development environment for an AI/ML course that uses Python, TypeScript, Rust, and Julia.\n\nWhen the user describes an issue:\n\n1. Identify which layer is broken (system, package manager, runtime, or library)\n2. Ask for the output of the relevant diagnostic command\n3. Provide the exact fix — not a general guide, the specific commands to run\n\nCommon issues and fixes:\n\n- **Python version too old**: Install with `uv python install 3.12`\n- **CUDA not detected (Linux/Windows + NVIDIA)**: Check `nvidia-smi`, then reinstall PyTorch with the correct CUDA version\n- **macOS / Apple Silicon**: There is no CUDA on macOS — this is expected, not a failure. Do not use `--index-url .../cuXXX`; install plain `uv pip install torch torchvision torchaudio` and use the MPS (Metal) backend. Verify with `python -c \"import torch; print(torch.backends.mps.is_available())\"` (should print `True`)\n- **Node.js missing**: Install with `fnm install 22`\n- **Import errors after install**: Check you're in the right virtual environment with `which python`\n- **Permission errors**: Never use `sudo pip install`, use `uv` with a virtual environment instead\n\nAlways verify the fix worked by asking the user to run the verification script:\n```bash\npython phases/00-setup-and-tooling/01-dev-environment/code/verify.py\n```\n"}]}, {"id": "02", "slug": "02-git-and-collaboration", "title_en": "Git & Collaboration", "title_vi": "Git & cộng tác", "en": "# Git & Collaboration\n\n> Version control is not optional. Every experiment, every model, every lesson you build here gets tracked.\n\n**Type:** Learn\n**Languages:** --\n**Prerequisites:** Phase 0, Lesson 01\n**Time:** ~30 minutes\n\n## Learning Objectives\n\n- Configure git identity and use the daily workflow of add, commit, and push\n- Create and merge branches for isolated experiments without breaking main\n- Write a `.gitignore` that excludes model checkpoints and large binary files\n- Navigate the commit history with `git log` to understand project evolution\n\n## The Problem\n\nYou're about to write hundreds of code files across 20 phases. Without version control you will lose work, break things you can't undo, and have no way to collaborate with others.\n\nGit is the tool. GitHub is where the code lives. This lesson covers what you need for this course and nothing more.\n\n## The Concept\n\n```mermaid\nsequenceDiagram\n    participant WD as Working Directory\n    participant SA as Staging Area\n    participant LR as Local Repo\n    participant R as Remote (GitHub)\n    WD->>SA: git add\n    SA->>LR: git commit\n    LR->>R: git push\n    R->>LR: git fetch\n    LR->>WD: git pull\n```\n\nThree things to remember:\n1. Save often (`git commit`)\n2. Push to remote (`git push`)\n3. Branch for experiments (`git checkout -b experiment`)\n\n```figure\ns0-commit-dag\n```\n\n## Build It\n\n### Step 1: Configure git\n\n```bash\ngit config --global user.name \"Your Name\"\ngit config --global user.email \"you@example.com\"\n```\n\n### Step 2: The daily workflow\n\n```bash\ngit status\ngit add file.py\ngit commit -m \"Add perceptron implementation\"\ngit push origin main\n```\n\n### Step 3: Branching for experiments\n\n```bash\ngit checkout -b experiment/new-optimizer\n\n# ... make changes, commit ...\n\ngit checkout main\ngit merge experiment/new-optimizer\n```\n\n### Step 4: Working with this course repo\n\nYou can't push to the course repo itself — only maintainers have write access. Fork it on GitHub first (the Fork button, top right) so `origin` points at your own copy:\n\n```bash\ngit clone https://github.com/YOUR-USERNAME/ai-engineering-from-scratch.git\ncd ai-engineering-from-scratch\n\ngit checkout -b my-progress\n# work through lessons, commit your code\ngit push origin my-progress\n```\n\n## Use It\n\nFor this course, you need exactly these commands:\n\n| Command | When |\n|---------|------|\n| `git clone` | Get the course repo |\n| `git add` + `git commit` | Save your work |\n| `git push` | Back it up to GitHub |\n| `git checkout -b` | Try something without breaking main |\n| `git log --oneline` | See what you've done |\n\nThat's it. You don't need rebase, cherry-pick, or submodules for this course.\n\n## Exercises\n\n1. Fork this repo, clone your fork, create a branch called `my-progress`, make a file, commit it, push it\n2. Create a `.gitignore` that excludes model checkpoint files (`.pt`, `.pth`, `.safetensors`)\n3. Look at the commit history of this repo with `git log --oneline` and read how lessons were added\n\n### Hints\n\n**Exercise 1.** Click Fork on GitHub, then `git clone` the URL of your own fork. After `git push -u origin my-progress`, open your fork on GitHub and confirm that the branch list shows `my-progress` with your file.\n\n**Exercise 2.** Add one pattern per extension, such as `*.pt`, to a `.gitignore` file in the repository root. Create an empty file with each extension and run `git status`; none of them may appear in the list of untracked files.\n\n**Exercise 3.** Run `git log --oneline` and then `git log --oneline -- phases/00-setup-and-tooling` to show only the commits that changed this phase. Pick one commit and run `git show --stat <hash>` to see which lesson files it added.\n\n## Key Terms\n\n| Term | What people say | What it actually means |\n|------|----------------|----------------------|\n| Commit | \"Saving\" | A snapshot of your entire project at a point in time |\n| Branch | \"A copy\" | A pointer to a commit that moves forward as you work |\n| Merge | \"Combining code\" | Taking changes from one branch and applying them to another |\n| Remote | \"The cloud\" | A copy of your repo hosted somewhere else (GitHub, GitLab) |\n", "vi": "# Git & cộng tác\n\n> Quản lý phiên bản không phải là tùy chọn. Mọi thí nghiệm, mọi mô hình, mọi bài học bạn xây dựng ở đây đều được theo dõi.\n\n**Type:** Learn\n**Languages:** --\n**Prerequisites:** Phase 0, Lesson 01\n**Time:** ~30 minutes\n\n## Mục tiêu bài học\n\n- Cấu hình danh tính git và dùng quy trình hằng ngày gồm add, commit và push\n- Tạo và merge branch để thử nghiệm tách biệt mà không làm hỏng main\n- Viết một file `.gitignore` loại trừ checkpoint của mô hình và các file nhị phân lớn\n- Duyệt lịch sử commit bằng `git log` để hiểu quá trình phát triển của dự án\n\n## Vấn đề\n\nBạn sắp viết hàng trăm file code qua 20 phase. Không có quản lý phiên bản, bạn sẽ mất code, làm hỏng những thứ không thể hoàn tác, và không có cách nào để cộng tác với người khác.\n\nGit là công cụ. GitHub là nơi code được lưu trữ. Bài học này trình bày những gì bạn cần cho khóa học này, không hơn.\n\n## Khái niệm\n\n```mermaid\nsequenceDiagram\n    participant WD as Working Directory\n    participant SA as Staging Area\n    participant LR as Local Repo\n    participant R as Remote (GitHub)\n    WD->>SA: git add\n    SA->>LR: git commit\n    LR->>R: git push\n    R->>LR: git fetch\n    LR->>WD: git pull\n```\n\nBa điều cần nhớ:\n1. Lưu thường xuyên (`git commit`)\n2. Push lên remote (`git push`)\n3. Tạo branch cho các thử nghiệm (`git checkout -b experiment`)\n\n```figure\ns0-commit-dag\n```\n\n## Tự xây dựng\n\n### Bước 1: Cấu hình git\n\n```bash\ngit config --global user.name \"Your Name\"\ngit config --global user.email \"you@example.com\"\n```\n\n### Bước 2: Quy trình hằng ngày\n\n```bash\ngit status\ngit add file.py\ngit commit -m \"Add perceptron implementation\"\ngit push origin main\n```\n\n### Bước 3: Tạo branch để thử nghiệm\n\n```bash\ngit checkout -b experiment/new-optimizer\n\n# ... make changes, commit ...\n\ngit checkout main\ngit merge experiment/new-optimizer\n```\n\n### Bước 4: Làm việc với repo của khóa học\n\nBạn không thể push lên chính repo của khóa học — chỉ maintainer mới có quyền ghi. Hãy fork nó trên GitHub trước (nút Fork, góc trên bên phải) để `origin` trỏ tới bản sao của riêng bạn:\n\n```bash\ngit clone https://github.com/YOUR-USERNAME/ai-engineering-from-scratch.git\ncd ai-engineering-from-scratch\n\ngit checkout -b my-progress\n# work through lessons, commit your code\ngit push origin my-progress\n```\n\n## Ứng dụng\n\nVới khóa học này, bạn chỉ cần đúng những lệnh sau:\n\n| Lệnh | Khi nào |\n|---------|------|\n| `git clone` | Lấy repo của khóa học |\n| `git add` + `git commit` | Lưu công việc của bạn |\n| `git push` | Sao lưu lên GitHub |\n| `git checkout -b` | Thử nghiệm mà không làm hỏng main |\n| `git log --oneline` | Xem những gì bạn đã làm |\n\nVậy là đủ. Bạn không cần rebase, cherry-pick hay submodule cho khóa học này.\n\n## Bài tập\n\n1. Fork repo này, clone bản fork của bạn, tạo một branch tên `my-progress`, tạo một file, commit rồi push nó\n2. Tạo một file `.gitignore` loại trừ các file checkpoint của mô hình (`.pt`, `.pth`, `.safetensors`)\n3. Xem lịch sử commit của repo này bằng `git log --oneline` và đọc xem các bài học đã được thêm vào như thế nào\n\n### Gợi ý\n\n**Bài tập 1.** Bấm Fork trên GitHub, rồi `git clone` URL bản fork của chính bạn. Sau khi chạy `git push -u origin my-progress`, mở bản fork của bạn trên GitHub và xác nhận rằng danh sách branch có `my-progress` cùng file của bạn.\n\n**Bài tập 2.** Thêm một pattern cho mỗi phần mở rộng, chẳng hạn `*.pt`, vào file `.gitignore` ở thư mục gốc của repo. Tạo một file rỗng với mỗi phần mở rộng và chạy `git status`; không file nào được xuất hiện trong danh sách untracked file.\n\n**Bài tập 3.** Chạy `git log --oneline` rồi `git log --oneline -- phases/00-setup-and-tooling` để chỉ hiển thị các commit đã thay đổi phase này. Chọn một commit và chạy `git show --stat <hash>` để xem nó đã thêm những file bài học nào.\n\n## Thuật ngữ chính\n\n| Thuật ngữ | Người ta hay nói | Ý nghĩa thực sự |\n|------|----------------|----------------------|\n| Commit | \"Lưu lại\" | Một bản chụp (snapshot) toàn bộ dự án của bạn tại một thời điểm |\n| Branch | \"Một bản sao\" | Một con trỏ tới một commit, tiến lên phía trước khi bạn làm việc |\n| Merge | \"Gộp code\" | Lấy các thay đổi từ một branch và áp dụng vào branch khác |\n| Remote | \"Trên cloud\" | Một bản sao repo của bạn được lưu trữ ở nơi khác (GitHub, GitLab) |\n", "quiz": {"questions": [{"stage": "pre", "question": "'Version control' chủ yếu giúp bạn làm gì?", "options": ["Tự động sửa bug trong code", "Tăng tốc độ chạy code", "Theo dõi thay đổi của file theo thời gian và cộng tác với người khác", "Nén file để tiết kiệm dung lượng ổ đĩa"], "correct": 2, "explanation": "Các hệ thống version control như git theo dõi mọi thay đổi trên file, cho phép bạn quay lại trạng thái trước đó và cộng tác với người khác trên cùng một codebase."}, {"stage": "pre", "question": "Trong phát triển phần mềm, 'repository' là gì?", "options": ["Một trình quản lý package để cài thư viện", "Một tập hợp file cùng toàn bộ lịch sử thay đổi của chúng, được quản lý bởi version control", "Một database để lưu dữ liệu người dùng", "Một dịch vụ lưu trữ cloud như Google Drive"], "correct": 1, "explanation": "Repository (repo) là một thư mục được git theo dõi, chứa toàn bộ file của dự án cùng đầy đủ lịch sử thay đổi của các file đó."}, {"stage": "post", "question": "Thứ tự đúng để lưu và sao lưu công việc của bạn bằng git là gì?", "options": ["git push, git add, git commit", "git clone, git add, git push", "git add, git commit, git push", "git commit, git add, git push"], "correct": 2, "explanation": "Đầu tiên bạn stage thay đổi bằng 'git add', sau đó lưu snapshot bằng 'git commit', rồi đẩy lên remote bằng 'git push'. Đây là workflow hằng ngày."}, {"stage": "post", "question": "Lệnh 'git checkout -b experiment/new-optimizer' làm gì?", "options": ["Tạo branch mới tên experiment/new-optimizer và chuyển sang branch đó", "Xóa branch experiment/new-optimizer", "Tải về từ GitHub một branch tên experiment/new-optimizer", "Đưa mọi file về đúng trạng thái của branch experiment/new-optimizer"], "correct": 0, "explanation": "Flag '-b' tạo một branch mới với tên đã cho và chuyển sang branch đó ngay, giúp bạn thử nghiệm mà không ảnh hưởng đến branch chính."}, {"stage": "post", "question": "Vì sao bạn nên thêm '.pt', '.pth' và '.safetensors' vào .gitignore?", "options": ["Đó là các file checkpoint của mô hình, quá lớn với git và có thể tạo lại được", "Git không thể theo dõi bất kỳ file nhị phân nào", "Đó là các file test Python không nên commit", "Chúng chứa API key nhạy cảm"], "correct": 0, "explanation": "File checkpoint của mô hình (.pt, .pth, .safetensors) thường nặng tới hàng GB. Git không được thiết kế cho file nhị phân lớn, nên cần loại trừ chúng và tạo lại hoặc lưu trữ riêng."}]}, "quiz_lang": "vi", "code": []}, {"id": "03", "slug": "03-gpu-setup-and-cloud", "title_en": "GPU Setup & Cloud", "title_vi": "Thiết lập GPU & cloud", "en": "# GPU Setup & Cloud\n\n> Training on CPU is fine for learning. Training for real needs a GPU.\n\n**Type:** Build\n**Languages:** Python\n**Prerequisites:** Phase 0, Lesson 01\n**Time:** ~45 minutes\n\n## Learning Objectives\n\n- Verify local GPU availability using `nvidia-smi` and PyTorch's CUDA API\n- Configure Google Colab with a T4 GPU for free cloud-based experiments\n- Benchmark matrix multiplication on CPU vs GPU and measure the speedup\n- Estimate the largest model that fits in your VRAM using the fp16 rule of thumb\n\n## The Problem\n\nMost lessons in phases 1-3 run fine on CPU. But once you start training CNNs, transformers, or LLMs (phases 4+), you need GPU acceleration. A training run that takes 8 hours on CPU takes 10 minutes on GPU.\n\nYou have three options: local GPU, cloud GPU, or Google Colab (free).\n\n## The Concept\n\n```\nYour options:\n\n1. Local NVIDIA GPU\n   Cost: $0 (you already have it)\n   Setup: Install CUDA + cuDNN\n   Best for: Regular use, large datasets\n\n2. Google Colab (free tier)\n   Cost: $0\n   Setup: None\n   Best for: Quick experiments, no GPU at home\n\n3. Cloud GPU (Lambda, RunPod, Vast.ai)\n   Cost: $0.20-2.00/hr\n   Setup: SSH + install\n   Best for: Serious training, large models\n```\n\n```figure\ns0-gpu-dispatch\n```\n\n## Build It\n\n### Option 1: Local NVIDIA GPU\n\nCheck if you have one:\n\n```bash\nnvidia-smi\n```\n\nInstall PyTorch with CUDA. On Linux the default wheel ships with CUDA. On Windows, copy the CUDA command from the selector at pytorch.org.\n\n```bash\npip install torch torchvision torchaudio\n```\n\nThen check that PyTorch sees the GPU:\n\n```python\nimport torch\n\nprint(f\"CUDA available: {torch.cuda.is_available()}\")\nprint(f\"CUDA version: {torch.version.cuda}\")\nif torch.cuda.is_available():\n    print(f\"GPU: {torch.cuda.get_device_name(0)}\")\n    print(f\"Memory: {torch.cuda.get_device_properties(0).total_memory / 1e9:.1f} GB\")\n```\n\n### Option 2: Google Colab\n\n1. Go to [colab.research.google.com](https://colab.research.google.com)\n2. Runtime > Change runtime type > T4 GPU\n3. Run `!nvidia-smi` to verify\n\nUpload notebooks from this course directly to Colab.\n\n### Option 3: Cloud GPU\n\nFor Lambda Labs, RunPod, or Vast.ai:\n\n```bash\nssh user@your-gpu-instance\n\npip install torch torchvision torchaudio\npython -c \"import torch; print(torch.cuda.get_device_name(0))\"\n```\n\n### No GPU? No problem.\n\nMost lessons work on CPU. The ones that need GPU will say so and include Colab links.\n\n```python\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nprint(f\"Using: {device}\")\n```\n\n## Build It: GPU vs CPU benchmark\n\n```python\nimport torch\nimport time\n\nsize = 5000\n\na_cpu = torch.randn(size, size)\nb_cpu = torch.randn(size, size)\n\nstart = time.time()\nc_cpu = a_cpu @ b_cpu\ncpu_time = time.time() - start\nprint(f\"CPU: {cpu_time:.3f}s\")\n\nif torch.cuda.is_available():\n    a_gpu = a_cpu.to(\"cuda\")\n    b_gpu = b_cpu.to(\"cuda\")\n\n    torch.cuda.synchronize()\n    start = time.time()\n    c_gpu = a_gpu @ b_gpu\n    torch.cuda.synchronize()\n    gpu_time = time.time() - start\n    print(f\"GPU: {gpu_time:.3f}s\")\n    print(f\"Speedup: {cpu_time / gpu_time:.0f}x\")\n```\n\n## Exercises\n\n1. Run the benchmark above and compare CPU vs GPU times\n2. If you don't have a GPU, run it on Google Colab and compare\n3. Check how much GPU memory you have and estimate the largest model you can fit (rule of thumb: 2 bytes per parameter for fp16)\n\n### Hints\n\n**Exercise 1.** Run the code from the Build It section as it is, then write down the CPU time, the GPU time, and the speedup line. Run it a second time; the first GPU run includes start-up cost, so the second numbers are the ones to compare.\n\n**Exercise 2.** In Colab, select Runtime > Change runtime type > GPU, then paste the benchmark into a cell. Run `!nvidia-smi` in another cell first; it must show a GPU name before the benchmark result means anything.\n\n**Exercise 3.** Read the total memory with `torch.cuda.get_device_properties(0).total_memory / 1e9`, as in `code/gpu_check.py`. Divide the memory in bytes by 2 to get the parameter count for fp16, then keep a margin, because activations and the CUDA context also use memory.\n\n## Key Terms\n\n| Term | What people say | What it actually means |\n|------|----------------|----------------------|\n| CUDA | \"GPU programming\" | NVIDIA's parallel computing platform that lets you run code on the GPU |\n| VRAM | \"GPU memory\" | Video RAM on the GPU, separate from system RAM. Limits model size. |\n| fp16 | \"Half precision\" | 16-bit floating point, uses half the memory of fp32 with minimal accuracy loss |\n| Tensor Core | \"Fast matrix hardware\" | Specialized GPU cores for matrix multiplication, 4-8x faster than regular cores |\n", "vi": "# Thiết lập GPU & cloud\n\n> Train trên CPU thì ổn khi học. Còn train thật sự thì cần GPU.\n\n**Type:** Build\n**Languages:** Python\n**Prerequisites:** Phase 0, Lesson 01\n**Time:** ~45 minutes\n\n## Mục tiêu bài học\n\n- Kiểm tra GPU trên máy bằng `nvidia-smi` và CUDA API của PyTorch\n- Cấu hình Google Colab với GPU T4 để chạy thử nghiệm miễn phí trên cloud\n- Benchmark phép nhân ma trận trên CPU so với GPU và đo mức tăng tốc\n- Ước lượng mô hình lớn nhất vừa với VRAM của bạn bằng quy tắc kinh nghiệm cho fp16\n\n## Vấn đề\n\nHầu hết bài học trong phase 1-3 chạy tốt trên CPU. Nhưng khi bạn bắt đầu train CNN, transformer hay LLM (từ phase 4 trở đi), bạn cần GPU để tăng tốc. Một lần train mất 8 tiếng trên CPU chỉ mất 10 phút trên GPU.\n\nBạn có ba lựa chọn: GPU trên máy, GPU trên cloud, hoặc Google Colab (miễn phí).\n\n## Khái niệm\n\n```\nYour options:\n\n1. Local NVIDIA GPU\n   Cost: $0 (you already have it)\n   Setup: Install CUDA + cuDNN\n   Best for: Regular use, large datasets\n\n2. Google Colab (free tier)\n   Cost: $0\n   Setup: None\n   Best for: Quick experiments, no GPU at home\n\n3. Cloud GPU (Lambda, RunPod, Vast.ai)\n   Cost: $0.20-2.00/hr\n   Setup: SSH + install\n   Best for: Serious training, large models\n```\n\n```figure\ns0-gpu-dispatch\n```\n\n## Tự xây dựng\n\n### Lựa chọn 1: GPU NVIDIA trên máy\n\nKiểm tra xem bạn có GPU không:\n\n```bash\nnvidia-smi\n```\n\nCài PyTorch với CUDA. Trên Linux, wheel mặc định đã đi kèm CUDA. Trên Windows, hãy copy lệnh CUDA từ bộ chọn trên pytorch.org.\n\n```bash\npip install torch torchvision torchaudio\n```\n\nSau đó kiểm tra xem PyTorch có nhận GPU không:\n\n```python\nimport torch\n\nprint(f\"CUDA available: {torch.cuda.is_available()}\")\nprint(f\"CUDA version: {torch.version.cuda}\")\nif torch.cuda.is_available():\n    print(f\"GPU: {torch.cuda.get_device_name(0)}\")\n    print(f\"Memory: {torch.cuda.get_device_properties(0).total_memory / 1e9:.1f} GB\")\n```\n\n### Lựa chọn 2: Google Colab\n\n1. Truy cập [colab.research.google.com](https://colab.research.google.com)\n2. Runtime > Change runtime type > T4 GPU\n3. C
