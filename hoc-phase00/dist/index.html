hạy `!nvidia-smi` để kiểm tra\n\nUpload trực tiếp các notebook của khóa học này lên Colab.\n\n### Lựa chọn 3: GPU trên cloud\n\nVới Lambda Labs, RunPod hoặc Vast.ai:\n\n```bash\nssh user@your-gpu-instance\n\npip install torch torchvision torchaudio\npython -c \"import torch; print(torch.cuda.get_device_name(0))\"\n```\n\n### Không có GPU? Không sao.\n\nHầu hết bài học chạy được trên CPU. Những bài cần GPU sẽ ghi rõ và kèm link Colab.\n\n```python\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nprint(f\"Using: {device}\")\n```\n\n## Tự xây dựng: Benchmark GPU so với CPU\n\n```python\nimport torch\nimport time\n\nsize = 5000\n\na_cpu = torch.randn(size, size)\nb_cpu = torch.randn(size, size)\n\nstart = time.time()\nc_cpu = a_cpu @ b_cpu\ncpu_time = time.time() - start\nprint(f\"CPU: {cpu_time:.3f}s\")\n\nif torch.cuda.is_available():\n    a_gpu = a_cpu.to(\"cuda\")\n    b_gpu = b_cpu.to(\"cuda\")\n\n    torch.cuda.synchronize()\n    start = time.time()\n    c_gpu = a_gpu @ b_gpu\n    torch.cuda.synchronize()\n    gpu_time = time.time() - start\n    print(f\"GPU: {gpu_time:.3f}s\")\n    print(f\"Speedup: {cpu_time / gpu_time:.0f}x\")\n```\n\n## Bài tập\n\n1. Chạy benchmark ở trên và so sánh thời gian trên CPU với GPU\n2. Nếu bạn không có GPU, hãy chạy trên Google Colab và so sánh\n3. Kiểm tra xem bạn có bao nhiêu bộ nhớ GPU và ước lượng mô hình lớn nhất có thể chứa vừa (quy tắc kinh nghiệm: 2 byte cho mỗi tham số với fp16)\n\n### Gợi ý\n\n**Bài tập 1.** Chạy nguyên code trong phần Tự xây dựng, rồi ghi lại thời gian CPU, thời gian GPU và dòng speedup. Chạy thêm lần thứ hai; lần chạy GPU đầu tiên có tính cả chi phí khởi động, nên số liệu của lần thứ hai mới là số để so sánh.\n\n**Bài tập 2.** Trong Colab, chọn Runtime > Change runtime type > GPU, rồi dán benchmark vào một cell. Chạy `!nvidia-smi` trong một cell khác trước; nó phải hiển thị tên GPU thì kết quả benchmark mới có ý nghĩa.\n\n**Bài tập 3.** Đọc tổng bộ nhớ bằng `torch.cuda.get_device_properties(0).total_memory / 1e9`, như trong `code/gpu_check.py`. Chia dung lượng bộ nhớ (tính bằng byte) cho 2 để có số tham số với fp16, rồi chừa ra một khoảng dư, vì activation và CUDA context cũng chiếm bộ nhớ.\n\n## Thuật ngữ chính\n\n| Thuật ngữ | Người ta hay nói | Ý nghĩa thực sự |\n|------|----------------|----------------------|\n| CUDA | \"Lập trình GPU\" | Nền tảng tính toán song song của NVIDIA, cho phép bạn chạy code trên GPU |\n| VRAM | \"Bộ nhớ GPU\" | Video RAM trên GPU, tách biệt với RAM hệ thống. Giới hạn kích thước mô hình. |\n| fp16 | \"Half precision\" | Số thực dấu phẩy động 16-bit, dùng một nửa bộ nhớ so với fp32 mà độ chính xác giảm rất ít |\n| Tensor Core | \"Phần cứng nhân ma trận nhanh\" | Các nhân GPU chuyên dụng cho phép nhân ma trận, nhanh hơn 4-8 lần so với nhân thông thường |\n", "quiz": {"questions": [{"stage": "pre", "question": "Vì sao GPU nhanh hơn CPU khi huấn luyện mạng nơ-ron?", "options": ["GPU có xung nhịp cao hơn CPU", "GPU có thể thực hiện hàng nghìn phép toán ma trận song song cùng lúc", "GPU dùng một ngôn ngữ lập trình hiệu quả hơn", "GPU có nhiều RAM hơn CPU"], "correct": 1, "explanation": "GPU có hàng nghìn nhân được tối ưu cho tính toán song song, rất phù hợp với các phép nhân ma trận chiếm phần lớn khối lượng tính toán khi huấn luyện mạng nơ-ron."}, {"stage": "pre", "question": "VRAM là gì?", "options": ["Tổng RAM khả dụng trên tất cả thiết bị", "Một loại bộ nhớ cache của CPU", "Video RAM trên GPU, tách biệt với RAM hệ thống", "RAM ảo mà hệ điều hành dùng làm swap"], "correct": 2, "explanation": "VRAM (Video RAM) là bộ nhớ riêng trên GPU. Nó giới hạn kích thước mô hình và batch size bạn có thể dùng khi huấn luyện, và tách biệt với RAM chính của hệ thống."}, {"stage": "post", "question": "Lệnh nào giúp kiểm tra GPU NVIDIA đã được nhận diện và hiển thị trạng thái hiện tại của nó?", "options": ["torch.cuda.list_devices()", "nvidia-smi", "lspci | grep gpu", "gpu --status"], "correct": 1, "explanation": "nvidia-smi (NVIDIA System Management Interface) hiển thị mức sử dụng GPU, bộ nhớ đã dùng, nhiệt độ và các tiến trình (process) đang chạy. Đây là công cụ tiêu chuẩn để kiểm tra GPU có sẵn sàng hay không."}, {"stage": "post", "question": "Khi benchmark phép nhân ma trận trên GPU so với CPU, vì sao bạn phải gọi torch.cuda.synchronize() trước khi đo thời gian GPU?", "options": ["Để chuyển dữ liệu từ bộ nhớ CPU sang bộ nhớ GPU", "Để đảm bảo mọi thao tác trên GPU đã hoàn tất trước khi dừng bộ đếm thời gian", "Để giải phóng bộ nhớ GPU không dùng tới", "Để đưa xung nhịp GPU về tần số gốc"], "correct": 1, "explanation": "Các thao tác trên GPU là bất đồng bộ -- Python trả về ngay trong khi GPU vẫn đang tính. synchronize() chặn lại cho đến khi mọi thao tác GPU xong, nhờ đó bạn đo được thời gian chính xác."}, {"stage": "post", "question": "Theo quy tắc ước lượng nhanh với fp16, khoảng bao nhiêu tham số có thể vừa trong 24 GB VRAM?", "options": ["6 tỷ tham số", "24 tỷ tham số", "12 tỷ tham số", "48 tỷ tham số"], "correct": 2, "explanation": "Với fp16, mỗi tham số chiếm 2 byte. 24 GB / 2 byte = 12 tỷ tham số. Đây chỉ là ước lượng thô; thực tế còn tốn bộ nhớ cho activation, gradient và trạng thái của optimizer."}]}, "quiz_lang": "vi", "code": [{"path": "code/gpu_check.py", "lang": "python", "content": "import time\n\n\ndef _sync(backend):\n    \"\"\"Block until queued GPU work finishes, for accurate timing.\"\"\"\n    if backend == \"cuda\":\n        import torch\n        torch.cuda.synchronize()\n    elif backend == \"mps\":\n        import torch\n        torch.mps.synchronize()\n\n\ndef check_gpu():\n    try:\n        import torch\n    except ImportError:\n        print(\"PyTorch not installed. Run: pip install torch\")\n        return\n\n    print(\"=== GPU Check ===\\n\")\n    print(f\"PyTorch version: {torch.__version__}\")\n    print(f\"CUDA available: {torch.cuda.is_available()}\")\n    print(f\"MPS (Apple Silicon) available: {torch.backends.mps.is_available()}\")\n\n    if torch.cuda.is_available():\n        backend = \"cuda\"\n    elif torch.backends.mps.is_available():\n        backend = \"mps\"\n    else:\n        print(\"\\nNo GPU detected. That's fine for most lessons.\")\n        print(\"For GPU-heavy lessons, use Google Colab (free).\")\n        return\n\n    props = None\n    if backend == \"cuda\":\n        print(f\"CUDA version: {torch.version.cuda}\")\n        print(f\"GPU: {torch.cuda.get_device_name(0)}\")\n        props = torch.cuda.get_device_properties(0)\n        print(f\"Memory: {props.total_memory / 1e9:.1f} GB\")\n        print(f\"Compute capability: {props.major}.{props.minor}\")\n    else:\n        print(\"GPU: Apple Silicon (MPS) — unified memory shared with system RAM\")\n\n    print(\"\\n=== CPU vs GPU Benchmark ===\\n\")\n    size = 4000\n\n    a = torch.randn(size, size)\n    b = torch.randn(size, size)\n\n    start = time.time()\n    _ = a @ b\n    cpu_time = time.time() - start\n    print(f\"CPU matrix multiply ({size}x{size}): {cpu_time:.3f}s\")\n\n    a_gpu = a.to(backend)\n    b_gpu = b.to(backend)\n    _sync(backend)\n\n    start = time.time()\n    _ = a_gpu @ b_gpu\n    _sync(backend)\n    gpu_time = time.time() - start\n    print(f\"GPU matrix multiply ({size}x{size}): {gpu_time:.3f}s\")\n    print(f\"Speedup: {cpu_time / gpu_time:.0f}x\")\n\n    if props is not None:\n        vram_gb = props.total_memory / 1e9\n        params_fp16 = vram_gb * 1e9 / 2\n        params_billions = params_fp16 / 1e9\n        print(f\"\\nEstimated max model size (fp16): ~{params_billions:.0f}B parameters\")\n    else:\n        print(\"\\nApple Silicon shares memory with the system; max model size depends\")\n        print(\"on total RAM, not a dedicated VRAM pool.\")\n\n\nif __name__ == \"__main__\":\n    check_gpu()\n"}]}, {"id": "04", "slug": "04-apis-and-keys", "title_en": "APIs & Keys", "title_vi": "API & API key", "en": "# APIs & Keys\n\n> Every AI API works the same way: send a request, get a response. The details change, the pattern doesn't.\n\n**Type:** Build\n**Languages:** Python, TypeScript\n**Prerequisites:** Phase 0, Lesson 01\n**Time:** ~30 minutes\n\n## Learning Objectives\n\n- Store API keys securely using environment variables and `.env` files\n- Make an LLM API call using both the Anthropic Python SDK and raw HTTP\n- Compare SDK-based and raw HTTP request/response formats for debugging\n- Identify and handle common API errors including authentication and rate limits\n\n## The Problem\n\nStarting from Phase 11, you'll call LLM APIs (Anthropic, OpenAI, Google). In Phase 13-16 you'll build agents that use these APIs in loops. You need to know how API keys work, how to store them safely, and how to make your first API call.\n\n## The Concept\n\n```mermaid\nsequenceDiagram\n    participant C as Your Code\n    participant S as API Server\n    C->>S: HTTP Request (with API key)\n    S->>C: HTTP Response (JSON)\n```\n\nEvery API call has:\n1. An endpoint (URL)\n2. An API key (authentication)\n3. A request body (what you want)\n4. A response body (what you get back)\n\n```figure\ns0-secret-inject\n```\n\n## Build It\n\n### Step 1: Store API keys safely\n\nNever put API keys in code. Use environment variables.\n\n```bash\nexport ANTHROPIC_API_KEY=\"sk-ant-...\"\nexport OPENAI_API_KEY=\"sk-...\"\n```\n\nOr use a `.env` file (add it to `.gitignore`):\n\n```\nANTHROPIC_API_KEY=sk-ant-...\nOPENAI_API_KEY=sk-...\n```\n\n### Step 2: First API call (Python)\n\n```python\nimport os\n\nimport anthropic\n\nclient = anthropic.Anthropic()\n\nMODEL = os.environ.get(\"LLM_MODEL\", \"claude-sonnet-5\")\n\nresponse = client.messages.create(\n    model=MODEL,\n    max_tokens=256,\n    messages=[{\"role\": \"user\", \"content\": \"What is a neural network in one sentence?\"}]\n)\n\nprint(response.content[0].text)\n```\n\n`LLM_MODEL` selects the Anthropic model id, and the default is the un-dated Sonnet alias. Other providers (OpenAI, Google, and others) follow the same pattern of a key plus a model id, but each has its own SDK, endpoint, and request/response schema.\n\n### Step 3: First API call (TypeScript)\n\n```typescript\nimport Anthropic from \"@anthropic-ai/sdk\";\n\nconst client = new Anthropic();\n\nconst MODEL = process.env.LLM_MODEL ?? \"claude-sonnet-5\";\n\nconst response = await client.messages.create({\n  model: MODEL,\n  max_tokens: 256,\n  messages: [{ role: \"user\", content: \"What is a neural network in one sentence?\" }],\n});\n\nconsole.log(response.content[0].text);\n```\n\n### Step 4: Raw HTTP (no SDK)\n\n```python\nimport os\nimport urllib.request\nimport json\n\nurl = \"https://api.anthropic.com/v1/messages\"\nheaders = {\n    \"Content-Type\": \"application/json\",\n    \"x-api-key\": os.environ[\"ANTHROPIC_API_KEY\"],\n    \"anthropic-version\": \"2023-06-01\",\n}\nbody = json.dumps({\n    \"model\": os.environ.get(\"LLM_MODEL\", \"claude-sonnet-5\"),\n    \"max_tokens\": 256,\n    \"messages\": [{\"role\": \"user\", \"content\": \"What is a neural network in one sentence?\"}],\n}).encode()\n\nreq = urllib.request.Request(url, data=body, headers=headers, method=\"POST\")\nwith urllib.request.urlopen(req) as resp:\n    result = json.loads(resp.read())\n    print(result[\"content\"][0][\"text\"])\n```\n\nThis is what the SDKs do under the hood. Understanding the raw HTTP call helps when debugging.\n\n## Use It\n\nFor this course:\n\n| API | When you need it | Free tier |\n|-----|-----------------|-----------|\n| Anthropic (Claude) | Phases 11-16 (agents, tools) | $5 credit on signup |\n| OpenAI | Phase 11 (comparison) | $5 credit on signup |\n| Hugging Face | Phases 4-10 (models, datasets) | Free |\n\nYou don't need all of them right now. Set them up when the lesson requires it.\n\n## Ship It\n\nThis lesson produces:\n- `outputs/prompt-api-troubleshooter.md` - diagnose common API errors\n\n## Exercises\n\n1. Get an Anthropic API key and make your first API call\n2. Try the raw HTTP version and compare the response format to the SDK version\n3. Intentionally use a wrong API key and read the error message\n\n### Hints\n\n**Exercise 1.** Create a key in the Anthropic Console, put it in `ANTHROPIC_API_KEY` as shown in the lesson, and run `code/first_api_call.py`. The call works when the script prints the model reply and no error.\n\n**Exercise 2.** Both functions in `code/first_api_call.py` print only the text and the token counts. Add `print(response)` in `call_with_sdk()` and `print(result)` in `call_raw_http()`, then run the script to see both full responses. Compare the field names: the raw JSON has the same `content`, `usage`, and `stop_reason` fields that the SDK turns into object attributes.\n\n**Exercise 3.** Set `ANTHROPIC_API_KEY` to a fake value in one terminal only, then run the script again. Find the HTTP status code and the error type in the output; an authentication failure returns a 401 status.\n\n## Key Terms\n\n| Term | What people say | What it actually means |\n|------|----------------|----------------------|\n| API key | \"Password for the API\" | A unique string that identifies your account and authorizes requests |\n| Rate limit | \"They're throttling me\" | Maximum requests per minute/hour to prevent abuse and ensure fair usage |\n| Token | \"A word\" (in API context) | A billing unit: input and output tokens are counted and charged separately |\n| Streaming | \"Real-time responses\" | Getting the response word by word instead of waiting for the full response |\n", "vi": "# API & API key\n\n> Mọi AI API đều hoạt động theo cùng một cách: gửi request, nhận response. Chi tiết có thể thay đổi, nhưng pattern thì không.\n\n**Type:** Build\n**Languages:** Python, TypeScript\n**Prerequisites:** Phase 0, Lesson 01\n**Time:** ~30 minutes\n\n## Mục tiêu bài học\n\n- Lưu trữ API key an toàn bằng biến môi trường và file `.env`\n- Gọi LLM API bằng cả Anthropic Python SDK lẫn HTTP thô\n- So sánh định dạng request/response giữa cách dùng SDK và HTTP thô để phục vụ debug\n- Nhận diện và xử lý các lỗi API thường gặp, bao gồm lỗi xác thực và rate limit\n\n## Vấn đề\n\nTừ Phase 11 trở đi, bạn sẽ gọi các LLM API (Anthropic, OpenAI, Google). Ở Phase 13-16, bạn sẽ xây dựng các agent gọi những API này trong vòng lặp. Bạn cần biết API key hoạt động thế nào, cách lưu trữ chúng an toàn, và cách thực hiện lời gọi API đầu tiên.\n\n## Khái niệm\n\n```mermaid\nsequenceDiagram\n    participant C as Your Code\n    participant S as API Server\n    C->>S: HTTP Request (with API key)\n    S->>C: HTTP Response (JSON)\n```\n\nMỗi lời gọi API đều có:\n1. Một endpoint (URL)\n2. Một API key (xác thực)\n3. Một request body (thứ bạn muốn)\n4. Một response body (thứ bạn nhận lại)\n\n```figure\ns0-secret-inject\n```\n\n## Tự xây dựng\n\n### Bước 1: Lưu trữ API key an toàn\n\nKhông bao giờ đặt API key trong code. Hãy dùng biến môi trường.\n\n```bash\nexport ANTHROPIC_API_KEY=\"sk-ant-...\"\nexport OPENAI_API_KEY=\"sk-...\"\n```\n\nHoặc dùng file `.env` (nhớ thêm nó vào `.gitignore`):\n\n```\nANTHROPIC_API_KEY=sk-ant-...\nOPENAI_API_KEY=sk-...\n```\n\n### Bước 2: Lời gọi API đầu tiên (Python)\n\n```python\nimport os\n\nimport anthropic\n\nclient = anthropic.Anthropic()\n\nMODEL = os.environ.get(\"LLM_MODEL\", \"claude-sonnet-5\")\n\nresponse = client.messages.create(\n    model=MODEL,\n    max_tokens=256,\n    messages=[{\"role\": \"user\", \"content\": \"What is a neural network in one sentence?\"}]\n)\n\nprint(response.content[0].text)\n```\n\n`LLM_MODEL` chọn model id của Anthropic, và giá trị mặc định là alias Sonnet không gắn ngày. Các nhà cung cấp khác (OpenAI, Google, v.v.) cũng theo cùng pattern gồm một key và một model id, nhưng mỗi bên có SDK, endpoint và schema request/response riêng.\n\n### Bước 3: Lời gọi API đầu tiên (TypeScript)\n\n```typescript\nimport Anthropic from \"@anthropic-ai/sdk\";\n\nconst client = new Anthropic();\n\nconst MODEL = process.env.LLM_MODEL ?? \"claude-sonnet-5\";\n\nconst response = await client.messages.create({\n  model: MODEL,\n  max_tokens: 256,\n  messages: [{ role: \"user\", content: \"What is a neural network in one sentence?\" }],\n});\n\nconsole.log(response.content[0].text);\n```\n\n### Bước 4: HTTP thô (không dùng SDK)\n\n```python\nimport os\nimport urllib.request\nimport json\n\nurl = \"https://api.anthropic.com/v1/messages\"\nheaders = {\n    \"Content-Type\": \"application/json\",\n    \"x-api-key\": os.environ[\"ANTHROPIC_API_KEY\"],\n    \"anthropic-version\": \"2023-06-01\",\n}\nbody = json.dumps({\n    \"model\": os.environ.get(\"LLM_MODEL\", \"claude-sonnet-5\"),\n    \"max_tokens\": 256,\n    \"messages\": [{\"role\": \"user\", \"content\": \"What is a neural network in one sentence?\"}],\n}).encode()\n\nreq = urllib.request.Request(url, data=body, headers=headers, method=\"POST\")\nwith urllib.request.urlopen(req) as resp:\n    result = json.loads(resp.read())\n    print(result[\"content\"][0][\"text\"])\n```\n\nĐây chính là những gì SDK làm bên dưới. Hiểu lời gọi HTTP thô sẽ giúp ích khi debug.\n\n## Ứng dụng\n\nVới khóa học này:\n\n| API | Khi nào bạn cần | Gói miễn phí |\n|-----|-----------------|-----------|\n| Anthropic (Claude) | Phase 11-16 (agent, tool) | $5 credit khi đăng ký |\n| OpenAI | Phase 11 (so sánh) | $5 credit khi đăng ký |\n| Hugging Face | Phase 4-10 (mô hình, dataset) | Miễn phí |\n\nBạn chưa cần tất cả ngay bây giờ. Hãy thiết lập khi bài học yêu cầu.\n\n## Đóng gói & sử dụng\n\nBài học này tạo ra:\n- `outputs/prompt-api-troubleshooter.md` - chẩn đoán các lỗi API thường gặp\n\n## Bài tập\n\n1. Lấy một Anthropic API key và thực hiện lời gọi API đầu tiên\n2. Thử phiên bản HTTP thô và so sánh định dạng response với phiên bản dùng SDK\n3. Cố tình dùng một API key sai và đọc thông báo lỗi\n\n### Gợi ý\n\n**Bài tập 1.** Tạo một key trong Anthropic Console, đặt nó vào `ANTHROPIC_API_KEY` như trong bài, rồi chạy `code/first_api_call.py`. Lời gọi thành công khi script in ra câu trả lời của mô hình và không có lỗi.\n\n**Bài tập 2.** Cả hai hàm trong `code/first_api_call.py` chỉ in ra phần text và số lượng token. Thêm `print(response)` vào `call_with_sdk()` và `print(result)` vào `call_raw_http()`, rồi chạy script để xem đầy đủ cả hai response. So sánh tên các trường: JSON thô có cùng các trường `content`, `usage` và `stop_reason` mà SDK chuyển thành thuộc tính của object.\n\n**Bài tập 3.** Đặt `ANTHROPIC_API_KEY` thành một giá trị giả chỉ trong một terminal, rồi chạy lại script. Tìm mã trạng thái HTTP và loại lỗi trong output; lỗi xác thực sẽ trả về mã 401.\n\n## Thuật ngữ chính\n\n| Thuật ngữ | Người ta hay nói | Ý nghĩa thực sự |\n|------|----------------|----------------------|\n| API key | \"Mật khẩu của API\" | Một chuỗi duy nhất dùng để định danh tài khoản của bạn và cấp quyền cho các request |\n| Rate limit | \"Họ đang bóp băng thông của tôi\" | Số request tối đa mỗi phút/giờ, nhằm ngăn lạm dụng và đảm bảo sử dụng công bằng |\n| Token | \"Một từ\" (trong ngữ cảnh API) | Một đơn vị tính phí: token đầu vào và đầu ra được đếm và tính tiền riêng |\n| Streaming | \"Response theo thời gian thực\" | Nhận response từng chữ một thay vì chờ toàn bộ response |\n", "quiz": {"questions": [{"stage": "pre", "question": "API key được dùng để làm gì khi gọi một dịch vụ LLM?", "options": ["Mã hóa dữ liệu gửi lên server", "Xác thực danh tính của bạn và cấp quyền cho request", "Nén request để giảm băng thông", "Chọn ngôn ngữ lập trình mà server sử dụng"], "correct": 1, "explanation": "API key là một chuỗi duy nhất định danh tài khoản của bạn, cấp quyền cho request và giúp nhà cung cấp theo dõi mức sử dụng cũng như tính phí."}, {"stage": "pre", "question": "Vì sao không bao giờ nên hardcode API key trực tiếp trong source code?", "options": ["Python không đọc được chuỗi literal dài hơn 50 ký tự", "Nhà cung cấp API chặn các key xuất hiện trong file source", "Key hardcode làm code chạy chậm hơn", "Key có thể vô tình bị commit lên git và lộ ra công khai"], "correct": 3, "explanation": "Key hardcode trong source code có nguy cơ bị commit vào version control và push lên repo công khai, nơi người khác có thể quét được và lạm dụng."}, {"stage": "post", "question": "Cách được khuyến nghị để lưu API key khi phát triển ở máy local là gì?", "options": ["Trong file .env đã được liệt kê trong .gitignore", "Trong README.md cho dễ truy cập", "Trong một biến Python ở đầu script", "Trong requirements.txt cùng với phiên bản package"], "correct": 0, "explanation": "File .env lưu key dưới dạng biến môi trường và nên được thêm vào .gitignore để không bao giờ bị commit vào version control. Các SDK tự động đọc key từ biến môi trường."}, {"stage": "post", "question": "Khi gọi API của Anthropic bằng HTTP thô, header nào chứa API key?", "options": ["Authorization: Bearer sk-ant-...", "Content-Type: application/json", "anthropic-version: 2023-06-01", "x-api-key: sk-ant-..."], "correct": 3, "explanation": "API của Anthropic dùng header 'x-api-key' để xác thực, chứ không dùng kiểu 'Authorization: Bearer' phổ biến hơn. Đây là đặc thù trong thiết kế API của họ."}, {"stage": "post", "question": "Điều gì xảy ra khi bạn vượt quá rate limit của một API?", "options": ["Request được đưa vào hàng đợi và tự động xử lý sau", "Server trả về lỗi (thường là HTTP 429) và bạn phải chờ trước khi thử lại", "API key của bạn bị thu hồi vĩnh viễn", "API âm thầm bỏ qua request mà không trả về response nào"], "correct": 1, "explanation": "Khi bị rate limit, server trả về HTTP 429 (Too Many Requests). Bạn cần chờ rồi thử lại, thường là với exponential backoff. Rate limit giúp ngăn lạm dụng và đảm bảo sử dụng công bằng."}]}, "quiz_lang": "vi", "code": [{"path": "code/first_api_call.py", "lang": "python", "content": "import os\nimport json\nimport urllib.request\n\nMODEL = os.environ.get(\"LLM_MODEL\", \"claude-sonnet-5\")\n\n\ndef call_with_sdk():\n    try:\n        import anthropic\n    except ImportError:\n        print(\"Install the SDK: pip install anthropic\")\n        return\n\n    client = anthropic.Anthropic()\n    response = client.messages.create(\n        model=MODEL,\n        max_tokens=256,\n        messages=[{\"role\": \"user\", \"content\": \"What is a neural network in one sentence?\"}]\n    )\n    print(f\"SDK response: {response.content[0].text}\")\n    print(f\"Tokens used: {response.usage.input_tokens} in, {response.usage.output_tokens} out\")\n\n\ndef call_raw_http():\n    api_key = os.environ.get(\"ANTHROPIC_API_KEY\")\n    if not api_key:\n        print(\"Set ANTHROPIC_API_KEY environment variable first\")\n        return\n\n    url = \"https://api.anthropic.com/v1/messages\"\n    headers = {\n        \"Content-Type\": \"application/json\",\n        \"x-api-key\": api_key,\n        \"anthropic-version\": \"2023-06-01\",\n    }\n    body = json.dumps({\n        \"model\": MODEL,\n        \"max_tokens\": 256,\n        \"messages\": [{\"role\": \"user\", \"content\": \"What is a neural network in one sentence?\"}],\n    }).encode()\n\n    req = urllib.request.Request(url, data=body, headers=headers, method=\"POST\")\n    with urllib.request.urlopen(req) as resp:\n        result = json.loads(resp.read())\n        print(f\"Raw HTTP response: {result['content'][0]['text']}\")\n        print(f\"Tokens used: {result['usage']['input_tokens']} in, {result['usage']['output_tokens']} out\")\n\n\nif __name__ == \"__main__\":\n    print(\"=== API Calls ===\\n\")\n    print(\"1. Using the SDK:\")\n    call_with_sdk()\n    print(\"\\n2. Using raw HTTP:\")\n    call_raw_http()\n"}, {"path": "code/first_api_call.ts", "lang": "typescript", "content": "// Phase 0 · Lesson 04 — APIs and keys (TypeScript port).\n// Reads ANTHROPIC_API_KEY from env, parses a minimal .env file, then makes one\n// /v1/messages call with global fetch. Set MOCK=1 to skip the network entirely.\n// Refs: https://platform.claude.com/docs/en/api/messages\n//       https://nodejs.org/api/process.html#processenv\n//       https://nodejs.org/api/globals.html#fetch (Node 18+ ships fetch)\n\nimport { readFileSync } from \"node:fs\";\nimport { resolve } from \"node:path\";\nimport process from \"node:process\";\n\n\ntype MessagesRequest = {\n  model: string;\n  max_tokens: number;\n  messages: { role: \"user\" | \"assistant\"; content: string }[];\n};\n\ntype MessagesResponse = {\n  content: { type: string; text: string }[];\n  usage: { input_tokens: number; output_tokens: number };\n};\n\n// .env loader. Same shape every framework follows; we skip a dep to stay\n// portable. KEY=VALUE per line, # comments, optional surrounding quotes.\nfunction loadDotenv(path: string): Record<string, string> {\n  let raw: string;\n  try {\n    raw = readFileSync(path, \"utf8\");\n  } catch {\n    return {};\n  }\n  const out: Record<string, string> = {};\n  for (const line of raw.split(/\\r?\\n/)) {\n    const trimmed = line.trim();\n    if (!trimmed || trimmed.startsWith(\"#\")) continue;\n    const eq = trimmed.indexOf(\"=\");\n    if (eq <= 0) continue;\n    const key = trimmed.slice(0, eq).trim();\n    let value = trimmed.slice(eq + 1).trim();\n    if (\n      (value.startsWith('\"') && value.endsWith('\"')) ||\n      (value.startsWith(\"'\") && value.endsWith(\"'\"))\n    ) {\n      value = value.slice(1, -1);\n    }\n    out[key] = value;\n  }\n  return out;\n}\n\nfunction mergeEnv(): NodeJS.ProcessEnv {\n  // process.env wins so users can override the file without editing it.\n  const fromFile = loadDotenv(resolve(process.cwd(), \".env\"));\n  return { ...fromFile, ...process.env };\n}\n\n// Fixture matches the real /v1/messages response shape, so the surrounding\n// code is identical whether MOCK=1 or not.\nconst MOCK_RESPONSE: MessagesResponse = {\n  content: [\n    {\n      type: \"text\",\n      text: \"A neural network is a stack of differentiable functions that learns patterns by adjusting weights against a loss signal.\",\n    },\n  ],\n  usage: { input_tokens: 12, output_tokens: 28 },\n};\n\nasync function callMessages(apiKey: string, request: MessagesRequest): Promise<MessagesResponse> {\n  if (process.env.MOCK === \"1\" || apiKey === \"mock\") {\n    return MOCK_RESPONSE;\n  }\n\n  const resp = await fetch(\"https://api.anthropic.com/v1/messages\", {\n    method: \"POST\",\n    headers: {\n      \"content-type\": \"application/json\",\n      \"x-api-key\": apiKey,\n      \"anthropic-version\": \"2023-06-01\",\n    },\n    body: JSON.stringify(request),\n  });\n\n  if (!resp.ok) {\n    const body = await resp.text();\n    throw new Error(`anthropic ${resp.status}: ${body.slice(0, 200)}`);\n  }\n  return (await resp.json()) as MessagesResponse;\n}\n\nasync function main(): Promise<number> {\n  const env = mergeEnv();\n  const model = (env.LLM_MODEL ?? \"\").trim() || \"claude-sonnet-5\";\n  const apiKey = env.ANTHROPIC_API_KEY ?? \"mock\";\n  const usingMock = process.env.MOCK === \"1\" || apiKey === \"mock\";\n\n  process.stdout.write(\"=== API Calls ===\\n\\n\");\n  process.stdout.write(\n    usingMock\n      ? \"Mode: MOCK (no network). Unset MOCK and export ANTHROPIC_API_KEY for a live call.\\n\\n\"\n      : \"Mode: LIVE.\\n\\n\",\n  );\n\n  const request: MessagesRequest = {\n    model,\n    max_tokens: 256,\n    messages: [{ role: \"user\", content: \"What is a neural network in one sentence?\" }],\n  };\n\n  try {\n    const response = await callMessages(apiKey, request);\n    const text = response.content[0]?.text ?? \"\";\n    process.stdout.write(`response: ${text}\\n`);\n    process.stdout.write(\n      `tokens: ${response.usage.input_tokens} in, ${response.usage.output_tokens} out\\n`,\n    );\n    return 0;\n  } catch (err) {\n    process.stderr.write(`request failed: ${(err as Error).message}\\n`);\n    return 1;\n  }\n}\n\nmain().then((code) => process.exit(code));\n"}, {"path": "outputs/prompt-api-troubleshooter.md", "lang": "markdown", "content": "---\nname: prompt-api-troubleshooter\ndescription: Diagnose and fix common AI API errors (auth, rate limits, timeouts)\nphase: 0\nlesson: 4\n---\n\nYou diagnose AI API errors. When someone shares an error, identify the cause and give the fix.\n\nCommon errors and fixes:\n\n- **401 Unauthorized**: API key is wrong or missing. Check the environment variable is set and the key is valid.\n- **403 Forbidden**: API key doesn't have permission for this endpoint or model.\n- **429 Too Many Requests**: Rate limited. Wait and retry, or reduce request frequency.\n- **400 Bad Request**: Request body is malformed. Check required fields, model name spelling, message format.\n- **500/502/503**: Server-side issue. Wait a minute and retry.\n- **Timeout**: Request took too long. Reduce max_tokens or use streaming.\n- **Connection refused**: Wrong base URL or network issue. Check the endpoint URL.\n\nDiagnostic steps:\n1. Is the API key set? `echo $ANTHROPIC_API_KEY | head -c 10`\n2. Is the key valid? Try a minimal request.\n3. Is the request format correct? Compare to the docs.\n4. Is there a network issue? `curl -I https://api.anthropic.com`\n"}]}, {"id": "05", "slug": "05-jupyter-notebooks", "title_en": "Jupyter Notebooks", "title_vi": "Jupyter Notebook", "en": "# Jupyter Notebooks\n\n> Notebooks are the lab bench of AI engineering. You prototype here, then move what works into production.\n\n**Type:** Build\n**Languages:** Python\n**Prerequisites:** Phase 0, Lesson 01\n**Time:** ~30 minutes\n\n## Learning Objectives\n\n- Install and launch JupyterLab, Jupyter Notebook, or VS Code with the Jupyter extension\n- Use magic commands (`%timeit`, `%%time`, `%matplotlib inline`) to benchmark and visualize inline\n- Distinguish when to use notebooks vs scripts and apply the \"explore in notebooks, ship in scripts\" workflow\n- Identify and avoid common notebook traps: out-of-order execution, hidden state, and memory leaks\n\n## The Problem\n\nEvery AI paper, tutorial, and Kaggle competition uses Jupyter notebooks. They let you run code in pieces, see outputs inline, mix code with explanations, and iterate fast. If you try to learn AI without notebooks, you're doing math homework without scratch paper.\n\nBut notebooks have real traps. People use them for everything, including things they're terrible at. Knowing when to use a notebook and when to use a script will save you from debugging nightmares later.\n\n## The Concept\n\nA notebook is a list of cells. Each cell is either code or text.\n\n```mermaid\ngraph TD\n    A[\"**Markdown Cell**\\n# My Experiment\\nTesting learning rate 0.01\"] --> B[\"**Code Cell** ► Run\\nmodel.fit(X, y, lr=0.01)\\n---\\nOutput: loss = 0.342\"]\n    B --> C[\"**Code Cell** ► Run\\nplt.plot(losses)\\n---\\nOutput: inline plot\"]\n```\n\nThe kernel is a Python process running in the background. When you run a cell, it sends the code to the kernel, which executes it and sends back the result. All cells share the same kernel, so variables persist between cells.\n\n```mermaid\ngraph LR\n    A[Notebook UI] <--> B[Kernel\\nPython process]\n    B --> C[Keeps variables in memory]\n    B --> D[Runs cells in whatever order you click]\n    B --> E[Dies when you restart it]\n```\n\nThat \"whatever order you click\" part is both the superpower and the foot-gun.\n\n```figure\ns0-cell-order\n```\n\n## Build It\n\n### Step 1: Pick your interface\n\nThree options, one format:\n\n| Interface | Install | Best for |\n|-----------|---------|----------|\n| JupyterLab | `pip install jupyterlab` then `jupyter lab` | Full IDE experience, multiple tabs, file browser, terminal |\n| Jupyter Notebook | `pip install notebook` then `jupyter notebook` | Simple, lightweight, one notebook at a time |\n| VS Code | Install \"Jupyter\" extension | Already in your editor, git integration, debugging |\n\nAll three read and write the same `.ipynb` file. Pick whatever you like. JupyterLab is the most common in AI work.\n\n```bash\npip install jupyterlab\njupyter lab\n```\n\n### Step 2: Keyboard shortcuts that matter\n\nYou operate in two modes. Press `Escape` for command mode (blue bar on the left), `Enter` for edit mode (green bar).\n\n**Command mode (most used):**\n\n| Key | Action |\n|-----|--------|\n| `Shift+Enter` | Run cell, move to next |\n| `A` | Insert cell above |\n| `B` | Insert cell below |\n| `DD` | Delete cell |\n| `M` | Convert to markdown |\n| `Y` | Convert to code |\n| `Z` | Undo cell operation |\n| `Ctrl+Shift+H` | Show all shortcuts |\n\n**Edit mode:**\n\n| Key | Action |\n|-----|--------|\n| `Tab` | Autocomplete |\n| `Shift+Tab` | Show function signature |\n| `Ctrl+/` | Toggle comment |\n\n`Shift+Enter` is the one you'll use a thousand times a day. Learn it first.\n\n### Step 3: Cell types\n\n**Code cells** run Python and show the output:\n\n```python\nimport numpy as np\ndata = np.random.randn(1000)\ndata.mean(), data.std()\n```\n\nOutput: `(0.0032, 0.9987)`\n\n**Markdown cells** render formatted text. Use them to document what you're doing and why. Supports headers, bold, italic, LaTeX math (`$E = mc^2$`), tables, and images.\n\n### Step 4: Magic commands\n\nThese aren't Python. They're Jupyter-specific commands that start with `%` (line magic) or `%%` (cell magic).\n\n**Time your code:**\n\n```python\n%timeit np.random.randn(10000)\n```\n\nOutput: `45.2 us +/- 1.3 us per loop`\n\n```python\n%%time\nmodel.fit(X_train, y_train, epochs=10)\n```\n\nOutput: `Wall time: 2.34 s`\n\n`%timeit` runs the code many times and averages. `%%time` runs it once. Use `%timeit` for microbenchmarks, `%%time` for training runs.\n\n**Enable inline plots:**\n\n```python\n%matplotlib inline\n```\n\nEvery `plt.plot()` or `plt.show()` now renders directly in the notebook.\n\n**Install packages without leaving the notebook:**\n\n```python\n!pip install scikit-learn\n```\n\nThe `!` prefix runs any shell command.\n\n**Check environment variables:**\n\n```python\n%env CUDA_VISIBLE_DEVICES\n```\n\n### Step 5: Display rich output inline\n\nNotebooks auto-display the last expression in a cell. But you can control it:\n\n```python\nimport pandas as pd\n\ndf = pd.DataFrame({\n    \"model\": [\"Linear\", \"Random Forest\", \"Neural Net\"],\n    \"accuracy\": [0.72, 0.89, 0.94],\n    \"training_time\": [0.1, 2.3, 45.6]\n})\ndf\n```\n\nThis renders a formatted HTML table, not a text dump. Same with plots:\n\n```python\nimport matplotlib.pyplot as plt\n\nplt.figure(figsize=(8, 4))\nplt.plot([1, 2, 3, 4], [1, 4, 2, 3])\nplt.title(\"Inline Plot\")\nplt.show()\n```\n\nThe plot appears right below the cell. This is why notebooks dominate AI work. You see the data, the plot, and the code together.\n\nFor images:\n\n```python\nfrom IPython.display import Image, display\ndisplay(Image(filename=\"architecture.png\"))\n```\n\n### Step 6: Google Colab\n\nColab is a free Jupyter notebook in the cloud. It gives you a GPU, pre-installed libraries, and Google Drive integration. No setup required.\n\n1. Go to [colab.research.google.com](https://colab.research.google.com)\n2. Upload any `.ipynb` file from this course\n3. Runtime > Change runtime type > T4 GPU (free)\n\nColab differences from local Jupyter:\n- Files don't persist between sessions (save to Drive or download)\n- Pre-installed: numpy, pandas, matplotlib, torch, tensorflow, sklearn\n- `from google.colab import files` to upload/download files\n- `from google.colab import drive; drive.mount('/content/drive')` for persistent storage\n- Sessions time out after 90 minutes of inactivity (free tier)\n\n## Use It\n\n### Notebooks vs Scripts: When to use which\n\n| Use notebooks for | Use scripts for |\n|-------------------|-----------------|\n| Exploring a dataset | Training pipelines |\n| Prototyping a model | Reusable utilities |\n| Visualizing results | Anything with `if __name__` |\n| Explaining your work | Code that runs on a schedule |\n| Quick experiments | Production code |\n| Course exercises | Packages and libraries |\n\nThe rule: **explore in notebooks, ship in scripts**.\n\nA common workflow in AI:\n1. Explore data in a notebook\n2. Prototype your model in the notebook\n3. Once it works, move the code to `.py` files\n4. Import those `.py` files back into the notebook for further experiments\n\n### Common traps\n\n**Out-of-order execution.** You run cell 5, then cell 2, then cell 7. The notebook works on your machine but breaks when someone runs it top to bottom. Fix: Kernel > Restart & Run All before sharing.\n\n**Hidden state.** You delete a cell but the variable it created is still in memory. The notebook looks clean but depends on a ghost cell. Fix: Restart the kernel regularly.\n\n**Memory leaks.** Loading a 4GB dataset, training a model, loading another dataset. Nothing gets freed. Fix: `del variable_name` and `gc.collect()`, or restart the kernel.\n\n## Ship It\n\nThis lesson produces:\n- `outputs/prompt-notebook-helper.md` for debugging notebook issues\n\n## Exercises\n\n1. Open JupyterLab, create a notebook, and use `%timeit` to compare list comprehension vs numpy for creating an array of 100,000 random numbers\n2. Create a notebook with both markdown and code cells that loads a CSV, displays a dataframe, and plots a chart. Then run Kernel > Restart & Run All to verify it works top to bottom\n3. Take the code from `code/notebook_tips.py`, paste it into a Colab notebook, and run it with a free GPU\n\n### Hints\n\n**Exercise 1.** Start JupyterLab with `jupyter lab`, then put each version in its own cell that begins with `%timeit`. Use the same 100,000 size in both cells so that the two times measure the same work.\n\n**Exercise 2.** Use `pd.read_csv` for the data, show the dataframe as the last line of a cell, and plot with `df.plot()` or matplotlib. After Kernel > Restart & Run All, every cell must show a number in its execution counter and no cell may show an error.\n\n**Exercise 3.** In Colab, select Runtime > Change runtime type > GPU before you paste the code. The run is correct when each function in `code/notebook_tips.py` prints its section, and `torch.cuda.is_available()` returns `True` in a cell.\n\n## Key Terms\n\n| Term | What people say | What it actually means |\n|------|----------------|----------------------|\n| Kernel | \"The thing running my code\" | A separate Python process that executes cells and keeps variables in memory |\n| Cell | \"A code block\" | An independently runnable unit in a notebook, either code or markdown |\n| Magic command | \"Jupyter tricks\" | Special commands prefixed with `%` or `%%` that control the notebook environment |\n| `.ipynb` | \"Notebook file\" | A JSON file containing cells, outputs, and metadata. Stands for IPython Notebook |\n\n## Further Reading\n\n- [JupyterLab Docs](https://jupyterlab.readthedocs.io/) for the full feature set\n- [Google Colab FAQ](https://research.google.com/colaboratory/faq.html) for Colab-specific limits and features\n- [28 Jupyter Notebook Tips](https://www.dataquest.io/blog/jupyter-notebook-tips-tricks-shortcuts/) for power-user shortcuts\n", "vi": "# Jupyter Notebook\n\n> Notebook là bàn thí nghiệm của AI engineering. Bạn làm prototype ở đây, rồi chuyển những gì chạy tốt sang production.\n\n**Type:** Build\n**Languages:** Python\n**Prerequisites:** Phase 0, Lesson 01\n**Time:** ~30 minutes\n\n## Mục tiêu bài học\n\n- Cài đặt và khởi chạy JupyterLab, Jupyter Notebook, hoặc VS Code với extension Jupyter\n- Dùng magic command (`%timeit`, `%%time`, `%matplotlib inline`) để benchmark và trực quan hóa ngay trong notebook\n- Phân biệt khi nào dùng notebook, khi nào dùng script, và áp dụng quy trình \"khám phá trong notebook, ship bằng script\"\n- Nhận diện và tránh các cái bẫy thường gặp của notebook: chạy cell sai thứ tự, trạng thái ẩn và rò rỉ bộ nhớ\n\n## Vấn đề\n\nMọi bài báo AI, tutorial và cuộc thi Kaggle đều dùng Jupyter notebook. Notebook cho phép bạn chạy code từng phần, xem output ngay tại chỗ, kết hợp code với phần giải thích, và lặp nhanh. Học AI mà không dùng notebook cũng giống như làm bài tập toán mà không có giấy nháp.\n\nNhưng notebook có những cái bẫy thật sự. Người ta dùng nó cho mọi thứ, kể cả những việc nó làm rất tệ. Biết khi nào nên dùng notebook và khi nào nên dùng script sẽ giúp bạn tránh được những cơn ác mộng debug về sau.\n\n## Khái niệm\n\nMột notebook là một danh sách các cell. Mỗi cell hoặc là code, hoặc là văn bản.\n\n```mermaid\ngraph TD\n    A[\"**Markdown Cell**\\n# My Experiment\\nTesting learning rate 0.01\"] --> B[\"**Code Cell** ► Run\\nmodel.fit(X, y, lr=0.01)\\n---\\nOutput: loss = 0.342\"]\n    B --> C[\"**Code Cell** ► Run\\nplt.plot(losses)\\n---\\nOutput: inline plot\"]\n```\n\nKernel là một tiến trình (process) Python chạy ở chế độ nền. Khi bạn chạy một cell, notebook gửi code tới kernel, kernel thực thi nó và gửi lại kết quả. Mọi cell dùng chung một kernel, nên biến vẫn tồn tại giữa các cell.\n\n```mermaid\ngraph LR\n    A[Notebook UI] <--> B[Kernel\\nPython process]\n    B --> C[Keeps variables in memory]\n    B --> D[Runs cells in whatever order you click]\n    B --> E[Dies when you restart it]\n```\n\nChính phần \"theo bất kỳ thứ tự nào bạn bấm\" vừa là siêu năng lực, vừa là cách tự bắn vào chân mình.\n\n```figure\ns0-cell-order\n```\n\n## Tự xây dựng\n\n### Bước 1: Chọn giao diện\n\nBa lựa chọn, một định dạng:\n\n| Giao diện | Cài đặt | Phù hợp nhất cho |\n|-----------|---------|----------|\n| JupyterLab | `pip install jupyterlab` rồi `jupyter lab` | Trải nghiệm IDE đầy đủ, nhiều tab, trình duyệt file, terminal |\n| Jupyter Notebook | `pip install notebook` rồi `jupyter notebook` | Đơn giản, nhẹ, mỗi lần một notebook |\n| VS Code | Cài extension \"Jupyter\" | Có sẵn trong editor, tích hợp git, debug |\n\nCả ba đều đọc và ghi cùng một file `.ipynb`. Bạn thích cái nào thì chọn cái đó. JupyterLab phổ biến nhất trong công việc AI.\n\n```bash\npip install jupyterlab\njupyter lab\n```\n\n### Bước 2: Những phím tắt quan trọng\n\nBạn làm việc ở hai chế độ. Nhấn `Escape` để vào command mode (thanh màu xanh dương bên trái), `Enter` để vào edit mode (thanh màu xanh lá).\n\n**Command mode (dùng nhiều nhất):**\n\n| Phím | Tác dụng |\n|-----|--------|\n| `Shift+Enter` | Chạy cell, chuyển sang cell kế tiếp |\n| `A` | Chèn cell phía trên |\n| `B` | Chèn cell phía dưới |\n| `DD` | Xóa cell |\n| `M` | Chuyển thành markdown |\n| `Y` | Chuyển thành code |\n| `Z` | Hoàn tác thao tác trên cell |\n| `Ctrl+Shift+H` | Hiển thị tất cả phím tắt |\n\n**Edit mode:**\n\n| Phím | Tác dụng |\n|-----|--------|\n| `Tab` | Tự động hoàn thành |\n| `Shift+Tab` | Hiển thị signature của hàm |\n| `Ctrl+/` | Bật/tắt comment |\n\n`Shift+Enter` là phím bạn sẽ dùng cả nghìn lần mỗi ngày. Hãy học nó trước tiên.\n\n### Bước 3: Các loại cell\n\n**Code cell** chạy Python và hiển thị output:\n\n```python\nimport numpy as np\ndata = np.random.randn(1000)\ndata.mean(), data.std()\n```\n\nOutput: `(0.0032, 0.9987)`\n\n**Markdown cell** hiển thị văn bản có định dạng. Hãy dùng chúng để ghi lại bạn đang làm gì và tại sao. Hỗ trợ heading, chữ đậm, chữ nghiêng, công thức toán LaTeX (`$E = mc^2$`), bảng và hình ảnh.\n\n### Bước 4: Magic command\n\nĐây không phải Python. Chúng là các lệnh riêng của Jupyter, bắt đầu bằng `%` (line magic) hoặc `%%` (cell magic).\n\n**Đo thời gian chạy code:**\n\n```python\n%timeit np.random.randn(10000)\n```\n\nOutput: `45.2 us +/- 1.3 us per loop`\n\n```python\n%%time\nmodel.fit(X_train, y_train, epochs=10)\n```\n\nOutput: `Wall time: 2.34 s`\n\n`%timeit` chạy code nhiều lần rồi lấy trung bình. `%%time` chỉ chạy một lần. Dùng `%timeit` cho microbenchmark, `%%time` cho các lần train.\n\n**Bật hiển thị biểu đồ inline:**\n\n```python\n%matplotlib inline\n```\n\nGiờ mọi lời gọi `plt.plot()` hoặc `plt.show()` đều hiển thị trực tiếp trong notebook.\n\n**Cài package mà không cần rời notebook:**\n\n```python\n!pip install scikit-learn\n```\n\nTiền tố `!` cho phép chạy bất kỳ lệnh shell nào.\n\n**Kiểm tra biến môi trường:**\n\n```python\n%env CUDA_VISIBLE_DEVICES\n```\n\n### Bước 5: Hiển thị output phong phú ngay tại chỗ\n\nNotebook tự động hiển thị biểu thức cuối cùng trong một cell. Nhưng bạn có thể kiểm soát điều đó:\n\n```python\nimport pandas as pd\n\ndf = pd.DataFrame({\n    \"model\": [\"Linear\", \"Random Forest\", \"Neural Net\"],\n    \"accuracy\": [0.72, 0.89, 0.94],\n    \"training_time\": [0.1, 2.3, 45.6]\n})\ndf\n```\n\nĐoạn này hiển thị một bảng HTML có định dạng, chứ không phải một khối text thô. Biểu đồ cũng vậy:\n\n```python\nimport matplotlib.pyplot as plt\n\nplt.figure(figsize=(8, 4))\nplt.plot([1, 2, 3, 4], [1, 4, 2, 3])\nplt.title(\"Inline Plot\")\nplt.show()\n```\n\nBiểu đồ xuất hiện ngay bên dưới cell. Đây là lý do notebook thống trị công việc AI. Bạn thấy dữ liệu, biểu đồ và code cùng một chỗ.\n\nVới hình ảnh:\n\n```python\nfrom IPython.display import Image, display\ndisplay(Image(filename=\"architecture.png\"))\n```\n\n### Bước 6: Google Colab\n\nColab là Jupyter notebook miễn phí trên cloud. Nó cung cấp cho bạn GPU, các thư viện cài sẵn và tích hợp Google Drive. Không cần thiết lập gì.\n\n1. Truy cập [colab.research.google.com](https://colab.research.google.com)\n2. Upload bất kỳ file `.ipynb` nào của khóa học này\n3. Runtime > Change runtime type > T4 GPU (miễn phí)\n\nNhững điểm khác biệt của Colab so với Jupyter trên máy:\n- File không được giữ lại giữa các session (hãy lưu vào Drive hoặc tải về)\n- Cài sẵn: numpy, pandas, matplotlib, torch, tensorflow, sklearn\n- Dùng `from google.colab import files` để upload/tải file\n- Dùng `from google.colab import drive; drive.mount('/content/drive')` để lưu trữ lâu dài\n- Session hết hạn sau 90 phút không hoạt động (gói miễn phí)\n\n## Ứng dụng\n\n### Notebook hay script: khi nào dùng cái nào\n\n| Dùng notebook để | Dùng script để |\n|-------------------|-----------------|\n| Khám phá một dataset | Pipeline training |\n| Làm prototype mô hình | Các tiện ích dùng lại được |\n| Trực quan hóa kết quả | Bất cứ thứ gì có `if __name__` |\n| Giải thích công việc của bạn | Code chạy theo lịch |\n| Thử nghiệm nhanh | Code production |\n| Bài tập của khóa học | Package và thư viện |\n\nQuy tắc: **khám phá trong notebook, ship bằng script**.\n\nMột quy trình phổ biến trong AI:\n1. Khám phá dữ liệu trong notebook\n2. Làm prototype mô hình trong notebook\n3. Khi đã chạy được, chuyển code sang các file `.py`\n4. Import ngược các file `.py` đó vào notebook để thử nghiệm tiếp\n\n### Những cái bẫy thường gặp\n\n**Chạy sai thứ tự.** Bạn chạy cell 5, rồi cell 2, rồi cell 7. Notebook chạy được trên máy bạn nhưng hỏng khi người khác chạy từ trên xuống dưới. Cách khắc phục: Kernel > Restart & Run All trước khi chia sẻ.\n\n**Trạng thái ẩn.** Bạn xóa một cell nhưng biến mà nó tạo ra vẫn còn trong bộ nhớ. Notebook trông có vẻ sạch sẽ nhưng lại phụ thuộc vào một cell ma. Cách khắc phục: restart kernel thường xuyên.\n\n**Rò rỉ bộ nhớ.** Load một dataset 4GB, train một mô hình, rồi load thêm một dataset khác. Không có gì được giải phóng. Cách khắc phục: `del variable_name` và `gc.collect()`, hoặc restart kernel.\n\n## Đóng gói & sử dụng\n\nBài học này tạo ra:\n- `outputs/prompt-notebook-helper.md` để debug các vấn đề với notebook\n\n## Bài tập\n\n1. Mở JupyterLab, tạo một notebook, và dùng `%timeit` để so sánh list comprehension với numpy khi tạo một mảng 100.000 số ngẫu nhiên\n2. Tạo một notebook có cả markdown cell lẫn code cell, load một file CSV, hiển thị một dataframe và vẽ một biểu đồ. Sau đó chạy Kernel > Restart & Run All để kiểm tra rằng nó chạy được từ trên xuống dưới\n3. Lấy code từ `code/notebook_tips.py`, dán vào một notebook Colab và chạy nó với GPU miễn phí\n\n### Gợi ý\n\n**Bài tập 1.** Khởi động JupyterLab bằng `jupyter lab`, rồi đặt mỗi phiên bản vào một cell riêng bắt đầu bằng `%timeit`. Dùng cùng kích thước 100.000 ở cả hai cell để hai lần đo đo cùng một khối lượng công việc.\n\n**Bài tập 2.** Dùng `pd.read_csv` để đọc dữ liệu, hiển thị dataframe ở dòng cuối cùng của một cell, và vẽ biểu đồ bằng `df.plot()` hoặc matplotlib. Sau khi chạy Kernel > Restart & Run All, mọi cell phải hiển thị một con số ở bộ đếm thực thi và không cell nào được báo lỗi.\n\n**Bài tập 3.** Trong Colab, chọn Runtime > Change runtime type > GPU trước khi dán code. Lần chạy là đúng khi mỗi hàm trong `code/notebook_tips.py` in ra phần của nó, và `torch.cuda.is_available()` trả về `True` trong một cell.\n\n## Thuật ngữ chính\n\n| Thuật ngữ | Người ta hay nói | Ý nghĩa thực sự |\n|------|----------------|----------------------|\n| Kernel | \"Cái thứ chạy code của tôi\" | Một tiến trình Python riêng biệt, thực thi các cell và giữ biến trong bộ nhớ |\n| Cell | \"Một khối code\" | Một đơn vị có thể chạy độc lập trong notebook, là code hoặc markdown |\n| Magic command | \"Mấy mẹo của Jupyter\" | Các lệnh đặc biệt có tiền tố `%` hoặc `%%`, dùng để điều khiển môi trường notebook |\n| `.ipynb` | \"File notebook\" | Một file JSON chứa các cell, output và metadata. Viết tắt của IPython Notebook |\n\n## Đọc thêm\n\n- [Tài liệu JupyterLab](https://jupyterlab.readthedocs.io/) để biết đầy đủ các tính năng\n- [Câu hỏi thường gặp về Google Colab](https://research.google.com/colaboratory/faq.html) để biết các giới hạn và tính năng riêng của Colab\n- [28 mẹo dùng Jupyter Notebook](https://www.dataquest.io/blog/jupyter-notebook-tips-tricks-shortcuts/) để nắm các phím tắt cho người dùng thành thạo\n", "quiz": {"questions": [{"stage": "pre", "question": "Jupyter notebook là gì?", "options": ["Một tài liệu tương tác kết hợp các cell code chạy được với văn bản markdown và output hiển thị ngay bên dưới", "Một trình quản lý package cho thư viện Python", "Một hệ thống version control cho các dự án data science", "Một trình soạn thảo văn bản để viết script Python"], "correct": 0, "explanation": "Jupyter notebook (.ipynb) là môi trường tương tác, nơi bạn viết và chạy code theo từng cell, xem output ngay bên dưới, và xen kẽ code với phần giải thích bằng văn bản có định dạng."}, {"stage": "pre", "question": "Jupyter kernel làm gì?", "options": ["Chạy code trong các cell và giữ biến trong bộ nhớ giữa các lần chạy", "Kết nối notebook với GitHub để quản lý version control", "Quản lý việc lưu trữ file cho notebook", "Chuyển các cell markdown thành HTML"], "correct": 0, "explanation": "Kernel là một tiến trình (process) Python riêng, chạy code của cell và giữ trạng thái (biến, import) trong bộ nhớ. Mọi cell trong một notebook dùng chung một kernel."}, {"stage": "post", "question": "Magic command %timeit và %%time khác nhau thế nào?", "options": ["Không khác gì, chúng là alias của nhau", "%timeit chạy code nhiều lần rồi lấy trung bình, %%time chạy code một lần", "%timeit đo wall time, %%time đo CPU time", "%timeit dùng cho một dòng, %%time dùng cho cả notebook"], "correct": 1, "explanation": "%timeit chạy câu lệnh nhiều lần để lấy trung bình thống kê (phù hợp cho microbenchmark). %%time chạy cell một lần và báo wall time (phù hợp cho các lần chạy huấn luyện)."}, {"stage": "post", "question": "Nguyên nhân phổ biến nhất khiến notebook chạy được trên máy bạn nhưng lỗi khi người khác chạy từ trên xuống dưới là gì?", "options": ["Thiếu magic command %matplotlib inline", "Dùng quá nhiều cell markdown", "Chạy cell không theo thứ tự, tạo ra phụ thuộc ngầm vào thứ tự thực thi", "Dùng phiên bản Python khác"], "correct": 2, "explanation": "Chạy cell không theo thứ tự tạo ra phụ thuộc ngầm vào trạng thái. Một biến có thể tồn tại chỉ vì bạn đã chạy cell 5 trước cell 2. Kernel > Restart & Run All giúp kiểm tra notebook chạy tuần tự được."}, {"stage": "post", "question": "Khi nào bạn nên chuyển code từ notebook sang script .py?", "options": ["Không bao giờ -- notebook luôn tốt hơn cho việc làm AI", "Chỉ khi cần chạy trên GPU", "Ngay khi bạn viết hơn 10 dòng code", "Khi code là tiện ích tái sử dụng, pipeline huấn luyện hoặc code production"], "correct": 3, "explanation": "Quy tắc là 'khám phá trong notebook, ship bằng script.' Tiện ích tái sử dụng, pipeline huấn luyện và mọi thứ chạy trên production nên là file .py. Notebook dành cho khám phá và làm prototype."}]}, "quiz_lang": "vi", "code": [{"path": "code/notebook_tips.py", "lang": "python", "content": "import time\nimport sys\n\nimport numpy as np\nimport matplotlib\nmatplotlib.use(\"Agg\")\nimport matplotlib.pyplot as plt\nimport pandas as pd\n\n\ndef timing_comparison():\n    print(\"=== Timing: List vs NumPy ===\\n\")\n\n    size = 1_000_000\n\n    start = time.perf_counter()\n    python_list = [x ** 2 for x in range(size)]\n    list_time = time.perf_counter() - start\n    print(f\"List comprehension: {list_time:.4f}s\")\n\n    start = time.perf_counter()\n    numpy_array = np.arange(size) ** 2\n    numpy_time = time.perf_counter() - start\n    print(f\"NumPy:              {numpy_time:.4f}s\")\n    print(f\"Speedup:            {list_time / numpy_time:.1f}x\")\n\n\ndef inline_plotting():\n    print(\"\\n=== Inline Plotting ===\\n\")\n\n    np.random.seed(42)\n    x = np.linspace(0, 10, 200)\n    y_sin = np.sin(x)\n    y_noisy = y_sin + np.random.normal(0, 0.2, 200)\n\n    fig, axes = plt.subplots(1, 2, figsize=(12, 4))\n\n    axes[0].plot(x, y_sin, label=\"sin(x)\")\n    axes[0].plot(x, y_noisy, alpha=0.5, label=\"noisy\")\n    axes[0].set_title(\"Signal vs Noise\")\n    axes[0].legend()\n\n    axes[1].hist(y_noisy - y_sin, bins=30, edgecolor=\"black\")\n    axes[1].set_title(\"Noise Distribution\")\n\n    plt.tight_layout()\n    plt.savefig(\"notebook_plot.png\", dpi=100)\n    print(\"Saved plot to notebook_plot.png\")\n    print(\"In a notebook, plt.show() displays this inline.\")\n\n\ndef dataframe_display():\n    print(\"\\n=== DataFrame Display ===\\n\")\n\n    df = pd.DataFrame({\n        \"model\": [\"Linear Regression\", \"Random Forest\", \"Neural Network\", \"XGBoost\"],\n        \"accuracy\": [0.72, 0.89, 0.94, 0.91],\n        \"train_time_sec\": [0.1, 2.3, 45.6, 8.2],\n        \"parameters\": [102, 50_000, 1_200_000, 25_000],\n    })\n\n    print(\"In a notebook, just typing 'df' renders a rich HTML table:\\n\")\n    print(df.to_string(index=False))\n\n    print(f\"\\nBest model: {df.loc[df['accuracy'].idxmax(), 'model']}\")\n    print(f\"Fastest model: {df.loc[df['train_time_sec'].idxmin(), 'model']}\")\n\n\ndef memory_check():\n    print(\"\\n=== Memory Usage ===\\n\")\n\n    small = np.random.randn(1000)\n    medium = np.random.randn(100_000)\n    large = np.random.randn(10_000_000)\n\n    for name, arr in [(\"1K\", small), (\"100K\", medium), (\"10M\", large)]:\n        size_mb = arr.nbytes / 1e6\n        print(f\"Array {name:>4s} elements: {size_mb:>8.2f} MB\")\n\n    print(f\"\\nPython process memory: ~{sys.getsizeof(large) / 1e6:.1f} MB for the large array\")\n    print(\"In notebooks, memory accumulates across cells. Restart the kernel to free it.\")\n\n\ndef magic_command_equivalents():\n    print(\"\\n=== Magic Command Equivalents ===\\n\")\n    print(\"In a notebook, you would use magic commands:\")\n    print(\"  %timeit np.random.randn(10000)    -> micro-benchmark\")\n    print(\"  %%time long_operation()            -> wall clock time\")\n    print(\"  %matplotlib inline                 -> show plots in cells\")\n    print(\"  !pip install package               -> install from notebook\")\n    print(\"  %env VAR                           -> check env variable\")\n    print()\n\n    iterations = 1000\n    start = time.perf_counter()\n    for _ in range(iterations):\n        np.random.randn(10000)\n    elapsed = time.perf_counter() - start\n    per_call = elapsed / iterations * 1e6\n\n    print(f\"Manual timing (like %%timeit): np.random.randn(10000)\")\n    print(f\"  {per_call:.1f} us per call ({iterations} iterations)\")\n\n\nif __name__ == \"__main__\":\n    print(\"Notebook Tips - Key Patterns\\n\")\n    print(\"Run these in a Jupyter notebook to see rich output.\\n\")\n\n    timing_comparison()\n    inline_plotting()\n    dataframe_display()\n    memory_check()\n    magic_command_equivalents()\n"}, {"path": "outputs/prompt-notebook-helper.md", "lang": "markdown", "content": "---\nname: prompt-notebook-helper\ndescription: Debug Jupyter notebook issues including kernel crashes, memory problems, and display failures\nphase: 0\nlesson: 5\n---\n\nYou diagnose Jupyter notebook problems. When someone describes an issue, identify the cause and give the fix.\n\nCommon issues and fixes:\n\n**Kernel crashes:**\n- Out of memory: The dataset or model is too large. Fix: reduce batch size, load data in chunks with `pd.read_csv(path, chunksize=10000)`, use `del variable` then `gc.collect()`, or switch to a machine with more RAM.\n- Segfault from native library: Usually a version mismatch between numpy/torch/tensorflow and the system libraries. Fix: create a fresh virtual environment and reinstall.\n- Kernel dies silently: Check the terminal where Jupyter is running for the actual error message. The notebook UI often hides it.\n\n**Display problems:**\n- Plots not showing: Add `%matplotlib inline` at the top of the notebook. If using JupyterLab, try `%matplotlib widget` for interactive plots (requires `ipympl`).\n- DataFrame shows as text instead of HTML table: Make sure the dataframe is the last expression in the cell, not inside a `print()` call. `print(df)` gives text, just `df` gives the rich table.\n- Images not rendering: Use `from IPython.display import Image, display` then `display(Image(filename=\"path.png\"))`.\n- LaTeX not rendering in markdown: Check for missing dollar signs. Inline: `$x^2$`. Block: `$$\\sum_{i=0}^n x_i$$`.\n\n**Memory issues:**\n- Notebook uses too much RAM: Variables persist across all cells. Run `%who` to see all variables. Delete large ones with `del var_name` and run `import gc; gc.collect()`.\n- Memory keeps growing: You are probably reassigning large variables without freeing the old ones. Restart the kernel (Kernel > Restart) to clear everything.\n- Loading multiple large datasets: Use generators or chunked reading. `pd.read_csv(path, chunksize=N)` returns an iterator instead of loading everything at once.\n\n**Execution issues:**\n- Notebook works for me but not others: Cells were run out of order. Fix: Kernel > Restart & Run All. If it fails, you have a hidden dependency on a deleted or reordered cell.\n- Cell runs forever (hanging): The code might be waiting for input (`input()`), stuck in an infinite loop, or blocked on a network request. Interrupt with Kernel > Interrupt (or press `I` twice in command mode).\n- Import errors after pip install: The package installed in a different Python than the kernel is using. Fix: run `!pip install package` inside the notebook, or check `!which python` matches your environment.\n\n**Colab-specific:**\n- Session disconnected: Free Colab times out after 90 minutes of inactivity. Save work to Google Drive or download files.\n- GPU not available: Runtime > Change runtime type > select GPU. If all GPUs are busy, try again later or use Colab Pro.\n- Files disappeared: Colab wipes the filesystem between sessions. Mount Google Drive for persistent storage: `from google.colab import drive; drive.mount('/content/drive')`.\n\nDiagnostic steps:\n1. What is the exact error message? (Check both the notebook and the terminal)\n2. Does the issue happen after restarting the kernel and running all cells top to bottom?\n3. How much data are you loading? (`df.info()` for dataframes, `tensor.shape` and `tensor.dtype` for tensors)\n4. What environment are you using? (Local JupyterLab, VS Code, Colab)\n5. Were packages installed in the same environment as the kernel? (`!which python` and `import sys; sys.executable`)\n"}]}, {"id": "06", "slug": "06-python-environments", "title_en": "Python Environments", "title_vi": "Môi trường Python", "en": "# Python Environments\n\n> Dependency hell is real. Virtual environments are the cure.\n\n**Type:** Build\n**Languages:** Shell\n**Prerequisites:** Phase 0, Lesson 01\n**Time:** ~30 minutes\n\n## Learning Objectives\n\n- Create isolated virtual environments using `uv`, `venv`, or `conda`\n- Write a `pyproject.toml` with optional dependency groups and generate lockfiles for reproducibility\n- Diagnose and fix common pitfalls: global installs, pip/conda mixing, CUDA version mismatches\n- Implement a per-phase environment strategy for projects with conflicting dependencies\n\n## The Problem\n\nYou install PyTorch 2.4 for a fine-tuning project. Next week, a different project needs PyTorch 2.1 because its CUDA build is pinned. You upgrade globally, and the first project breaks. You downgrade, and the second one breaks.\n\nThis is dependency hell. It happens constantly in AI/ML work because:\n\n- PyTorch, JAX, and TensorFlow each ship their own CUDA bindings\n- Model libraries pin specific framework versions\n- A global `pip install` overwrites whatever was there before\n- CUDA 11.8 builds don't work with CUDA 12.x drivers (and vice versa)\n\nThe fix: every project gets its own isolated environment with its own packages.\n\n## The Concept\n\n```mermaid\ngraph TD\n    subgraph without[\"Without virtual environments\"]\n        SP[System Python] --> T24[\"torch 2.4.0 (CUDA 12.4)\\nProject A needs this\"]\n        SP --> T21[\"torch 2.1.0 (CUDA 11.8)\\nProject B needs this\"]\n        SP --> CONFLICT[\"CONFLICT: only one\\ntorch version can exist\"]\n    end\n\n    subgraph with[\"With virtual environments\"]\n        PA[\"Project A (.venv/)\"] --> PA1[\"torch 2.4.0 (CUDA 12.4)\"]\n        PA --> PA2[\"transformers 4.44\"]\n        PB[\"Project B (.venv/)\"] --> PB1[\"torch 2.1.0 (CUDA 11.8)\"]\n        PB --> PB2[\"diffusers 0.28\"]\n    end\n```\n\n```figure\ns0-env-isolation\n```\n\n## Build It\n\n### Option 1: uv venv (Recommended)\n\n`uv` is the fastest Python package manager (10-100x faster than pip). It handles virtual environments, Python versions, and dependency resolution in one tool.\n\n```bash\ncurl -LsSf https://astral.sh/uv/install.sh | sh\n\nuv python install 3.12\n\ncd your-project\nuv venv\nsource .venv/bin/activate\n```\n\nInstall packages:\n\n```bash\nuv pip install torch numpy\n```\n\nCreate a project with `pyproject.toml` in one step:\n\n```bash\nuv init my-ai-project\ncd my-ai-project\nuv add torch numpy matplotlib\n```\n\n### Option 2: venv (Built-in)\n\nIf you can't install `uv`, Python ships with `venv`:\n\n```bash\npython3 -m venv .venv\nsource .venv/bin/activate  # Linux/macOS\n.venv\\Scripts\\activate     # Windows\n\npip install torch numpy\n```\n\nSlower than `uv`, but works everywhere Python is installed.\n\n### Option 3: conda (When You Need It)\n\nConda manages non-Python dependencies like CUDA toolkits, cuDNN, and C libraries. Use it when:\n\n- You need a specific CUDA toolkit version without installing it system-wide\n- You're on a shared cluster where you can't install system packages\n- A library's install instructions say \"use conda\"\n\n```bash\n# Install miniconda (not the full Anaconda)\ncurl -LsSf https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -o miniconda.sh\nbash miniconda.sh -b\n\nconda create -n myproject python=3.12\nconda activate myproject\n\nconda install pytorch torchvision torchaudio pytorch-cuda=12.4 -c pytorch -c nvidia\n```\n\nOne rule: if you use conda for an environment, use conda for all packages in that environment. Mixing `pip install` into a conda env causes dependency conflicts that are painful to debug.\n\n### For This Course: Per-Phase Strategy\n\nYou could create one environment for the whole course. Don't. Different phases need different (sometimes conflicting) dependencies.\n\nStrategy:\n\n```\nai-engineering-from-scratch/\n├── .venv/                    <-- shared lightweight env for phases 0-3\n├── phases/\n│   ├── 04-neural-networks/\n│   │   └── .venv/            <-- PyTorch env\n│   ├── 05-cnns/\n│   │   └── .venv/            <-- same PyTorch env (symlink or shared)\n│   ├── 08-transformers/\n│   │   └── .venv/            <-- might need different transformer versions\n│   └── 11-llm-apis/\n│       └── .venv/            <-- API SDKs, no torch needed\n```\n\nThe script in `code/env_setup.sh` creates the base environment for this course.\n\n## pyproject.toml Basics\n\nEvery Python project should have a `pyproject.toml`. It replaces `setup.py`, `setup.cfg`, and `requirements.txt` in one file.\n\n```toml\n[project]\nname = \"ai-engineering-from-scratch\"\nversion = \"0.1.0\"\nrequires-python = \">=3.11\"\ndependencies = [\n    \"numpy>=1.26\",\n    \"matplotlib>=3.8\",\n    \"jupyter>=1.0\",\n    \"scikit-learn>=1.4\",\n]\n\n[project.optional-dependencies]\ntorch = [\"torch>=2.3\", \"torchvision>=0.18\"]\nllm = [\"anthropic>=0.39\", \"openai>=1.50\"]\n```\n\nThen install:\n\n```bash\nuv pip install -e \".[torch]\"    # base + PyTorch\nuv pip install -e \".[llm]\"     # base + LLM SDKs\nuv pip install -e \".[torch,llm]\" # everything\n```\n\n## Lockfiles\n\nA lockfile pins every dependency (including transitive ones) to exact versions. This guarantees reproducibility: anyone who installs from the lockfile gets exactly the same packages.\n\n```bash\n# uv generates uv.lock automatically when using uv add\nuv add numpy\n\n# pip-tools approach\nuv pip compile pyproject.toml -o requirements.lock\nuv pip install -r requirements.lock\n```\n\nCommit your lockfile to git. When someone clones the repo, they install from the lockfile and get identical versions.\n\n## Common Mistakes\n\n### 1. Installing globally\n\n```bash\npip install torch  # BAD: installs to system Python\n\nsource .venv/bin/activate\npip install torch  # GOOD: installs to virtual environment\n```\n\nCheck where your packages go:\n\n```bash\nwhich python       # should show .venv/bin/python, not /usr/bin/python\nwhich pip           # should show .venv/bin/pip\n```\n\n### 2. Mixing pip and conda\n\n```bash\nconda create -n myenv python=3.12\nconda activate myenv\nconda install pytorch -c pytorch\npip install some-other-package   # BAD: can break conda's dependency tracking\nconda install some-other-package # GOOD: let conda manage everything\n```\n\nIf you must use pip inside conda (some packages are pip-only), install all conda packages first, then pip packages last.\n\n### 3. Forgetting to activate\n\n```bash\npython train.py           # uses system Python, missing packages\nsource .venv/bin/activate\npython train.py           # uses project Python, packages found\n```\n\nYour shell prompt should show the environment name:\n\n```\n(.venv) $ python train.py\n```\n\n### 4. Committing .venv to git\n\n```bash\necho \".venv/\" >> .gitignore\n```\n\nVirtual environments are 200MB-2GB. They're local, not portable between machines. Commit `pyproject.toml` and the lockfile instead.\n\n### 5. CUDA version mismatch\n\n```bash\nnvidia-smi                # shows driver CUDA version (e.g., 12.4)\npython -c \"import torch; print(torch.version.cuda)\"  # shows PyTorch CUDA version\n\n# These must be compatible.\n# PyTorch CUDA version must be <= driver CUDA version.\n```\n\n## Use It\n\nRun the setup script to create your course environment:\n\n```bash\nbash phases/00-setup-and-tooling/06-python-environments/code/env_setup.sh\n```\n\nThis creates a `.venv` at the repo root with core dependencies installed and verified.\n\n## Exercises\n\n1. Run `env_setup.sh` and verify all checks pass\n2. Create a second virtual environment, install a different version of numpy in it, and confirm the two environments are isolated\n3. Write a `pyproject.toml` for a project that needs both PyTorch and the Anthropic SDK\n4. Deliberately install a package globally (without activating a venv), notice where it goes, then uninstall it\n\n### Hints\n\n**Exercise 1.** Run `bash phases/00-setup-and-tooling/06-python-environments/code/env_setup.sh` from the repository root. Read each line of output; when a check fails, fix that one item and run the script again until no check fails.\n\n**Exercise 2.** Make the second environment in a new folder with `uv venv`, activate it, and install an older numpy with a version pin such as `numpy==1.26.4`. Run `python -c \"import numpy; print(numpy.__version__)\"` in each environment; the two versions must be different.\n\n**Exercise 3.** Start from the example in pyproject.toml Basics and list `torch` and `anthropic` under `dependencies`. Run `uv pip install -e .` or `uv sync` in a new environment; the file is correct when both packages import without an error.\n\n**Exercise 4.** Deactivate every environment, run `pip install --user <small package>`, then run `pip show <package>` and read the `Location` line. Uninstall it with `pip uninstall <package>` and run `pip show` again to confirm that it is gone.\n\n## Key Terms\n\n| Term | What people say | What it actually means |\n|------|----------------|----------------------|\n| Virtual environment | \"A venv\" | An isolated directory containing a Python interpreter and packages, separate from the system Python |\n| Lockfile | \"Pinned dependencies\" | A file listing every package and its exact version, guaranteeing identical installs across machines |\n| pyproject.toml | \"The new setup.py\" | The standard Python project configuration file, replacing setup.py/setup.cfg/requirements.txt |\n| Transitive dependency | \"A dependency of a dependency\" | Package B depends on C; if you install A which depends on B, C is a transitive dependency of A |\n| CUDA mismatch | \"My GPU isn't working\" | PyTorch was compiled for a different CUDA version than what your GPU driver supports |\n", "vi": "# Môi trường Python\n\n> Dependency hell là có thật. Môi trường ảo chính là thuốc chữa.\n\n**Type:** Build\n**Languages:** Shell\n**Prerequisites:** Phase 0, Lesson 01\n**Time:** ~30 minutes\n\n## Mục tiêu bài học\n\n- Tạo môi trường ảo (venv) cô lập bằng `uv`, `venv` hoặc `conda`\n- Viết `pyproject.toml` với các nhóm dependency tùy chọn và sinh lockfile để đảm bảo tính tái lập\n- Chẩn đoán và sửa các lỗi thường gặp: cài đặt toàn cục, trộn pip/conda, lệch phiên bản CUDA\n- Áp dụng chiến lược mỗi phase một môi trường cho các dự án có dependency xung đột nhau\n\n## Vấn đề\n\nBạn cài PyTorch 2.4 cho một dự án fine-tune. Tuần sau, một dự án khác lại cần PyTorch 2.1 vì bản build CUDA của nó đã bị ghim cố định. Bạn nâng cấp toàn cục, và dự án đầu tiên hỏng. Bạn hạ cấp, và dự án thứ hai hỏng.\n\nĐó chính là dependency hell. Chuyện này xảy ra liên tục trong công việc AI/ML vì:\n\n- PyTorch, JAX và TensorFlow mỗi cái đều đi kèm binding CUDA riêng\n- Các thư viện mô hình ghim cứng phiên bản framework cụ thể\n- Một lệnh `pip install` toàn cục sẽ ghi đè lên bất cứ thứ gì đã có trước đó\n- Bản build cho CUDA 11.8 không chạy được với driver CUDA 12.x (và ngược lại)\n\nCách khắc phục: mỗi dự án có một môi trường cô lập riêng với các package riêng.\n\n## Khái niệm\n\n```mermaid\ngraph TD\n    subgraph without[\"Without virtual environments\"]\n        SP[System Python] --> T24[\"torch 2.4.0 (CUDA 12.4)\\nProject A needs this\"]\n        SP --> T21[\"torch 2.1.0 (CUDA 11.8)\\nProject B needs this\"]\n        SP --> CONFLICT[\"CONFLICT: only one\\ntorch version can exist\"]\n    end\n\n    subgraph with[\"With virtual environments\"]\n        PA[\"Project A (.venv/)\"] --> PA1[\"torch 2.4.0 (CUDA 12.4)\"]\n        PA --> PA2[\"transformers 4.44\"]\n        PB[\"Project B (.venv/)\"] --> PB1[\"torch 2.1.0 (CUDA 11.8)\"]\n        PB --> PB2[\"diffusers 0.28\"]\n    end\n```\n\n```figure\ns0-env-isolation\n```\n\n## Tự xây dựng\n\n### Cách 1: uv venv (Khuyên dùng)\n\n`uv` là trình quản lý package Python nhanh nhất (nhanh hơn pip 10-100 lần). Nó xử lý môi trường ảo, phiên bản Python và việc giải quyết dependency trong cùng một công cụ.\n\n```bash\ncurl -LsSf https://astral.sh/uv/install.sh | sh\n\nuv python install 3.12\n\ncd your-project\nuv venv\nsource .venv/bin/activate\n```\n\nCài package:\n\n```bash\nuv pip install torch numpy\n```\n\nTạo dự án kèm `pyproject.toml` chỉ trong một bước:\n\n```bash\nuv init my-ai-project\ncd my-ai-project\nuv add torch numpy matplotlib\n```\n\n### Cách 2: venv (Có sẵn)\n\nNếu bạn không cài được `uv`, Python có sẵn `venv`:\n\n```bash\npython3 -m venv .venv\nsource .venv/bin/activate  # Linux/macOS\n.venv\\Scripts\\activate     # Windows\n\npip install torch numpy\n```\n\nChậm hơn `uv`, nhưng chạy được ở mọi nơi có cài Python.\n\n### Cách 3: conda (Khi thực sự cần)\n\nConda quản lý cả các dependency không phải Python như CUDA toolkit, cuDNN và thư viện C. Hãy dùng nó khi:\n\n- Bạn cần một phiên bản CUDA toolkit cụ thể mà không muốn cài vào toàn hệ thống\n- Bạn đang làm việc trên cluster dùng chung, nơi bạn không có quyền cài package hệ thống\n- Hướng dẫn cài đặt của một thư viện ghi \"use conda\"\n\n```bash\n# Install miniconda (not the full Anaconda)\ncurl -LsSf https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -o miniconda.sh\nbash miniconda.sh -b\n\nconda create -n myproject python=3.12\nconda activate myproject\n\nconda install pytorch torchvision torchaudio pytorch-cuda=12.4 -c pytorch -c nvidia\n```\n\nMột nguyên tắc: nếu bạn dùng conda cho một môi trường, hãy dùng conda cho mọi package trong môi trường đó. Trộn `pip install` vào một conda env sẽ gây xung đột dependency rất khó debug.\n\n### Cho khóa học này: Chiến lược theo từng phase\n\nBạn có thể tạo một môi trường duy nhất cho cả khóa học. Đừng làm vậy. Các phase khác nhau cần những dependency khác nhau (đôi khi còn xung đột nhau).\n\nChiến lược:\n\n```\nai-engineering-from-scratch/\n├── .venv/                    <-- shared lightweight env for phases 0-3\n├── phases/\n│   ├── 04-neural-networks/\n│   │   └── .venv/            <-- PyTorch env\n│   ├── 05-cnns/\n│   │   └── .venv/            <-- same PyTorch env (symlink or shared)\n│   ├── 08-transformers/\n│   │   └── .venv/            <-- might need different transformer versions\n│   └── 11-llm-apis/\n│       └── .venv/            <-- API SDKs, no torch needed\n```\n\nScript trong `code/env_setup.sh` sẽ tạo môi trường cơ sở cho khóa học này.\n\n## Cơ bản về pyproject.toml\n\nMọi dự án Python đều nên có một file `pyproject.toml`. Nó thay thế `setup.py`, `setup.cfg` và `requirements.txt` bằng một file duy nhất.\n\n```toml\n[project]\nname = \"ai-engineering-from-scratch\"\nversion = \"0.1.0\"\nrequires-python = \">=3.11\"\ndependencies = [\n    \"numpy>=1.26\",\n    \"matplotlib>=3.8\",\n    \"jupyter>=1.0\",\n    \"scikit-learn>=1.4\",\n]\n\n[project.optional-dependencies]\ntorch = [\"torch>=2.3\", \"torchvision>=0.18\"]\nllm = [\"anthropic>=0.39\", \"openai>=1.50\"]\n```\n\nSau đó cài đặt:\n\n```bash\nuv pip install -e \".[torch]\"    # base + PyTorch\nuv pip install -e \".[llm]\"     # base + LLM SDKs\nuv pip install -e \".[torch,llm]\" # everything\n```\n\n## Lockfile\n\nLockfile ghim mọi dependency (kể cả dependency bắc cầu) vào phiên bản chính xác. Điều này đảm bảo tính tái lập: bất kỳ ai cài từ lockfile cũng sẽ nhận được đúng y hệt các package đó.\n\n```bash\n# uv generates uv.lock automatically when using uv add\nuv add numpy\n\n# pip-tools approach\nuv pip compile pyproject.toml -o requirements.lock\nuv pip install -r requirements.lock\n```\n\nHãy commit lockfile vào git. Khi ai đó clone repo, họ cài từ lockfile và nhận được đúng các phiên bản giống hệt.\n\n## Những lỗi thường gặp\n\n### 1. Cài đặt toàn cục\n\n```bash\npip install torch  # BAD: installs to system Python\n\nsource .venv/bin/activate\npip install torch  # GOOD: installs to virtual environment\n```\n\nKiểm tra xem package của bạn được cài vào đâu:\n\n```bash\nwhich python       # should show .venv/bin/python, not /usr/bin/python\nwhich pip           # should show .venv/bin/pip\n```\n\n### 2. Trộn pip và conda\n\n```bash\nconda create -n myenv python=3.12\nconda activate myenv\nconda install pytorch -c pytorch\npip install some-other-package   # BAD: can break conda's dependency tracking\nconda install some-other-package # GOOD: let conda manage everything\n```\n\nNếu buộc phải dùng pip bên trong conda (một số package chỉ có trên pip), hãy cài tất cả package conda trước, rồi mới cài package pip sau cùng.\n\n### 3. Quên activate\n\n```bash\npython train.py           # uses system Python, missing packages\nsource .venv/bin/activate\npython train.py           # uses project Python, packages found\n```\n\nPrompt của shell phải hiển thị tên môi trường:\n\n```\n(.venv) $ python train.py\n```\n\n### 4. Commit .venv vào git\n\n```bash\necho \".venv/\" >> .gitignore\n```\n\nMôi trường ảo nặng từ 200MB đến 2GB. Chúng chỉ dùng cục bộ, không mang sang máy khác được. Thay vào đó, hãy commit `pyproject.toml` và lockfile.\n\n### 5. Lệch phiên bản CUDA\n\n```bash\nnvidia-smi                # shows driver CUDA version (e.g., 12.4)\npython -c \"import torch; print(torch.version.cuda)\"  # shows PyTorch CUDA version\n\n# These must be compatible.\n# PyTorch CUDA version must be <= driver CUDA version.\n```\n\n## Ứng dụng\n\nChạy script setup để tạo môi trường cho khóa học:\n\n```bash\nbash phases/00-setup-and-tooling/06-python-environments/code/env_setup.sh\n```\n\nScript này tạo một `.venv` ở thư mục gốc của repo, với các dependency cốt lõi đã được cài đặt và kiểm tra.\n\n## Bài tập\n\n1. Chạy `env_setup.sh` và xác nhận tất cả các bước kiểm tra đều pass\n2. Tạo một môi trường ảo thứ hai, cài một phiên bản numpy khác vào đó, và xác nhận hai môi trường được cô lập với nhau\n3. Viết một file `pyproject.toml` cho dự án cần cả PyTorch lẫn Anthropic SDK\n4. Cố tình cài một package toàn cục (không activate venv), để ý xem nó được cài vào đâu, sau đó gỡ cài đặt nó\n\n### Gợi ý\n\n**Bài tập 1.** Chạy `bash phases/00-setup-and-tooling/06-python-environments/code/env_setup.sh` từ thư mục gốc của repo. Đọc từng dòng output; khi một bước kiểm tra thất bại, hãy sửa đúng mục đó rồi chạy lại script cho đến khi không còn bước nào thất bại.\n\n**Bài tập 2.** Tạo môi trường thứ hai trong một thư mục mới bằng `uv venv`, activate nó, rồi cài một phiên bản numpy cũ hơn với version pin, ví dụ `numpy==1.26.4`. Chạy `python -c \"import numpy; print(numpy.__version__)\"` trong từng môi trường; hai phiên bản phải khác nhau.\n\n**Bài tập 3.** Bắt đầu từ ví dụ trong phần Cơ bản về pyproject.toml và liệt kê `torch` cùng `anthropic` trong `dependencies`. Chạy `uv pip install -e .` hoặc `uv sync` trong một môi trường mới; file đúng khi cả hai package đều import được mà không báo lỗi.\n\n**Bài tập 4.** Deactivate mọi môi trường, chạy `pip install --user <small package>`, sau đó chạy `pip show <package>` và đọc dòng `Location`. Gỡ nó bằng `pip uninstall <package>` rồi chạy lại `pip show` để xác nhận nó đã bị xóa.\n\n## Thuật ngữ chính\n\n| Thuật ngữ | Người ta hay nói | Ý nghĩa thực sự |\n|------|----------------|----------------------|\n| Virtual environment | \"Một cái venv\" | Một thư mục cô lập chứa trình thông dịch Python và các package, tách biệt khỏi Python của hệ thống |\n| Lockfile | \"Dependency đã ghim phiên bản\" | Một file liệt kê mọi package cùng phiên bản chính xác của chúng, đảm bảo cài đặt giống hệt nhau trên mọi máy |\n| pyproject.toml | \"Bản setup.py mới\" | File cấu hình chuẩn cho dự án Python, thay thế setup.py/setup.cfg/requirements.txt |\n| Transitive dependency | \"Dependency của dependency\" | Package B phụ thuộc vào C; nếu bạn cài A, mà A phụ thuộc vào B, thì C là dependency bắc cầu của A |\n| CUDA mismatch | \"GPU của tôi không chạy\" | PyTorch được biên dịch cho một phiên bản CUDA khác với phiên bản mà driver GPU của bạn hỗ trợ |\n", "quiz": {"questions": [{"stage": "pre", "question": "Môi trường ảo (venv) giải quyết vấn đề gì?", "options": ["Cung cấp giao diện đồ họa để quản lý script Python", "Cô lập dependency của từng dự án để các dự án khác nhau dùng được các phiên bản package khác nhau", "Tự động cập nhật package lên phiên bản mới nhất", "Giúp code Python chạy nhanh hơn bằng cách tối ưu interpreter"], "correct": 1, "explanation": "Môi trường ảo cho mỗi dự án một bộ package riêng biệt. Nếu không có nó, việc cài PyTorch 2.4 cho dự án này sẽ ghi đè PyTorch 2.1 mà dự án khác đang cần."}, {"stage": "pre", "question": "Trong quản lý dependency của Python, lockfile là gì?", "options": ["Một file khóa phiên bản Python interpreter", "Một file mã hóa các dependency của dự án", "Một file ngăn người khác chỉnh sửa code của bạn", "Một file ghim mọi package vào một phiên bản chính xác để cài đặt tái lập được"], "correct":
