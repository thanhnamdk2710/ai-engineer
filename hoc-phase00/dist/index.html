3, "explanation": "Lockfile ghi lại phiên bản chính xác của mọi package (kể cả dependency bắc cầu), nên ai cài từ nó cũng nhận được đúng các package giống hệt nhau, đảm bảo khả năng tái lập."}, {"stage": "post", "question": "Làm sao kiểm tra lệnh pip và python của bạn đang dùng môi trường ảo chứ không phải Python hệ thống?", "options": ["Chạy 'python --check-env' để kiểm tra", "Chạy 'pip --version' và xem số phiên bản", "Chạy 'which python' và xác nhận kết quả là .venv/bin/python, không phải /usr/bin/python", "Kiểm tra xem màu nền terminal có đổi không"], "correct": 2, "explanation": "'which python' (hoặc 'where python' trên Windows) hiển thị đường dẫn đầy đủ đến interpreter. Nếu nó trỏ tới .venv/bin/python, bạn đang ở trong môi trường ảo."}, {"stage": "post", "question": "Vì sao trộn pip và conda trong cùng một môi trường lại gây rắc rối?", "options": ["Package của pip không tương thích với Python interpreter của conda", "Cài bằng pip có thể làm hỏng việc theo dõi dependency của conda, gây xung đột khó debug", "Nó làm tăng gấp đôi dung lượng ổ đĩa của mọi package", "Conda không thể cài các package mà pip đã cài"], "correct": 1, "explanation": "Conda có bộ giải dependency riêng. Cài bằng pip sẽ bỏ qua nó, nên conda không còn biết trạng thái thật của môi trường. Điều này dẫn đến xung đột dependency rất khó xử lý."}, {"stage": "post", "question": "Code PyTorch của bạn báo 'CUDA not available' dù máy có GPU NVIDIA. Nguyên nhân khả dĩ nhất là gì?", "options": ["PyTorch được cài với phiên bản CUDA không tương thích với GPU driver của bạn", "GPU của bạn không hỗ trợ CUDA", "Bạn quên import module torch.cuda", "Môi trường ảo không thể truy cập phần cứng GPU"], "correct": 0, "explanation": "PyTorch đi kèm CUDA binding được biên dịch cho các phiên bản CUDA cụ thể. Nếu phiên bản CUDA của PyTorch cao hơn phiên bản CUDA mà driver hỗ trợ, CUDA sẽ không khả dụng. Hãy kiểm tra bằng nvidia-smi và torch.version.cuda."}]}, "quiz_lang": "vi", "code": [{"path": "code/env_setup.sh", "lang": "bash", "content": "#!/usr/bin/env bash\nset -euo pipefail\n\nPYTHON_MIN_MAJOR=3\nPYTHON_MIN_MINOR=11\nVENV_DIR=\".venv\"\nCORE_PACKAGES=\"numpy matplotlib jupyter scikit-learn pandas\"\n\nRED='\\033[0;31m'\nGREEN='\\033[0;32m'\nYELLOW='\\033[1;33m'\nNC='\\033[0m'\n\npass() { echo -e \"  ${GREEN}[PASS]${NC} $1\"; }\nfail() { echo -e \"  ${RED}[FAIL]${NC} $1\"; }\nwarn() { echo -e \"  ${YELLOW}[WARN]${NC} $1\"; }\n\nREPO_ROOT=\"$(cd \"$(dirname \"$0\")/../../../..\" && pwd)\"\ncd \"$REPO_ROOT\"\n\necho \"\"\necho \"=== AI Engineering from Scratch: Python Environment Setup ===\"\necho \"\"\necho \"Repo root: $REPO_ROOT\"\necho \"\"\n\nHAS_UV=false\nif command -v uv &> /dev/null; then\n    HAS_UV=true\n    pass \"uv found: $(uv --version)\"\nelse\n    warn \"uv not found. Install it: curl -LsSf https://astral.sh/uv/install.sh | sh\"\n    warn \"Falling back to python3 -m venv + pip\"\nfi\n\nPYTHON_CMD=\"\"\nfor cmd in python3 python; do\n    if command -v \"$cmd\" &> /dev/null; then\n        version=$(\"$cmd\" -c \"import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')\" 2>/dev/null || true)\n        if [ -n \"$version\" ]; then\n            major=$(echo \"$version\" | cut -d. -f1)\n            minor=$(echo \"$version\" | cut -d. -f2)\n            if [ \"$major\" -ge \"$PYTHON_MIN_MAJOR\" ] && [ \"$minor\" -ge \"$PYTHON_MIN_MINOR\" ]; then\n                PYTHON_CMD=\"$cmd\"\n                break\n            fi\n        fi\n    fi\ndone\n\nif [ -z \"$PYTHON_CMD\" ]; then\n    fail \"Python ${PYTHON_MIN_MAJOR}.${PYTHON_MIN_MINOR}+ not found\"\n    echo \"\"\n    echo \"Install Python ${PYTHON_MIN_MAJOR}.${PYTHON_MIN_MINOR}+:\"\n    echo \"  uv:    uv python install 3.12\"\n    echo \"  macOS: brew install python@3.12\"\n    echo \"  Linux: sudo apt install python3.12 python3.12-venv\"\n    exit 1\nfi\n\npass \"Python: $($PYTHON_CMD --version)\"\n\necho \"\"\necho \"--- Creating virtual environment ---\"\necho \"\"\n\nif [ -d \"$VENV_DIR\" ]; then\n    warn \"Existing $VENV_DIR found. Reusing it.\"\nelse\n    if $HAS_UV; then\n        uv venv \"$VENV_DIR\"\n    else\n        \"$PYTHON_CMD\" -m venv \"$VENV_DIR\"\n    fi\n    pass \"Created $VENV_DIR\"\nfi\n\nif [ -f \"$VENV_DIR/bin/activate\" ]; then\n    source \"$VENV_DIR/bin/activate\"\nelif [ -f \"$VENV_DIR/Scripts/activate\" ]; then\n    source \"$VENV_DIR/Scripts/activate\"\nelse\n    fail \"Could not find activation script in $VENV_DIR\"\n    exit 1\nfi\n\npass \"Activated virtual environment\"\n\nVENV_PYTHON=\"$(which python)\"\nif [[ \"$VENV_PYTHON\" != *\"$VENV_DIR\"* ]]; then\n    fail \"Python is not running from the venv: $VENV_PYTHON\"\n    exit 1\nfi\npass \"Python path: $VENV_PYTHON\"\n\necho \"\"\necho \"--- Installing core packages ---\"\necho \"\"\n\nif $HAS_UV; then\n    uv pip install $CORE_PACKAGES\nelse\n    pip install --upgrade pip\n    pip install $CORE_PACKAGES\nfi\n\npass \"Installed: $CORE_PACKAGES\"\n\necho \"\"\necho \"--- Verifying installation ---\"\necho \"\"\n\nFAILURES=0\n\nverify_package() {\n    local pkg=$1\n    local import_name=${2:-$1}\n    if python -c \"import $import_name; print(f'  $pkg: {${import_name}.__version__}')\" 2>/dev/null; then\n        return 0\n    else\n        fail \"$pkg\"\n        FAILURES=$((FAILURES + 1))\n        return 1\n    fi\n}\n\nverify_package \"numpy\" \"numpy\"\nverify_package \"matplotlib\" \"matplotlib\"\nverify_package \"scikit-learn\" \"sklearn\"\nverify_package \"pandas\" \"pandas\"\nverify_package \"jupyter\" \"jupyter_core\"\n\necho \"\"\npython -c \"\nimport numpy as np\na = np.random.randn(3, 3)\nb = np.random.randn(3, 3)\nc = a @ b\nprint(f'  Matrix multiply check: ({a.shape}) @ ({b.shape}) = ({c.shape})')\n\"\npass \"NumPy operations working\"\n\necho \"\"\nif python -c \"import torch\" 2>/dev/null; then\n    TORCH_VERSION=$(python -c \"import torch; print(torch.__version__)\")\n    CUDA_AVAIL=$(python -c \"import torch; print(torch.cuda.is_available())\")\n    pass \"PyTorch $TORCH_VERSION (CUDA: $CUDA_AVAIL)\"\nelse\n    warn \"PyTorch not installed (install later when needed):\"\n    echo \"    uv pip install torch torchvision torchaudio\"\nfi\n\necho \"\"\necho \"=== Summary ===\"\necho \"\"\necho \"  Repo root:    $REPO_ROOT\"\necho \"  Venv:         $REPO_ROOT/$VENV_DIR\"\necho \"  Python:       $(python --version)\"\necho \"  Packages:     $CORE_PACKAGES\"\necho \"\"\n\nif [ \"$FAILURES\" -gt 0 ]; then\n    fail \"$FAILURES package(s) failed verification\"\n    exit 1\nelse\n    pass \"All checks passed\"\n    echo \"\"\n    echo \"Activate this environment in future sessions:\"\n    echo \"\"\n    echo \"  source $REPO_ROOT/$VENV_DIR/bin/activate\"\n    echo \"\"\nfi\n"}]}, {"id": "07", "slug": "07-docker-for-ai", "title_en": "Docker for AI", "title_vi": "Docker cho AI", "en": "# Docker for AI\n\n> Containers make \"works on my machine\" a thing of the past.\n\n**Type:** Build\n**Languages:** Docker\n**Prerequisites:** Phase 0, Lessons 01 and 03\n**Time:** ~60 minutes\n\n## Learning Objectives\n\n- Build a GPU-enabled Docker image with CUDA, PyTorch, and AI libraries from a Dockerfile\n- Mount host directories as volumes to persist models, datasets, and code across container rebuilds\n- Configure the NVIDIA Container Toolkit to expose GPUs inside containers\n- Orchestrate multi-service AI applications (inference server + vector database) using Docker Compose\n\n## The Problem\n\nYou trained a model on your laptop with PyTorch 2.3, CUDA 12.4, and Python 3.12. Your colleague has PyTorch 2.1, CUDA 11.8, and Python 3.10. Your model crashes on their machine. Your Dockerfile works on both.\n\nAI projects are dependency nightmares. A typical stack includes Python, PyTorch, CUDA drivers, cuDNN, system-level C libraries, and specialized packages like flash-attn that need exact compiler versions. Docker packages all of this into a single image that runs identically everywhere.\n\n## The Concept\n\nDocker wraps your code, runtime, libraries, and system tools into an isolated unit called a container. Think of it as a lightweight virtual machine, except it shares the host OS kernel instead of running its own, so it starts in seconds instead of minutes.\n\n```mermaid\ngraph TD\n    subgraph without[\"Without Docker\"]\n        A1[\"Your machine<br/>Python 3.12<br/>CUDA 12.4<br/>PyTorch 2.3\"] -->|crashes| X1[\"???\"]\n        A2[\"Their machine<br/>Python 3.10<br/>CUDA 11.8<br/>PyTorch 2.1\"] -->|crashes| X2[\"???\"]\n        A3[\"Server<br/>Python 3.11<br/>CUDA 12.1<br/>PyTorch 2.2\"] -->|crashes| X3[\"???\"]\n    end\n\n    subgraph with_docker[\"With Docker — Same image everywhere\"]\n        B1[\"Your machine<br/>Python 3.12 | CUDA 12.4<br/>PyTorch 2.3 | Your code\"]\n        B2[\"Their machine<br/>Python 3.12 | CUDA 12.4<br/>PyTorch 2.3 | Your code\"]\n        B3[\"Server<br/>Python 3.12 | CUDA 12.4<br/>PyTorch 2.3 | Your code\"]\n    end\n```\n\n### Why AI projects need Docker more than most\n\n1. **GPU drivers are fragile.** CUDA 12.4 code does not run on CUDA 11.8. Docker isolates the CUDA toolkit inside the container while sharing the host GPU driver through the NVIDIA Container Toolkit.\n\n2. **Model weights are large.** A 7B parameter model is 14 GB in fp16. You do not want to re-download it every time you rebuild. Docker volumes let you mount a models directory from the host.\n\n3. **Multi-service architectures are common.** A real AI application is not just a Python script. It is an inference server, a vector database for RAG, maybe a web frontend. Docker Compose orchestrates all of these with one command.\n\n### Key vocabulary\n\n| Term | What it means |\n|------|---------------|\n| Image | A read-only template. Your recipe. Built from a Dockerfile. |\n| Container | A running instance of an image. Your kitchen. |\n| Dockerfile | Instructions to build an image. Layer by layer. |\n| Volume | Persistent storage that survives container restarts. |\n| docker-compose | A tool for defining multi-container applications in YAML. |\n\n### Common container patterns in AI\n\n```\nDev Container\n  Full toolkit. Editor support. Jupyter. Debugging tools.\n  Used during development and experimentation.\n\nTraining Container\n  Minimal. Just the training script and dependencies.\n  Runs on GPU clusters. No editor, no Jupyter.\n\nInference Container\n  Optimized for serving. Small image. Fast cold start.\n  Runs behind a load balancer in production.\n```\n\n```figure\ns0-image-layers\n```\n\n## Build It\n\n### Step 1: Install Docker\n\n```bash\n# macOS\nbrew install --cask docker\nopen /Applications/Docker.app\n\n# Ubuntu\ncurl -fsSL https://get.docker.com | sh\nsudo usermod -aG docker $USER\n# Log out and back in for group change to take effect\n```\n\nVerify:\n\n```bash\ndocker --version\ndocker run hello-world\n```\n\n### Step 2: Install NVIDIA Container Toolkit (Linux with NVIDIA GPU)\n\nThis lets Docker containers access your GPU. macOS and Windows (WSL2) users can skip this; Docker Desktop handles GPU passthrough differently on those platforms.\n\n```bash\ndistribution=$(. /etc/os-release;echo $ID$VERSION_ID)\ncurl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | sudo gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg\ncurl -s -L https://nvidia.github.io/libnvidia-container/$distribution/libnvidia-container.list | \\\n    sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' | \\\n    sudo tee /etc/apt/sources.list.d/nvidia-container-toolkit.list\n\nsudo apt-get update\nsudo apt-get install -y nvidia-container-toolkit\nsudo nvidia-ctk runtime configure --runtime=docker\nsudo systemctl restart docker\n```\n\nTest GPU access inside a container:\n\n```bash\ndocker run --rm --gpus all nvidia/cuda:12.4.1-base-ubuntu22.04 nvidia-smi\n```\n\nIf you see your GPU info, the toolkit is working.\n\n### Step 3: Understand base images\n\nChoosing the right base image saves hours of debugging.\n\n```\nnvidia/cuda:12.4.1-devel-ubuntu22.04\n  Full CUDA toolkit. Compilers included.\n  Use for: building packages that need nvcc (flash-attn, bitsandbytes)\n  Size: ~4 GB\n\nnvidia/cuda:12.4.1-runtime-ubuntu22.04\n  CUDA runtime only. No compilers.\n  Use for: running pre-built code\n  Size: ~1.5 GB\n\npytorch/pytorch:2.6.0-cuda12.4-cudnn9-runtime\n  PyTorch pre-installed on top of CUDA.\n  Use for: skipping the PyTorch install step\n  Size: ~6 GB\n\npython:3.12-slim\n  No CUDA. CPU only.\n  Use for: inference on CPU, lightweight tools\n  Size: ~150 MB\n```\n\n### Step 4: Write a Dockerfile for AI development\n\nHere is the Dockerfile in `code/Dockerfile`. Walk through it:\n\n```dockerfile\nFROM --platform=linux/amd64 nvidia/cuda:12.4.1-devel-ubuntu22.04\n\nENV DEBIAN_FRONTEND=noninteractive\nENV PYTHONUNBUFFERED=1\n\nRUN apt-get update && apt-get install -y --no-install-recommends \\\n    software-properties-common \\\n    git \\\n    curl \\\n    build-essential \\\n    && add-apt-repository -y ppa:deadsnakes/ppa \\\n    && apt-get update && apt-get install -y --no-install-recommends \\\n    python3.12 \\\n    python3.12-venv \\\n    python3.12-dev \\\n    && rm -rf /var/lib/apt/lists/*\n\nRUN update-alternatives --install /usr/bin/python python /usr/bin/python3.12 1\n\nRUN curl -sSL https://raw.githubusercontent.com/pypa/get-pip/3b73145063be545b649ad9ca83ea8da5fc915a4f/public/get-pip.py -o /tmp/get-pip.py \\\n    && echo \"a341e1a43e38001c551a1508a73ff23636a11970b61d901d9a1cad2a18f57055  /tmp/get-pip.py\" | sha256sum -c - \\\n    && python /tmp/get-pip.py \\\n    && rm /tmp/get-pip.py \\\n    && update-alternatives --install /usr/bin/pip pip /usr/local/bin/pip3.12 1\n\nRUN python -m pip install --no-cache-dir --upgrade pip setuptools wheel\n\nRUN python -m pip install --no-cache-dir \\\n    torch==2.6.0+cu124 \\\n    torchvision==0.21.0+cu124 \\\n    torchaudio==2.6.0+cu124 \\\n    --index-url https://download.pytorch.org/whl/cu124\n\nRUN python -m pip install --no-cache-dir \\\n    numpy \\\n    pandas \\\n    scikit-learn \\\n    matplotlib \\\n    jupyter \\\n    transformers \\\n    datasets \\\n    accelerate \\\n    safetensors\n\nWORKDIR /workspace\n\nVOLUME [\"/workspace\", \"/models\"]\n\nEXPOSE 8888\n\nCMD [\"python\"]\n```\n\nBuild it:\n\n```bash\ndocker build -t ai-dev -f phases/00-setup-and-tooling/07-docker-for-ai/code/Dockerfile .\n```\n\nThis takes a while the first time (downloading CUDA base image + PyTorch). Subsequent builds use cached layers.\n\n**macOS / Apple Silicon (M1/M2/M3/M4):** The `--platform=linux/amd64` on the `FROM` line is what makes this build succeed on a Mac. The CUDA base image also ships an arm64 variant and Docker Desktop picks it automatically on Apple Silicon, but PyTorch publishes its `cu124` wheels for x86_64 only, so the `pip install torch==2.6.0+cu124` layer fails with `No matching distribution found for torch==2.6.0+cu124`. Pinning the platform pulls the x86_64 image and runs it under emulation: the build is slower and the container has no GPU (there is no CUDA on a Mac either way). Drop `--gpus all` from the `docker run` commands below on a Mac. For GPU work on Apple Silicon, run the lessons natively with the MPS build from Lesson 01 and keep this image for x86_64 Linux hosts with an NVIDIA GPU.\n\nRun it:\n\n```bash\ndocker run --rm -it --gpus all \\\n    -v $(pwd):/workspace \\\n    -v ~/models:/models \\\n    ai-dev python -c \"import torch; print(f'PyTorch {torch.__version__}, CUDA: {torch.cuda.is_available()}')\"\n```\n\nRun Jupyter inside the container:\n\n```bash\ndocker run --rm -it --gpus all \\\n    -v $(pwd):/workspace \\\n    -v ~/models:/models \\\n    -p 8888:8888 \\\n    ai-dev jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root\n```\n\n### Step 5: Volume mounts for data and models\n\nVolume mounts are critical for AI work. Without them, your 14 GB model downloads vanish when the container stops.\n\n```bash\n# Mount your code\n-v $(pwd):/workspace\n\n# Mount a shared models directory\n-v ~/models:/models\n\n# Mount datasets\n-v ~/datasets:/data\n```\n\nInside your training script, load from the mounted path:\n\n```python\nfrom transformers import AutoModel\n\nmodel = AutoModel.from_pretrained(\"/models/llama-7b\")\n```\n\nThe model lives on your host filesystem. Rebuild the container as often as you want without re-downloading.\n\n### Step 6: Docker Compose for multi-service AI apps\n\nA real RAG application needs an inference server and a vector database. Docker Compose runs both with one command.\n\nSee `code/docker-compose.yml`:\n\n```yaml\nservices:\n  ai-dev:\n    build:\n      context: .\n      dockerfile: Dockerfile\n    deploy:\n      resources:\n        reservations:\n          devices:\n            - driver: nvidia\n              count: all\n              capabilities: [gpu]\n    volumes:\n      - ../../../:/workspace\n      - ~/models:/models\n      - ~/datasets:/data\n    ports:\n      - \"8888:8888\"\n    stdin_open: true\n    tty: true\n    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root\n\n  qdrant:\n    image: qdrant/qdrant:v1.12.5\n    ports:\n      - \"6333:6333\"\n      - \"6334:6334\"\n    volumes:\n      - qdrant_data:/qdrant/storage\n\nvolumes:\n  qdrant_data:\n```\n\nStart everything:\n\n```bash\ncd phases/00-setup-and-tooling/07-docker-for-ai/code\ndocker compose up -d\n```\n\nNow your AI dev container can reach the vector database at `http://qdrant:6333` by service name. Docker Compose creates a shared network automatically.\n\nTest the connection from inside the AI container:\n\n```python\nfrom qdrant_client import QdrantClient\n\nclient = QdrantClient(host=\"qdrant\", port=6333)\nprint(client.get_collections())\n```\n\nStop everything:\n\n```bash\ndocker compose down\n```\n\nAdd `-v` to also delete the qdrant volume:\n\n```bash\ndocker compose down -v\n```\n\n### Step 7: Useful Docker commands for AI work\n\n```bash\n# List running containers\ndocker ps\n\n# List all images and their sizes\ndocker images\n\n# Remove unused images (reclaim disk space)\ndocker system prune -a\n\n# Check GPU usage inside a running container\ndocker exec -it <container_id> nvidia-smi\n\n# Copy a file from container to host\ndocker cp <container_id>:/workspace/results.csv ./results.csv\n\n# View container logs\ndocker logs -f <container_id>\n```\n\n## Use It\n\nYou now have a reproducible AI development environment. For the rest of this course:\n\n- Use `docker compose up` to start your dev environment and vector database together\n- Mount your code, models, and data as volumes so nothing is lost between rebuilds\n- When a lesson requires a new Python package, add it to the Dockerfile and rebuild\n- Share your Dockerfile with teammates. They get the exact same environment.\n\n### No GPU?\n\nRemove the `--gpus all` flag and the NVIDIA deploy block. The container still works for CPU-based lessons. PyTorch detects the absence of CUDA and falls back to CPU automatically.\n\n## Exercises\n\n1. Build the Dockerfile and run `python -c \"import torch; print(torch.__version__)\"` inside the container\n2. Start the docker-compose stack and verify Qdrant is accessible from the AI container at `http://qdrant:6333/collections`\n3. Add `flask` to the Dockerfile, rebuild, and run a simple API server on port 5000. Map the port with `-p 5000:5000`\n4. Measure the image size with `docker images`. Try switching the base image from `devel` to `runtime` and compare sizes\n\n### Hints\n\n**Exercise 1.** Build with the `docker build -t ai-dev -f phases/00-setup-and-tooling/07-docker-for-ai/code/Dockerfile .` command from the lesson, then run the import inside `docker run --rm ai-dev`. On a Mac, leave out `--gpus all`, as the lesson explains. The container must print a version that starts with `2.6.0`.\n\n**Exercise 2.** Run `docker compose up -d` in the `code/` folder, then open a shell in the `ai-dev` service with `docker compose exec ai-dev bash`. Inside it, run `curl http://qdrant:6333/collections`; a JSON reply means the service name resolves on the compose network.\n\n**Exercise 3.** Add a `RUN pip install flask` line to the Dockerfile, rebuild, and start the server with `host=\"0.0.0.0\"`, because a server bound to localhost inside the container is not reachable from outside. Open `http://localhost:5000` on your machine to confirm that the port mapping works.\n\n**Exercise 4.** Run `docker images ai-dev` and write down the SIZE column. Change `devel` to `runtime` in the `FROM` line, build with a new tag, and compare the two sizes; the runtime image leaves out the compilers and headers.\n\n## Key Terms\n\n| Term | What people say | What it actually means |\n|------|----------------|----------------------|\n| Container | \"Lightweight VM\" | An isolated process using the host kernel, with its own filesystem and network |\n| Image layer | \"Cached step\" | Each Dockerfile instruction creates a layer. Unchanged layers are cached, so rebuilds are fast. |\n| NVIDIA Container Toolkit | \"GPU in Docker\" | A runtime hook that exposes host GPUs to containers via `--gpus` flag |\n| Volume mount | \"Shared folder\" | A directory on the host mapped into the container. Changes persist after the container stops. |\n| Base image | \"Starting point\" | The `FROM` image your Dockerfile builds on top of. Determines what is pre-installed. |\n", "vi": "# Docker cho AI\n\n> Với container, câu \"máy tôi chạy được mà\" sẽ trở thành chuyện của quá khứ.\n\n**Type:** Build\n**Languages:** Docker\n**Prerequisites:** Phase 0, Lessons 01 and 03\n**Time:** ~60 minutes\n\n## Mục tiêu bài học\n\n- Build một Docker image hỗ trợ GPU với CUDA, PyTorch và các thư viện AI từ một Dockerfile\n- Mount các thư mục trên máy host dưới dạng volume để giữ lại model, dataset và code qua các lần build lại container\n- Cấu hình NVIDIA Container Toolkit để đưa GPU vào bên trong container\n- Điều phối ứng dụng AI nhiều service (inference server + vector database) bằng Docker Compose\n\n## Vấn đề\n\nBạn train một model trên laptop với PyTorch 2.3, CUDA 12.4 và Python 3.12. Đồng nghiệp của bạn dùng PyTorch 2.1, CUDA 11.8 và Python 3.10. Model của bạn crash trên máy họ. Còn Dockerfile của bạn thì chạy được trên cả hai máy.\n\nCác dự án AI là cơn ác mộng về dependency. Một stack điển hình gồm Python, PyTorch, driver CUDA, cuDNN, các thư viện C cấp hệ thống, và những package chuyên dụng như flash-attn đòi hỏi đúng phiên bản compiler. Docker đóng gói tất cả những thứ này vào một image duy nhất, chạy giống hệt nhau ở mọi nơi.\n\n## Khái niệm\n\nDocker bọc code, runtime, thư viện và các công cụ hệ thống của bạn vào một đơn vị cô lập gọi là container. Hãy hình dung nó như một máy ảo gọn nhẹ, chỉ khác là nó dùng chung kernel của hệ điều hành host thay vì chạy kernel riêng, nên nó khởi động trong vài giây thay vì vài phút.\n\n```mermaid\ngraph TD\n    subgraph without[\"Without Docker\"]\n        A1[\"Your machine<br/>Python 3.12<br/>CUDA 12.4<br/>PyTorch 2.3\"] -->|crashes| X1[\"???\"]\n        A2[\"Their machine<br/>Python 3.10<br/>CUDA 11.8<br/>PyTorch 2.1\"] -->|crashes| X2[\"???\"]\n        A3[\"Server<br/>Python 3.11<br/>CUDA 12.1<br/>PyTorch 2.2\"] -->|crashes| X3[\"???\"]\n    end\n\n    subgraph with_docker[\"With Docker — Same image everywhere\"]\n        B1[\"Your machine<br/>Python 3.12 | CUDA 12.4<br/>PyTorch 2.3 | Your code\"]\n        B2[\"Their machine<br/>Python 3.12 | CUDA 12.4<br/>PyTorch 2.3 | Your code\"]\n        B3[\"Server<br/>Python 3.12 | CUDA 12.4<br/>PyTorch 2.3 | Your code\"]\n    end\n```\n\n### Vì sao dự án AI cần Docker hơn hầu hết các loại dự án khác\n\n1. **Driver GPU rất dễ vỡ.** Code viết cho CUDA 12.4 không chạy trên CUDA 11.8. Docker cô lập CUDA toolkit bên trong container, trong khi vẫn dùng chung driver GPU của host thông qua NVIDIA Container Toolkit.\n\n2. **Trọng số model rất lớn.** Một model 7B tham số nặng 14 GB ở dạng fp16. Bạn không muốn tải lại nó mỗi lần build lại. Docker volume cho phép bạn mount thư mục models từ máy host vào.\n\n3. **Kiến trúc nhiều service là chuyện phổ biến.** Một ứng dụng AI thực tế không chỉ là một script Python. Nó gồm một inference server, một vector database cho RAG, có thể thêm một web frontend. Docker Compose điều phối tất cả chỉ bằng một lệnh.\n\n### Từ vựng chính\n\n| Thuật ngữ | Ý nghĩa |\n|------|---------------|\n| Image | Một template chỉ đọc. Công thức nấu ăn của bạn. Được build từ một Dockerfile. |\n| Container | Một instance đang chạy của image. Căn bếp của bạn. |\n| Dockerfile | Các chỉ dẫn để build một image. Từng layer một. |\n| Volume | Bộ nhớ lưu trữ bền vững, vẫn còn sau khi container khởi động lại. |\n| docker-compose | Công cụ định nghĩa ứng dụng nhiều container bằng YAML. |\n\n### Các mẫu container thường gặp trong AI\n\n```\nDev Container\n  Full toolkit. Editor support. Jupyter. Debugging tools.\n  Used during development and experimentation.\n\nTraining Container\n  Minimal. Just the training script and dependencies.\n  Runs on GPU clusters. No editor, no Jupyter.\n\nInference Container\n  Optimized for serving. Small image. Fast cold start.\n  Runs behind a load balancer in production.\n```\n\n```figure\ns0-image-layers\n```\n\n## Tự xây dựng\n\n### Bước 1: Cài Docker\n\n```bash\n# macOS\nbrew install --cask docker\nopen /Applications/Docker.app\n\n# Ubuntu\ncurl -fsSL https://get.docker.com | sh\nsudo usermod -aG docker $USER\n# Log out and back in for group change to take effect\n```\n\nKiểm tra:\n\n```bash\ndocker --version\ndocker run hello-world\n```\n\n### Bước 2: Cài NVIDIA Container Toolkit (Linux có GPU NVIDIA)\n\nBước này cho phép Docker container truy cập GPU của bạn. Người dùng macOS và Windows (WSL2) có thể bỏ qua; trên các nền tảng đó, Docker Desktop xử lý việc chuyển GPU vào container theo cách khác.\n\n```bash\ndistribution=$(. /etc/os-release;echo $ID$VERSION_ID)\ncurl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | sudo gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg\ncurl -s -L https://nvidia.github.io/libnvidia-container/$distribution/libnvidia-container.list | \\\n    sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' | \\\n    sudo tee /etc/apt/sources.list.d/nvidia-container-toolkit.list\n\nsudo apt-get update\nsudo apt-get install -y nvidia-container-toolkit\nsudo nvidia-ctk runtime configure --runtime=docker\nsudo systemctl restart docker\n```\n\nKiểm tra quyền truy cập GPU bên trong container:\n\n```bash\ndocker run --rm --gpus all nvidia/cuda:12.4.1-base-ubuntu22.04 nvidia-smi\n```\n\nNếu bạn thấy thông tin GPU của mình hiện ra, toolkit đã hoạt động.\n\n### Bước 3: Hiểu về base image\n\nChọn đúng base image giúp bạn tiết kiệm hàng giờ debug.\n\n```\nnvidia/cuda:12.4.1-devel-ubuntu22.04\n  Full CUDA toolkit. Compilers included.\n  Use for: building packages that need nvcc (flash-attn, bitsandbytes)\n  Size: ~4 GB\n\nnvidia/cuda:12.4.1-runtime-ubuntu22.04\n  CUDA runtime only. No compilers.\n  Use for: running pre-built code\n  Size: ~1.5 GB\n\npytorch/pytorch:2.6.0-cuda12.4-cudnn9-runtime\n  PyTorch pre-installed on top of CUDA.\n  Use for: skipping the PyTorch install step\n  Size: ~6 GB\n\npython:3.12-slim\n  No CUDA. CPU only.\n  Use for: inference on CPU, lightweight tools\n  Size: ~150 MB\n```\n\n### Bước 4: Viết Dockerfile cho môi trường phát triển AI\n\nĐây là Dockerfile trong `code/Dockerfile`. Hãy cùng đi qua nó:\n\n```dockerfile\nFROM --platform=linux/amd64 nvidia/cuda:12.4.1-devel-ubuntu22.04\n\nENV DEBIAN_FRONTEND=noninteractive\nENV PYTHONUNBUFFERED=1\n\nRUN apt-get update && apt-get install -y --no-install-recommends \\\n    software-properties-common \\\n    git \\\n    curl \\\n    build-essential \\\n    && add-apt-repository -y ppa:deadsnakes/ppa \\\n    && apt-get update && apt-get install -y --no-install-recommends \\\n    python3.12 \\\n    python3.12-venv \\\n    python3.12-dev \\\n    && rm -rf /var/lib/apt/lists/*\n\nRUN update-alternatives --install /usr/bin/python python /usr/bin/python3.12 1\n\nRUN curl -sSL https://raw.githubusercontent.com/pypa/get-pip/3b73145063be545b649ad9ca83ea8da5fc915a4f/public/get-pip.py -o /tmp/get-pip.py \\\n    && echo \"a341e1a43e38001c551a1508a73ff23636a11970b61d901d9a1cad2a18f57055  /tmp/get-pip.py\" | sha256sum -c - \\\n    && python /tmp/get-pip.py \\\n    && rm /tmp/get-pip.py \\\n    && update-alternatives --install /usr/bin/pip pip /usr/local/bin/pip3.12 1\n\nRUN python -m pip install --no-cache-dir --upgrade pip setuptools wheel\n\nRUN python -m pip install --no-cache-dir \\\n    torch==2.6.0+cu124 \\\n    torchvision==0.21.0+cu124 \\\n    torchaudio==2.6.0+cu124 \\\n    --index-url https://download.pytorch.org/whl/cu124\n\nRUN python -m pip install --no-cache-dir \\\n    numpy \\\n    pandas \\\n    scikit-learn \\\n    matplotlib \\\n    jupyter \\\n    transformers \\\n    datasets \\\n    accelerate \\\n    safetensors\n\nWORKDIR /workspace\n\nVOLUME [\"/workspace\", \"/models\"]\n\nEXPOSE 8888\n\nCMD [\"python\"]\n```\n\nBuild nó:\n\n```bash\ndocker build -t ai-dev -f phases/00-setup-and-tooling/07-docker-for-ai/code/Dockerfile .\n```\n\nLần đầu sẽ mất khá lâu (tải base image CUDA + PyTorch). Các lần build sau sẽ dùng các layer đã được cache.\n\n**macOS / Apple Silicon (M1/M2/M3/M4):** Chính `--platform=linux/amd64` trên dòng `FROM` là thứ giúp lệnh build này thành công trên Mac. Base image CUDA cũng có bản arm64 và Docker Desktop sẽ tự động chọn bản đó trên Apple Silicon, nhưng PyTorch chỉ phát hành các wheel `cu124` cho x86_64, nên layer `pip install torch==2.6.0+cu124` sẽ thất bại với lỗi `No matching distribution found for torch==2.6.0+cu124`. Việc ghim platform sẽ kéo image x86_64 về và chạy nó qua giả lập: build chậm hơn và container không có GPU (dù sao thì Mac cũng không có CUDA). Trên Mac, hãy bỏ `--gpus all` khỏi các lệnh `docker run` bên dưới. Để làm việc với GPU trên Apple Silicon, hãy chạy các bài học trực tiếp trên máy với bản build MPS từ Lesson 01, và để dành image này cho các máy host Linux x86_64 có GPU NVIDIA.\n\nChạy nó:\n\n```bash\ndocker run --rm -it --gpus all \\\n    -v $(pwd):/workspace \\\n    -v ~/models:/models \\\n    ai-dev python -c \"import torch; print(f'PyTorch {torch.__version__}, CUDA: {torch.cuda.is_available()}')\"\n```\n\nChạy Jupyter bên trong container:\n\n```bash\ndocker run --rm -it --gpus all \\\n    -v $(pwd):/workspace \\\n    -v ~/models:/models \\\n    -p 8888:8888 \\\n    ai-dev jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root\n```\n\n### Bước 5: Mount volume cho dữ liệu và model\n\nMount volume là yếu tố then chốt trong công việc AI. Không có nó, những model 14 GB bạn đã tải về sẽ biến mất khi container dừng.\n\n```bash\n# Mount your code\n-v $(pwd):/workspace\n\n# Mount a shared models directory\n-v ~/models:/models\n\n# Mount datasets\n-v ~/datasets:/data\n```\n\nTrong script training, hãy load từ đường dẫn đã mount:\n\n```python\nfrom transformers import AutoModel\n\nmodel = AutoModel.from_pretrained(\"/models/llama-7b\")\n```\n\nModel nằm trên filesystem của máy host. Bạn có thể build lại container bao nhiêu lần tùy thích mà không phải tải lại.\n\n### Bước 6: Docker Compose cho ứng dụng AI nhiều service\n\nMột ứng dụng RAG thực tế cần một inference server và một vector database. Docker Compose chạy cả hai chỉ bằng một lệnh.\n\nXem `code/docker-compose.yml`:\n\n```yaml\nservices:\n  ai-dev:\n    build:\n      context: .\n      dockerfile: Dockerfile\n    deploy:\n      resources:\n        reservations:\n          devices:\n            - driver: nvidia\n              count: all\n              capabilities: [gpu]\n    volumes:\n      - ../../../:/workspace\n      - ~/models:/models\n      - ~/datasets:/data\n    ports:\n      - \"8888:8888\"\n    stdin_open: true\n    tty: true\n    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root\n\n  qdrant:\n    image: qdrant/qdrant:v1.12.5\n    ports:\n      - \"6333:6333\"\n      - \"6334:6334\"\n    volumes:\n      - qdrant_data:/qdrant/storage\n\nvolumes:\n  qdrant_data:\n```\n\nKhởi động mọi thứ:\n\n```bash\ncd phases/00-setup-and-tooling/07-docker-for-ai/code\ndocker compose up -d\n```\n\nGiờ thì container dev AI của bạn có thể truy cập vector database tại `http://qdrant:6333` thông qua tên service. Docker Compose tự động tạo một network dùng chung.\n\nKiểm tra kết nối từ bên trong container AI:\n\n```python\nfrom qdrant_client import QdrantClient\n\nclient = QdrantClient(host=\"qdrant\", port=6333)\nprint(client.get_collections())\n```\n\nDừng mọi thứ:\n\n```bash\ndocker compose down\n```\n\nThêm `-v` để xóa luôn volume của qdrant:\n\n```bash\ndocker compose down -v\n```\n\n### Bước 7: Các lệnh Docker hữu ích cho công việc AI\n\n```bash\n# List running containers\ndocker ps\n\n# List all images and their sizes\ndocker images\n\n# Remove unused images (reclaim disk space)\ndocker system prune -a\n\n# Check GPU usage inside a running container\ndocker exec -it <container_id> nvidia-smi\n\n# Copy a file from container to host\ndocker cp <container_id>:/workspace/results.csv ./results.csv\n\n# View container logs\ndocker logs -f <container_id>\n```\n\n## Ứng dụng\n\nGiờ bạn đã có một môi trường phát triển AI tái lập được. Trong suốt phần còn lại của khóa học:\n\n- Dùng `docker compose up` để khởi động cùng lúc môi trường dev và vector database\n- Mount code, model và dữ liệu dưới dạng volume để không mất gì giữa các lần build lại\n- Khi một bài học cần package Python mới, hãy thêm nó vào Dockerfile rồi build lại\n- Chia sẻ Dockerfile với đồng đội. Họ sẽ có đúng môi trường giống hệt bạn.\n\n### Không có GPU?\n\nBỏ flag `--gpus all` và khối deploy của NVIDIA. Container vẫn chạy tốt cho các bài học dùng CPU. PyTorch sẽ phát hiện không có CUDA và tự động chuyển sang CPU.\n\n## Bài tập\n\n1. Build Dockerfile và chạy `python -c \"import torch; print(torch.__version__)\"` bên trong container\n2. Khởi động stack docker-compose và xác nhận Qdrant có thể truy cập được từ container AI tại `http://qdrant:6333/collections`\n3. Thêm `flask` vào Dockerfile, build lại, và chạy một API server đơn giản trên cổng 5000. Map cổng bằng `-p 5000:5000`\n4. Đo kích thước image bằng `docker images`. Thử đổi base image từ `devel` sang `runtime` và so sánh kích thước\n\n### Gợi ý\n\n**Bài tập 1.** Build bằng lệnh `docker build -t ai-dev -f phases/00-setup-and-tooling/07-docker-for-ai/code/Dockerfile .` trong bài, sau đó chạy lệnh import bên trong `docker run --rm ai-dev`. Trên Mac, hãy bỏ `--gpus all` như bài học đã giải thích. Container phải in ra một phiên bản bắt đầu bằng `2.6.0`.\n\n**Bài tập 2.** Chạy `docker compose up -d` trong thư mục `code/`, sau đó mở một shell trong service `ai-dev` bằng `docker compose exec ai-dev bash`. Bên trong đó, chạy `curl http://qdrant:6333/collections`; nhận được phản hồi JSON nghĩa là tên service đã được phân giải trên network của compose.\n\n**Bài tập 3.** Thêm dòng `RUN pip install flask` vào Dockerfile, build lại, và khởi động server với `host=\"0.0.0.0\"`, vì một server bind vào localhost bên trong container sẽ không thể truy cập từ bên ngoài. Mở `http://localhost:5000` trên máy của bạn để xác nhận việc map cổng hoạt động.\n\n**Bài tập 4.** Chạy `docker images ai-dev` và ghi lại cột SIZE. Đổi `devel` thành `runtime` trong dòng `FROM`, build với một tag mới, rồi so sánh hai kích thước; image runtime không có compiler và header.\n\n## Thuật ngữ chính\n\n| Thuật ngữ | Người ta hay nói | Ý nghĩa thực sự |\n|------|----------------|----------------------|\n| Container | \"Máy ảo gọn nhẹ\" | Một tiến trình (process) cô lập dùng kernel của host, có filesystem và network riêng |\n| Image layer | \"Bước được cache\" | Mỗi chỉ dẫn trong Dockerfile tạo ra một layer. Các layer không thay đổi sẽ được cache, nên build lại rất nhanh. |\n| NVIDIA Container Toolkit | \"GPU trong Docker\" | Một runtime hook đưa GPU của host vào container thông qua flag `--gpus` |\n| Volume mount | \"Thư mục dùng chung\" | Một thư mục trên host được ánh xạ vào container. Các thay đổi vẫn còn sau khi container dừng. |\n| Base image | \"Điểm xuất phát\" | Image trong lệnh `FROM` mà Dockerfile của bạn build lên trên. Nó quyết định những gì đã được cài sẵn. |\n", "quiz": {"questions": [{"stage": "pre", "question": "Khác biệt chính giữa Docker container và máy ảo (VM) là gì?", "options": ["Không có khác biệt nào đáng kể trong thực tế", "Container chậm hơn nhưng an toàn hơn VM", "Container dùng chung kernel của hệ điều hành host, còn VM chạy cả một hệ điều hành đầy đủ riêng", "Container chỉ chạy được Linux, còn VM hỗ trợ mọi hệ điều hành"], "correct": 2, "explanation": "Container dùng chung kernel của host và cô lập ở mức tiến trình (process), nên khởi động chỉ trong vài giây. VM chạy cả một hệ điều hành khách với kernel riêng, tốn nhiều tài nguyên hơn và khởi động chậm hơn."}, {"stage": "pre", "question": "Dockerfile là gì?", "options": ["Một file cấu hình cho Docker daemon", "Một tập chỉ dẫn để build Docker image theo từng layer", "Một file liệt kê các container đang chạy", "Một file log ghi lại hoạt động của container"], "correct": 1, "explanation": "Dockerfile chứa các chỉ dẫn tuần tự (FROM, RUN, COPY, v.v.) mà Docker thực thi để build image. Mỗi chỉ dẫn tạo ra một layer được cache."}, {"stage": "post", "question": "Vì sao volume mount cực kỳ quan trọng khi phát triển AI với Docker?", "options": ["Volume cho phép nhiều container dùng chung một GPU", "Volume giúp container chạy nhanh hơn nhờ tốc độ ổ đĩa của host", "Volume là bắt buộc để package Python cài đặt đúng", "Volume giữ lại dữ liệu (mô hình, dataset, code) qua các lần build lại container để bạn không phải tải lại hàng GB mỗi lần"], "correct": 3, "explanation": "Không có volume, mọi thứ bên trong container sẽ mất khi nó dừng. Volume mount ánh xạ thư mục của host vào container, nên weight của mô hình (hơn 14 GB) và dataset vẫn còn sau khi build lại."}, {"stage": "post", "question": "NVIDIA Container Toolkit cho phép làm gì?", "options": ["Cài CUDA driver bên trong container", "Chạy container GPU NVIDIA trên phần cứng AMD", "Đưa GPU của host vào Docker container thông qua flag --gpus", "Biên dịch code CUDA trong quá trình docker build"], "correct": 2, "explanation": "NVIDIA Container Toolkit là một runtime hook giúp container truy cập GPU của host. CUDA toolkit nằm bên trong container, còn GPU driver được dùng chung từ host."}, {"stage": "post", "question": "Trong một file Docker Compose cho AI, service 'ai-dev' kết nối tới vector database 'qdrant' bằng cách nào?", "options": ["Mount một volume dùng chung giữa hai container", "Dùng tên service 'qdrant' làm hostname, vì Compose tạo một network dùng chung", "Cấu hình VPN giữa các container", "Dùng địa chỉ IP và port của máy host"], "correct": 1, "explanation": "Docker Compose tự động tạo một network dùng chung, nơi các service gọi nhau bằng tên. Container ai-dev kết nối tới 'http://qdrant:6333' bằng cách dùng tên service làm hostname."}]}, "quiz_lang": "vi", "code": [{"path": "code/Dockerfile", "lang": "dockerfile", "content": "FROM --platform=linux/amd64 nvidia/cuda:12.4.1-devel-ubuntu22.04\n\nENV DEBIAN_FRONTEND=noninteractive\nENV PYTHONUNBUFFERED=1\n\nRUN apt-get update && apt-get install -y --no-install-recommends \\\n    software-properties-common \\\n    git \\\n    curl \\\n    build-essential \\\n    && add-apt-repository -y ppa:deadsnakes/ppa \\\n    && apt-get update && apt-get install -y --no-install-recommends \\\n    python3.12 \\\n    python3.12-venv \\\n    python3.12-dev \\\n    && rm -rf /var/lib/apt/lists/*\n\nRUN update-alternatives --install /usr/bin/python python /usr/bin/python3.12 1\n\nRUN curl -sSL https://raw.githubusercontent.com/pypa/get-pip/3b73145063be545b649ad9ca83ea8da5fc915a4f/public/get-pip.py -o /tmp/get-pip.py \\\n    && echo \"a341e1a43e38001c551a1508a73ff23636a11970b61d901d9a1cad2a18f57055  /tmp/get-pip.py\" | sha256sum -c - \\\n    && python /tmp/get-pip.py \\\n    && rm /tmp/get-pip.py \\\n    && update-alternatives --install /usr/bin/pip pip /usr/local/bin/pip3.12 1\n\nRUN python -m pip install --no-cache-dir --upgrade pip setuptools wheel\n\nRUN python -m pip install --no-cache-dir \\\n    torch==2.6.0+cu124 \\\n    torchvision==0.21.0+cu124 \\\n    torchaudio==2.6.0+cu124 \\\n    --index-url https://download.pytorch.org/whl/cu124\n\nRUN python -m pip install --no-cache-dir \\\n    numpy \\\n    pandas \\\n    scikit-learn \\\n    matplotlib \\\n    jupyter \\\n    transformers \\\n    datasets \\\n    accelerate \\\n    safetensors\n\nWORKDIR /workspace\n\nVOLUME [\"/workspace\", \"/models\"]\n\nEXPOSE 8888\n\nCMD [\"python\"]\n"}, {"path": "code/docker-compose.yml", "lang": "yaml", "content": "services:\n  ai-dev:\n    build:\n      context: .\n      dockerfile: Dockerfile\n    deploy:\n      resources:\n        reservations:\n          devices:\n            - driver: nvidia\n              count: all\n              capabilities: [gpu]\n    volumes:\n      - ../../../:/workspace\n      - ~/models:/models\n      - ~/datasets:/data\n    ports:\n      - \"8888:8888\"\n    stdin_open: true\n    tty: true\n    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root\n\n  qdrant:\n    image: qdrant/qdrant:v1.12.5\n    ports:\n      - \"6333:6333\"\n      - \"6334:6334\"\n    volumes:\n      - qdrant_data:/qdrant/storage\n\nvolumes:\n  qdrant_data:\n"}]}, {"id": "08", "slug": "08-editor-setup", "title_en": "Editor Setup", "title_vi": "Thiết lập editor", "en": "# Editor Setup\n\n> Your editor is your co-pilot. Configure it once so it stays out of your way and starts pulling its weight.\n\n**Type:** Build\n**Languages:** --\n**Prerequisites:** Phase 0, Lesson 01\n**Time:** ~20 minutes\n\n## Learning Objectives\n\n- Install VS Code with essential extensions for Python, Jupyter, linting, and remote SSH\n- Configure format-on-save, type checking, and notebook output scrolling for AI workflows\n- Set up Remote SSH to edit and debug code on remote GPU machines as if they were local\n- Evaluate editor alternatives (Cursor, Windsurf, Neovim) and their tradeoffs for AI work\n\n## The Problem\n\nYou'll spend thousands of hours inside your editor writing Python, running notebooks, debugging training loops, and SSH-ing into GPU boxes. A misconfigured editor turns every session into friction: no autocomplete, no type hints, no inline errors, manual formatting, and a clunky terminal workflow.\n\nThe right setup takes 20 minutes. Skipping it costs you 20 minutes every day.\n\n## The Concept\n\nAn AI engineering editor setup needs five things:\n\n```mermaid\ngraph TD\n    L5[\"5. Remote Development<br/>SSH into GPU boxes, cloud VMs\"] --> L4\n    L4[\"4. Terminal Integration<br/>Run scripts, debug, monitor GPU\"] --> L3\n    L3[\"3. AI-Specific Settings<br/>Auto-format, type checking, rulers\"] --> L2\n    L2[\"2. Extensions<br/>Python, Jupyter, Pylance, GitLens\"] --> L1\n    L1[\"1. Base Editor<br/>VS Code — free, extensible, universal\"]\n```\n\n```figure\ns0-lsp-roundtrip\n```\n\n## Build It\n\n### Step 1: Install VS Code\n\nVS Code is the recommended editor. It is free, runs on every OS, has first-class Jupyter notebook support, and the extension ecosystem covers everything you need for AI work.\n\nDownload it from [code.visualstudio.com](https://code.visualstudio.com/).\n\nVerify from the terminal:\n\n```bash\ncode --version\n```\n\nIf `code` is not found on macOS, open VS Code, press `Cmd+Shift+P`, type \"Shell Command\", and select \"Install 'code' command in PATH\".\n\n### Step 2: Install Essential Extensions\n\nOpen the integrated terminal in VS Code (`` Ctrl+` `` on every platform) and install the extensions that matter for AI work:\n\n```bash\ncode --install-extension ms-python.python\ncode --install-extension ms-python.vscode-pylance\ncode --install-extension ms-toolsai.jupyter\ncode --install-extension eamodio.gitlens\ncode --install-extension ms-vscode-remote.remote-ssh\ncode --install-extension ms-python.debugpy\ncode --install-extension ms-python.black-formatter\ncode --install-extension charliermarsh.ruff\n```\n\nWhat each one does:\n\n| Extension | Why |\n|-----------|-----|\n| Python | Language support, virtual env detection, run/debug |\n| Pylance | Fast type checking, autocomplete, import resolution |\n| Jupyter | Run notebooks inside VS Code, variable explorer |\n| GitLens | See who changed what, inline git blame |\n| Remote SSH | Open a folder on a remote GPU box as if it were local |\n| Debugpy | Step-through debugging for Python |\n| Black Formatter | Auto-format on save, consistent style |\n| Ruff | Fast linting, catches common mistakes |\n\nThe file `code/vscode/extensions.json` in this lesson contains the full recommendations list. Copy it to `.vscode/extensions.json` in your project folder, and VS Code prompts you to install them when you open that folder.\n\n### Step 3: Configure Settings\n\nCopy the settings from `code/vscode/settings.json` in this lesson, or apply them manually through `Settings > Open Settings (JSON)`.\n\nThe key settings for AI work:\n\n```jsonc\n{\n    \"python.analysis.typeCheckingMode\": \"basic\",\n    \"editor.formatOnSave\": true,\n    \"editor.rulers\": [88, 120],\n    \"notebook.output.scrolling\": true,\n    \"files.autoSave\": \"afterDelay\"\n}\n```\n\nWhy these matter:\n\n- **Type checking on basic**: Catches wrong argument types before you run. Saves debugging time on tensor shape mismatches and wrong API parameters.\n- **Format on save**: Never think about formatting again. Black handles it.\n- **Rulers at 88 and 120**: Black wraps at 88. The 120 marker shows when docstrings and comments are getting too long.\n- **Notebook output scrolling**: Training loops print thousands of lines. Without scrolling, the output panel explodes.\n- **Auto-save**: You will forget to save. Your training script will run stale code. Auto-save prevents that.\n\n### Step 4: Terminal Integration\n\nVS Code's integrated terminal is where you run training scripts, monitor GPUs, and manage environments.\n\nSet it up properly:\n\n```jsonc\n{\n    \"terminal.integrated.defaultProfile.osx\": \"zsh\",\n    \"terminal.integrated.defaultProfile.linux\": \"bash\",\n    \"terminal.integrated.fontSize\": 13,\n    \"terminal.integrated.scrollback\": 10000\n}\n```\n\nUseful shortcuts:\n\n| Action | macOS | Linux/Windows |\n|--------|-------|---------------|\n| Toggle terminal | `` Ctrl+` `` | `` Ctrl+` `` |\n| New terminal | `` Ctrl+Shift+` `` | `` Ctrl+Shift+` `` |\n| Split terminal | `Cmd+\\` | `Ctrl+Shift+5` |\n\nSplit terminals are useful: one for running your script, one for monitoring GPU with `nvidia-smi -l 1` or `watch -n 1 nvidia-smi`.\n\n### Step 5: Remote Development (SSH into GPU Boxes)\n\nThis is the most important extension for AI work. You will run training on remote machines (cloud VMs, lab servers, Lambda, Vast.ai). Remote SSH lets you open the remote filesystem, edit files, run terminals, and debug as if everything were local.\n\nSetup:\n\n1. Install the Remote SSH extension (done in Step 2).\n2. Press `Ctrl+Shift+P` (or `Cmd+Shift+P`), type \"Remote-SSH: Connect to Host\".\n3. Enter `user@your-gpu-box-ip`.\n4. VS Code installs its server component on the remote machine automatically.\n\nFor passwordless access, set up SSH keys:\n\n```bash\nssh-keygen -t ed25519 -C \"your-email@example.com\"\nssh-copy-id user@your-gpu-box-ip\n```\n\nAdd the host to `~/.ssh/config` for convenience:\n\n```\nHost gpu-box\n    HostName 203.0.113.50\n    User ubuntu\n    IdentityFile ~/.ssh/id_ed25519\n    ForwardAgent yes\n```\n\nNow `Remote-SSH: Connect to Host > gpu-box` connects instantly.\n\n## Alternatives\n\n### Cursor\n\n[cursor.com](https://cursor.com) is a VS Code fork with built-in AI code generation. It uses the same extension ecosystem and settings format. If you use Cursor, everything in this lesson still applies. Import the same `settings.json` and `extensions.json`.\n\n### Windsurf\n\n[windsurf.com](https://windsurf.com) is another AI-first VS Code fork. Same story: same extensions, same settings format, same Remote SSH support.\n\n### Vim/Neovim\n\nIf you already use Vim or Neovim and are productive in it, stay there. The minimum setup for AI Python work:\n\n- **pyright** or **pylsp** for type checking (via Mason or manual install)\n- **nvim-lspconfig** for language server integration\n- **jupyter-vim** or **molten-nvim** for notebook-like execution\n- **telescope.nvim** for file/symbol search\n- **none-ls.nvim** with black and ruff for formatting/linting\n\nIf you do not already use Vim, do not start now. The learning curve will compete with learning AI engineering. Use VS Code.\n\n## Use It\n\nWith this setup, your daily workflow looks like:\n\n1. Open the project folder in VS Code (or connect via Remote SSH to a GPU box).\n2. Write Python in the editor with autocomplete, type hints, and inline errors.\n3. Run Jupyter notebooks inline with the Jupyter extension.\n4. Use the integrated terminal for training scripts, `uv pip install`, and GPU monitoring.\n5. Review changes with GitLens before committing.\n\n## Exercises\n\n1. Install VS Code and all extensions listed in Step 2\n2. Copy the `settings.json` from this lesson into your VS Code config\n3. Open a Python file and verify that Pylance shows type hints and Black formats on save\n4. If you have access to a remote machine, set up Remote SSH and open a folder on it\n\n### Hints\n\n**Exercise 1.** Install the extensions from the table in Step 2, or install each ID in `code/vscode/extensions.json` with `code --install-extension <id>`. Run `code --list-extensions` and check each ID against the file.\n\n**Exercise 2.** Open Settings > Open Settings (JSON) and copy the content of `code/vscode/settings.json` into it. If the file already has settings, merge the keys and keep valid JSON; VS Code marks a broken file with a red line.\n\n**Exercise 3.** Write a function with a type annotation, then hover on a call to it; Pylance shows the inferred type. Add extra spaces in a line and save the file; Black must reformat the line on save.\n\n**Exercise 4.** Add the server to `~/.ssh/config` first and confirm that `ssh <host>` works in a terminal. Then use the Remote SSH command to connect; the status bar shows the host name when VS Code runs on the remote machine.\n\n## Key Terms\n\n| Term | What people say | What it actually means |\n|------|----------------|----------------------|\n| LSP | \"Autocomplete engine\" | Language Server Protocol: a standard for editors to get type info, completions, and diagnostics from a language-specific server |\n| Pylance | \"The Python plugin\" | Microsoft's Python language server using Pyright for type checking and IntelliSense |\n| Remote SSH | \"Working on the server\" | VS Code extension that runs a lightweight server on a remote machine and streams the UI to your local editor |\n| Format on save | \"Auto-prettier\" | The editor runs a formatter (Black, Ruff) every time you save, so code style is always consistent |\n", "vi": "# Thiết lập editor\n\n> Editor là người phụ lái của bạn. Cấu hình một lần để nó không cản đường bạn và bắt đầu thực sự gánh việc.\n\n**Type:** Build\n**Languages:** --\n**Prerequisites:** Phase 0, Lesson 01\n**Time:** ~20 minutes\n\n## Mục tiêu bài học\n\n- Cài VS Code cùng các extension thiết yếu cho Python, Jupyter, linting và remote SSH\n- Cấu hình format-on-save, type checking và cuộn output của notebook cho quy trình làm việc AI\n- Thiết lập Remote SSH để chỉnh sửa và debug code trên máy GPU từ xa như thể đang làm trên máy local\n- Đánh giá các editor thay thế (Cursor, Windsurf, Neovim) và các đánh đổi của chúng khi làm AI\n\n## Vấn đề\n\nBạn sẽ dành hàng nghìn giờ trong editor để viết Python, chạy notebook, debug vòng lặp training và SSH vào các máy GPU. Một editor cấu hình sai sẽ biến mỗi phiên làm việc thành một chuỗi vướng víu: không có autocomplete, không có type hint, không báo lỗi inline, phải format thủ công, và thao tác terminal lóng ngóng.\n\nThiết lập đúng chỉ mất 20 phút. Bỏ qua nó sẽ khiến bạn mất 20 phút mỗi ngày.\n\n## Khái niệm\n\nThiết lập editor cho AI engineering cần năm thứ:\n\n```mermaid\ngraph TD\n    L5[\"5. Remote Development<br/>SSH into GPU boxes, cloud VMs\"] --> L4\n    L4[\"4. Terminal Integration<br/>Run scripts, debug, monitor GPU\"] --> L3\n    L3[\"3. AI-Specific Settings<br/>Auto-format, type checking, rulers\"] --> L2\n    L2[\"2. Extensions<br/>Python, Jupyter, Pylance, GitLens\"] --> L1\n    L1[\"1. Base Editor<br/>VS Code — free, extensible, universal\"]\n```\n\n```figure\ns0-lsp-roundtrip\n```\n\n## Tự xây dựng\n\n### Bước 1: Cài VS Code\n\nVS Code là editor được khuyên dùng. Nó miễn phí, chạy trên mọi hệ điều hành, hỗ trợ Jupyter notebook hàng đầu, và hệ sinh thái extension đáp ứng mọi thứ bạn cần cho công việc AI.\n\nTải về tại [code.visualstudio.com](https://code.visualstudio.com/).\n\nKiểm tra từ terminal:\n\n```bash\ncode --version\n```\n\nNếu trên macOS không tìm thấy lệnh `code`, hãy mở VS Code, nhấn `Cmd+Shift+P`, gõ \"Shell Command\" và chọn \"Install 'code' command in PATH\".\n\n### Bước 2: Cài các extension thiết yếu\n\nMở terminal tích hợp trong VS Code (`` Ctrl+` `` trên mọi nền tảng) và cài các extension quan trọng cho công việc AI:\n\n```bash\ncode --install-extension ms-python.python\ncode --install-extension ms-python.vscode-pylance\ncode --install-extension ms-toolsai.jupyter\ncode --install-extension eamodio.gitlens\ncode --install-extension ms-vscode-remote.remote-ssh\ncode --install-extension ms-python.debugpy\ncode --install-extension ms-python.black-formatter\ncode --install-extension charliermarsh.ruff\n```\n\nCông dụng của từng extension:\n\n| Extension | Lý do |\n|-----------|-----|\n| Python | Hỗ trợ ngôn ngữ, phát hiện virtual env, chạy/debug |\n| Pylance | Type checking nhanh, autocomplete, phân giải import |\n| Jupyter | Chạy notebook ngay trong VS Code, trình xem biến |\n| GitLens | Xem ai đã thay đổi gì, git blame inline |\n| Remote SSH | Mở một thư mục trên máy GPU từ xa như thể nó nằm trên máy local |\n| Debugpy | Debug từng bước cho Python |\n| Black Formatter | Tự động format khi lưu, style nhất quán |\n| Ruff | Linting nhanh, bắt các lỗi thường gặp |\n\nFile `code/vscode/extensions.json` trong bài này chứa danh sách khuyến nghị đầy đủ. Hãy copy nó vào `.vscode/extensions.json` trong thư mục dự án của bạn, và VS Code sẽ nhắc bạn cài chúng khi bạn mở thư mục đó.\n\n### Bước 3: Cấu hình settings\n\nCopy các settings từ `code/vscode/settings.json` trong bài này, hoặc áp dụng thủ công qua `Settings > Open Settings (JSON)`.\n\nCác settings quan trọng cho công việc AI:\n\n```jsonc\n{\n    \"python.analysis.typeCheckingMode\": \"basic\",\n    \"editor.formatOnSave\": true,\n    \"editor.rulers\": [88, 120],\n    \"notebook.output.scrolling\": true,\n    \"files.autoSave\": \"afterDelay\"\n}\n```\n\nVì sao chúng quan trọng:\n\n- **Type checking ở mức basic**: Bắt lỗi sai kiểu tham số trước khi bạn chạy. Tiết kiệm thời gian debug các lỗi lệch shape của tensor và sai tham số API.\n- **Format khi lưu**: Không bao giờ phải bận tâm về format nữa. Black lo hết.\n- **Ruler ở 88 và 120**: Black ngắt dòng ở cột 88. Vạch 120 cho bạn biết khi nào docstring và comment đang quá dài.\n- **Cuộn output của notebook**: Vòng lặp training in ra hàng nghìn dòng. Không có cuộn, panel output sẽ phình to không kiểm soát.\n- **Auto-save**: Bạn sẽ quên lưu. Script training của bạn sẽ chạy code cũ. Auto-save ngăn chuyện đó.\n\n### Bước 4: Tích hợp terminal\n\nTerminal tích hợp của VS Code là nơi bạn chạy script training, theo dõi GPU và quản lý môi trường.\n\nThiết lập nó cho đúng:\n\n```jsonc\n{\n    \"terminal.integrated.defaultProfile.osx\": \"zsh\",\n    \"terminal.integrated.defaultProfile.linux\": \"bash\",\n    \"terminal.integrated.fontSize\": 13,\n    \"terminal.integrated.scrollback\": 10000\n}\n```\n\nCác phím tắt hữu ích:\n\n| Thao tác | macOS | Linux/Windows |\n|--------|-------|---------------|\n| Bật/tắt terminal | `` Ctrl+` `` | `` Ctrl+` `` |\n| Terminal mới | `` Ctrl+Shift+` `` | `` Ctrl+Shift+` `` |\n| Chia đôi terminal | `Cmd+\\` | `Ctrl+Shift+5` |\n\nChia đôi terminal rất tiện: một bên để chạy script, một bên để theo dõi GPU bằng `nvidia-smi -l 1` hoặc `watch -n 1 nvidia-smi`.\n\n### Bước 5: Remote Development (SSH vào máy GPU)\n\nĐây là extension quan trọng nhất cho công việc AI. Bạn sẽ chạy training trên các máy từ xa (cloud VM, server của lab, Lambda, Vast.ai). Remote SSH cho phép bạn mở filesystem từ xa, sửa file, chạy terminal và debug như thể mọi thứ đều ở máy local.\n\nThiết lập:\n\n1. Cài extension Remote SSH (đã làm ở Bước 2).\n2. Nhấn `Ctrl+Shift+P` (hoặc `Cmd+Shift+P`), gõ \"Remote-SSH: Connect to Host\".\n3. Nhập `user@your-gpu-box-ip`.\n4. VS Code sẽ tự động cài thành phần server của nó lên máy từ xa.\n\nĐể truy cập không cần mật khẩu, hãy thiết lập SSH key:\n\n```bash\nssh-keygen -t ed25519 -C \"your-email@example.com\"\nssh-copy-id user@your-gpu-box-ip\n```\n\nThêm host vào `~/.ssh/config` cho tiện:\n\n```\nHost gpu-box\n    HostName 203.0.113.50\n    User ubuntu\n    IdentityFile ~/.ssh/id_ed25519\n    ForwardAgent yes\n```\n\nGiờ thì `Remote-SSH: Connect to Host > gpu-box` sẽ kết nối ngay lập tức.\n\n## Các lựa chọn thay thế\n\n### Cursor\n\n[cursor.com](https://cursor.com) là một bản fork của VS Code có tích hợp sẵn tính năng sinh code bằng AI. Nó dùng cùng hệ sinh thái extension và định dạng settings. Nếu bạn dùng Cursor, mọi thứ trong bài này vẫn áp dụng được. Hãy import cùng file `settings.json` và `extensions.json`.\n\n### Windsurf\n\n[windsurf.com](https://windsurf.com) là một bản fork VS Code khác, lấy AI làm trọng tâm. Câu chuyện cũng tương tự: cùng extension, cùng định dạng settings, cùng hỗ trợ Remote SSH.\n\n### Vim/Neovim\n\nNếu bạn đã dùng Vim hoặc Neovim và làm việc hiệu quả với nó, cứ tiếp tục dùng. Thiết lập tối thiểu cho công việc Python AI:\n\n- **pyright** hoặc **pylsp** cho type checking (qua Mason hoặc cài thủ công)\n- **nvim-lspconfig** để tích hợp language server\n- **jupyter-vim** hoặc **molten-nvim** để chạy code kiểu notebook\n- **telescope.nvim** để tìm kiếm file/symbol\n- **none-ls.nvim** cùng black và ruff để format/linting\n\nNếu bạn chưa dùng Vim, đừng bắt đầu lúc này. Đường cong học tập của nó sẽ tranh giành thời gian với việc học AI engineering. Hãy dùng VS Code.\n\n## Ứng dụng\n\nVới thiết lập này, quy trình làm việc hằng ngày của bạn sẽ như sau:\n\n1. Mở thư mục dự án trong VS Code (hoặc kết nối qua Remote SSH tới một máy GPU).\n2. Viết Python trong editor với autocomplete, type hint và báo lỗi inline.\n3. Chạy Jupyter notebook ngay trong editor với extension Jupyter.\n4. Dùng terminal tích hợp để chạy script training, `uv pip install` và theo dõi GPU.\n5. Xem lại thay đổi bằng GitLens trước khi commit.\n\n## Bài tập\n\n1. Cài VS Code và tất cả extension được liệt kê ở Bước 2\n2. Copy file `settings.json` từ bài này vào cấu hình VS Code của bạn\n3. Mở một file Python và xác nhận Pylance hiển thị type hint và Black format khi lưu\n4. Nếu bạn có quyền truy cập một máy từ xa, hãy thiết lập Remote SSH và mở một thư mục trên đó\n\n### Gợi ý\n\n**Bài tập 1.** Cài các extension từ bảng ở Bước 2, hoặc cài từng ID trong `code/vscode/extensions.json` bằng `code --install-extension <id>`. Chạy `code --list-extensions` và đối chiếu từng ID với file.\n\n**Bài tập 2.** Mở Settings > Open Settings (JSON) và copy nội dung của `code/vscode/settings.json` vào đó. Nếu file đã có sẵn settings, hãy gộp các key lại và giữ JSON hợp lệ; VS Code sẽ đánh dấu file bị hỏng bằng một đường gạch đỏ.\n\n**Bài tập 3.** Viết một hàm có type annotation, sau đó di chuột lên một lời gọi hàm đó; Pylance sẽ hiển thị kiểu được suy ra. Thêm vài khoảng trắng thừa vào một dòng rồi lưu file; Black phải format lại dòng đó khi lưu.\n\n**Bài tập 4.** Thêm server vào `~/.ssh/config` trước và xác nhận `ssh <host>` chạy được trong terminal. Sau đó dùng lệnh Remote SSH để kết nối; thanh trạng thái sẽ hiển thị tên host khi VS Code đang chạy trên máy từ xa.\n\n## Thuật ngữ chính\n\n| Thuật ngữ | Người ta hay nói | Ý nghĩa thực sự |\n|------|----------------|----------------------|\n| LSP | \"Engine autocomplete\" | Language Server Protocol: một chuẩn giúp editor lấy thông tin kiểu, gợi ý hoàn thành code và chẩn đoán lỗi từ một server riêng cho từng ngôn ngữ |\n| Pylance | \"Plugin Python\" | Language server cho Python của Microsoft, dùng Pyright để type checking và IntelliSense |\n| Remote SSH | \"Làm việc trên server\" | Extension của VS Code chạy một server gọn nhẹ trên máy từ xa và stream giao diện về editor trên máy local của bạn |\n| Format on save | \"Auto-prettier\" | Editor chạy một formatter (Black, Ruff) mỗi lần bạn lưu, nên style code luôn nhất quán |\n", "quiz": {"questions": [{"stage": "pre", "question": "Language Server Protocol (LSP) là gì?", "options": ["Một giao thức để truyền file giữa các editor", "Một định dạng nén cho file source code", "Một giao thức mạng để pair programming từ xa", "Một chuẩn để editor nhận thông tin kiểu, gợi ý hoàn thành code và chẩn đoán lỗi từ một server riêng cho từng ngôn ngữ"], "correct": 3, "explanation": "LSP là một giao thức chuẩn hóa cho phép editor giao tiếp với language server để có các tính năng như autocomplete, kiểm tra kiểu và chẩn đoán lỗi, bất kể bạn dùng editor nào."}, {"stage": "pre", "question": "Vì sao format-on-save hữu ích cho các dự án làm theo nhóm?", "options": ["Nó đảm bảo code style nhất quán giữa mọi người đóng góp mà không cần format thủ công", "Nó nén code để thao tác git nhanh hơn", "Nó giảm dung lượng file bằng cách xóa khoảng trắng", "Nó bắt được bug runtime trước khi code được chạy"], "correct": 0, "explanation": "Format-on-save chạy một formatter (như Black hoặc Ruff) mỗi khi bạn lưu file, đảm bảo mọi đoạn code đều theo cùng quy ước style, bất kể ai viết."}, {"stage": "post", "question": "Extension VS Code nào cho phép bạn sửa code trên một máy GPU từ xa như thể đang
