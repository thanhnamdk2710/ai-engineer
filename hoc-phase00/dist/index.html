er-toml\"\n    ]\n}\n"}, {"path": "code/vscode/settings.json", "lang": "json", "content": "{\n    \"python.analysis.typeCheckingMode\": \"basic\",\n    \"python.analysis.autoImportCompletions\": true,\n    \"python.analysis.inlayHints.functionReturnTypes\": true,\n    \"python.analysis.inlayHints.variableTypes\": false,\n\n    \"[python]\": {\n        \"editor.defaultFormatter\": \"ms-python.black-formatter\",\n        \"editor.formatOnSave\": true,\n        \"editor.codeActionsOnSave\": {\n            \"source.organizeImports\": \"explicit\"\n        }\n    },\n\n    \"black-formatter.args\": [\"--line-length\", \"88\"],\n\n    \"ruff.lint.run\": \"onSave\",\n\n    \"editor.rulers\": [88, 120],\n    \"editor.tabSize\": 4,\n    \"editor.insertSpaces\": true,\n    \"editor.renderWhitespace\": \"trailing\",\n    \"editor.bracketPairColorization.enabled\": true,\n    \"editor.stickyScroll.enabled\": true,\n    \"editor.minimap.enabled\": false,\n\n    \"files.autoSave\": \"afterDelay\",\n    \"files.autoSaveDelay\": 1000,\n    \"files.trimTrailingWhitespace\": true,\n    \"files.insertFinalNewline\": true,\n    \"files.exclude\": {\n        \"**/__pycache__\": true,\n        \"**/.ipynb_checkpoints\": true,\n        \"**/*.pyc\": true,\n        \"**/.pytest_cache\": true,\n        \"**/.mypy_cache\": true,\n        \"**/.ruff_cache\": true\n    },\n\n    \"notebook.output.scrolling\": true,\n    \"notebook.output.textLineLimit\": 500,\n    \"notebook.cellToolbarLocation\": \"right\",\n\n    \"terminal.integrated.scrollback\": 10000,\n    \"terminal.integrated.fontSize\": 13,\n    \"terminal.integrated.defaultProfile.osx\": \"zsh\",\n    \"terminal.integrated.defaultProfile.linux\": \"bash\",\n\n    \"git.autofetch\": true,\n    \"git.confirmSync\": false,\n    \"gitlens.codeLens.enabled\": false,\n\n    \"search.exclude\": {\n        \"**/.venv\": true,\n        \"**/node_modules\": true,\n        \"**/__pycache__\": true,\n        \"**/dist\": true,\n        \"**/*.egg-info\": true\n    }\n}\n"}]}, {"id": "09", "slug": "09-data-management", "title_en": "Data Management", "title_vi": "Quản lý dữ liệu", "en": "# Data Management\n\n> Data is the fuel. How you manage it determines how fast you go.\n\n**Type:** Build\n**Language:** Python\n**Prerequisites:** Phase 0, Lesson 01\n**Time:** ~45 minutes\n\n## Learning Objectives\n\n- Load, stream, and cache datasets using the Hugging Face `datasets` library\n- Convert between CSV, JSON, Parquet, and Arrow formats and explain their tradeoffs\n- Create reproducible train/validation/test splits with fixed random seeds\n- Manage large model and dataset files using `.gitignore`, Git LFS, or DVC\n\n## The Problem\n\nEvery AI project starts with data. You need to find datasets, download them, convert between formats, split them for training and evaluation, and version them so experiments are reproducible. Doing this manually every time is slow and error-prone. You need a repeatable workflow.\n\n## The Concept\n\n```mermaid\ngraph TD\n    A[\"Hugging Face Hub\"] --> B[\"datasets library\"]\n    B --> C[\"Load / Stream\"]\n    C --> D[\"Local Cache<br/>~/.cache/huggingface/\"]\n    B --> E[\"Format Conversion<br/>CSV, JSON, Parquet, Arrow\"]\n    E --> F[\"Data Splits<br/>train / val / test\"]\n    F --> G[\"Your Training Pipeline\"]\n```\n\nThe Hugging Face `datasets` library is the standard way to load data for AI work. It handles downloading, caching, format conversion, and streaming out of the box.\n\n```figure\ns0-data-pipeline\n```\n\n## Build It\n\n### Step 1: Install the datasets library\n\n```bash\npip install datasets huggingface_hub\n```\n\n### Step 2: Load a dataset\n\n```python\nfrom datasets import load_dataset\n\ndataset = load_dataset(\"stanfordnlp/imdb\")\nprint(dataset)\nprint(dataset[\"train\"][0])\n```\n\nThis downloads the IMDB movie review dataset. After the first download, it loads from cache at `~/.cache/huggingface/datasets/`.\n\n### Step 3: Stream large datasets\n\nSome datasets are too large to fit on disk. Streaming loads them row by row without downloading the full thing.\n\n```python\ndataset = load_dataset(\"wikimedia/wikipedia\", \"20231101.en\", split=\"train\", streaming=True)\n\nfor i, example in enumerate(dataset):\n    print(example[\"title\"])\n    if i >= 4:\n        break\n```\n\nStreaming gives you an `IterableDataset`. You process rows as they arrive. Memory usage stays constant regardless of dataset size.\n\n### Step 4: Dataset formats\n\nThe `datasets` library uses Apache Arrow under the hood. You can convert to other formats depending on what your pipeline needs.\n\n```python\ndataset = load_dataset(\"stanfordnlp/imdb\", split=\"train\")\n\ndataset.to_csv(\"imdb_train.csv\")\ndataset.to_json(\"imdb_train.json\")\ndataset.to_parquet(\"imdb_train.parquet\")\n```\n\nFormat comparison:\n\n| Format | Size | Read Speed | Best For |\n|--------|------|-----------|----------|\n| CSV | Large | Slow | Human readability, spreadsheets |\n| JSON | Large | Slow | APIs, nested data |\n| Parquet | Small | Fast | Analytics, columnar queries |\n| Arrow | Small | Fastest | In-memory processing (what `datasets` uses internally) |\n\nFor AI work, Parquet is the best storage format. Arrow is what you work with in memory. CSV and JSON are for interchange.\n\n### Step 5: Data splits\n\nEvery ML project needs three splits:\n\n- **Train**: The model learns from this (typically 80%)\n- **Validation**: You check progress during training (typically 10%)\n- **Test**: Final evaluation after training is done (typically 10%)\n\nSome datasets come pre-split. When they don't, split them yourself:\n\n```python\ndataset = load_dataset(\"stanfordnlp/imdb\", split=\"train\")\n\nsplit = dataset.train_test_split(test_size=0.2, seed=42)\ntrain_val = split[\"train\"].train_test_split(test_size=0.125, seed=42)\n\ntrain_ds = train_val[\"train\"]\nval_ds = train_val[\"test\"]\ntest_ds = split[\"test\"]\n\nprint(f\"Train: {len(train_ds)}, Val: {len(val_ds)}, Test: {len(test_ds)}\")\n```\n\nAlways set a seed for reproducibility. The same seed produces the same split every time.\n\n### Step 6: Download and cache models\n\nModels are large files. The `huggingface_hub` library handles downloading and caching.\n\n```python\nfrom huggingface_hub import hf_hub_download, snapshot_download\n\nmodel_path = hf_hub_download(\n    repo_id=\"sentence-transformers/all-MiniLM-L6-v2\",\n    filename=\"config.json\"\n)\nprint(f\"Cached at: {model_path}\")\n\nmodel_dir = snapshot_download(\"sentence-transformers/all-MiniLM-L6-v2\")\nprint(f\"Full model at: {model_dir}\")\n```\n\nModels cache to `~/.cache/huggingface/hub/`. Once downloaded, they load instantly on subsequent runs.\n\n### Step 7: Handle large files\n\nModel weights and large datasets should not go into git. Three options:\n\n**Option A: .gitignore (simplest)**\n\n```\n*.bin\n*.safetensors\n*.pt\n*.onnx\ndata/*.parquet\ndata/*.csv\nmodels/\n```\n\n**Option B: Git LFS (track large files in git)**\n\n```bash\ngit lfs install\ngit lfs track \"*.bin\"\ngit lfs track \"*.safetensors\"\ngit add .gitattributes\n```\n\nGit LFS stores pointers in your repo and the actual files on a separate server. GitHub gives you 1 GB free.\n\n**Option C: DVC (data version control)**\n\n```bash\npip install dvc\ndvc init\ndvc add data/training_set.parquet\ngit add data/training_set.parquet.dvc data/.gitignore\ngit commit -m \"Track training data with DVC\"\n```\n\nDVC creates small `.dvc` files that point to your data. The data itself lives in S3, GCS, or another remote storage backend.\n\n| Approach | Complexity | Best For |\n|----------|-----------|----------|\n| .gitignore | Low | Personal projects, downloaded data you can re-fetch |\n| Git LFS | Medium | Teams sharing model weights via git |\n| DVC | High | Reproducible experiments, large datasets, teams |\n\nFor this course, `.gitignore` is enough. Use DVC when you need to reproduce exact experiments across machines.\n\n### Step 8: Storage patterns\n\n**Local storage** works for datasets under ~10 GB. The HF cache handles this automatically.\n\n**Cloud storage** is for anything larger or shared across machines:\n\n```python\nimport os\n\nlocal_path = os.path.expanduser(\"~/.cache/huggingface/datasets/\")\n\n# s3_path = \"s3://my-bucket/datasets/\"\n# gcs_path = \"gs://my-bucket/datasets/\"\n```\n\nDVC integrates with S3 and GCS directly:\n\n```bash\ndvc remote add -d myremote s3://my-bucket/dvc-store\ndvc push\n```\n\nFor this course, local storage is sufficient. Cloud storage becomes relevant when you fine-tune on remote GPU instances.\n\n## Datasets Used in This Course\n\n| Dataset | Lessons | Size | What It Teaches |\n|---------|---------|------|----------------|\n| IMDB | Tokenization, classification | 84 MB | Text classification basics |\n| WikiText | Language modeling | 181 MB | Next-token prediction |\n| SQuAD | QA systems | 35 MB | Question answering, spans |\n| Common Crawl (subset) | Embeddings | Varies | Large-scale text processing |\n| MNIST | Vision basics | 21 MB | Image classification fundamentals |\n| COCO (subset) | Multimodal | Varies | Image-text pairs |\n\nYou do not need to download all of these now. Each lesson specifies what it needs.\n\n## Use It\n\nRun the utility script to verify everything works:\n\n```bash\npython code/data_utils.py\n```\n\nThis downloads a small dataset, converts it, splits it, and prints a summary.\n\n## Ship It\n\nThis lesson produces:\n- `code/data_utils.py` - reusable data loading and caching utility\n- `outputs/prompt-data-helper.md` - prompt for finding the right dataset for a task\n\n## Exercises\n\n1. Load the `glue` dataset with the `mrpc` config and inspect the first 5 examples\n2. Stream the `c4` dataset and count how many examples you can process in 10 seconds\n3. Convert a dataset to Parquet and compare the file size to CSV\n4. Create a 70/15/15 train/val/test split with a fixed seed and verify the sizes\n\n### Hints\n\n**Exercise 1.** Call `load_and_inspect(\"glue\", \"mrpc\")` from `code/data_utils.py`, or `load_dataset(\"glue\", \"mrpc\")` directly, and print `ds[\"train\"][:5]`. Each example must have `sentence1`, `sentence2`, and `label` fields.\n\n**Exercise 2.** Load the dataset with `streaming=True`, as `stream_dataset` does, and read examples in a loop that stops when `time.time()` passes the start time plus 10 seconds. Print the count; run it twice, because the first run includes the connection start-up.\n\n**Exercise 3.** Save the same dataset with `to_csv` and `to_parquet`, as `convert_format` does, then compare the sizes with `ls -lh` or `os.path.getsize`. Load the Parquet file back with `load_from_parquet` and check that the row count did not change.\n\n**Exercise 4.** Use `train_test_split` twice with a fixed `seed`: first split off 30 percent, then split that 30 percent in half. The three lengths must add up to the original length, and a second run with the same seed must give the same first row in each split.\n\n## Key Terms\n\n| Term | What people say | What it actually means |\n|------|----------------|----------------------|\n| Dataset split | \"Training data\" | A named subset (train/val/test) used at different stages of the ML lifecycle |\n| Streaming | \"Load it lazily\" | Processing data row by row from a remote source without downloading the full dataset |\n| Parquet | \"Compressed CSV\" | A columnar file format optimized for analytical queries and storage efficiency |\n| Arrow | \"Fast dataframe\" | An in-memory columnar format used internally by the datasets library for zero-copy reads |\n| Git LFS | \"Git for big files\" | An extension that stores large files outside the git repo while keeping pointers in version control |\n| DVC | \"Git for data\" | A version control system for datasets and models that integrates with cloud storage |\n| Cache | \"Already downloaded\" | A local copy of previously fetched data, stored at ~/.cache/huggingface/ by default |\n", "vi": "# Quản lý dữ liệu\n\n> Dữ liệu là nhiên liệu. Cách bạn quản lý nó quyết định bạn đi nhanh đến đâu.\n\n**Type:** Build\n**Language:** Python\n**Prerequisites:** Phase 0, Lesson 01\n**Time:** ~45 minutes\n\n## Mục tiêu bài học\n\n- Load, stream và cache dataset bằng thư viện `datasets` của Hugging Face\n- Chuyển đổi qua lại giữa các định dạng CSV, JSON, Parquet và Arrow, đồng thời giải thích được ưu nhược điểm của từng loại\n- Tạo các phần chia train/validation/test tái lập được với random seed cố định\n- Quản lý các file model và dataset dung lượng lớn bằng `.gitignore`, Git LFS hoặc DVC\n\n## Vấn đề\n\nMọi dự án AI đều bắt đầu từ dữ liệu. Bạn cần tìm dataset, tải về, chuyển đổi định dạng, chia ra để train và đánh giá, rồi quản lý phiên bản để các thí nghiệm có thể tái lập. Lần nào cũng làm thủ công thì vừa chậm vừa dễ sai. Bạn cần một quy trình làm lại được.\n\n## Khái niệm\n\n```mermaid\ngraph TD\n    A[\"Hugging Face Hub\"] --> B[\"datasets library\"]\n    B --> C[\"Load / Stream\"]\n    C --> D[\"Local Cache<br/>~/.cache/huggingface/\"]\n    B --> E[\"Format Conversion<br/>CSV, JSON, Parquet, Arrow\"]\n    E --> F[\"Data Splits<br/>train / val / test\"]\n    F --> G[\"Your Training Pipeline\"]\n```\n\nThư viện `datasets` của Hugging Face là cách tiêu chuẩn để load dữ liệu cho các công việc AI. Nó lo sẵn việc tải về, cache, chuyển đổi định dạng và streaming.\n\n```figure\ns0-data-pipeline\n```\n\n## Tự xây dựng\n\n### Bước 1: Cài đặt thư viện datasets\n\n```bash\npip install datasets huggingface_hub\n```\n\n### Bước 2: Load một dataset\n\n```python\nfrom datasets import load_dataset\n\ndataset = load_dataset(\"stanfordnlp/imdb\")\nprint(dataset)\nprint(dataset[\"train\"][0])\n```\n\nĐoạn này tải về dataset đánh giá phim IMDB. Sau lần tải đầu tiên, dữ liệu sẽ được load từ cache tại `~/.cache/huggingface/datasets/`.\n\n### Bước 3: Stream các dataset lớn\n\nMột số dataset quá lớn, không vừa ổ đĩa. Streaming load chúng theo từng dòng mà không cần tải về toàn bộ.\n\n```python\ndataset = load_dataset(\"wikimedia/wikipedia\", \"20231101.en\", split=\"train\", streaming=True)\n\nfor i, example in enumerate(dataset):\n    print(example[\"title\"])\n    if i >= 4:\n        break\n```\n\nStreaming trả về cho bạn một `IterableDataset`. Bạn xử lý từng dòng ngay khi nó tới. Lượng bộ nhớ sử dụng giữ nguyên bất kể dataset lớn cỡ nào.\n\n### Bước 4: Các định dạng dataset\n\nThư viện `datasets` dùng Apache Arrow ở bên dưới. Bạn có thể chuyển sang định dạng khác tùy theo nhu cầu của pipeline.\n\n```python\ndataset = load_dataset(\"stanfordnlp/imdb\", split=\"train\")\n\ndataset.to_csv(\"imdb_train.csv\")\ndataset.to_json(\"imdb_train.json\")\ndataset.to_parquet(\"imdb_train.parquet\")\n```\n\nSo sánh các định dạng:\n\n| Định dạng | Dung lượng | Tốc độ đọc | Phù hợp nhất cho |\n|--------|------|-----------|----------|\n| CSV | Lớn | Chậm | Dễ đọc với người, bảng tính |\n| JSON | Lớn | Chậm | API, dữ liệu lồng nhau |\n| Parquet | Nhỏ | Nhanh | Phân tích, truy vấn theo cột |\n| Arrow | Nhỏ | Nhanh nhất | Xử lý trong bộ nhớ (thứ mà `datasets` dùng bên trong) |\n\nVới công việc AI, Parquet là định dạng lưu trữ tốt nhất. Arrow là thứ bạn làm việc cùng trong bộ nhớ. CSV và JSON dùng để trao đổi dữ liệu.\n\n### Bước 5: Chia dữ liệu\n\nDự án ML nào cũng cần ba phần chia:\n\n- **Train**: Model học từ phần này (thường là 80%)\n- **Validation**: Bạn kiểm tra tiến độ trong lúc train (thường là 10%)\n- **Test**: Đánh giá cuối cùng sau khi train xong (thường là 10%)\n\nMột số dataset đã được chia sẵn. Nếu chưa, hãy tự chia:\n\n```python\ndataset = load_dataset(\"stanfordnlp/imdb\", split=\"train\")\n\nsplit = dataset.train_test_split(test_size=0.2, seed=42)\ntrain_val = split[\"train\"].train_test_split(test_size=0.125, seed=42)\n\ntrain_ds = train_val[\"train\"]\nval_ds = train_val[\"test\"]\ntest_ds = split[\"test\"]\n\nprint(f\"Train: {len(train_ds)}, Val: {len(val_ds)}, Test: {len(test_ds)}\")\n```\n\nLuôn đặt seed để kết quả tái lập được. Cùng một seed sẽ cho ra cùng một cách chia mỗi lần chạy.\n\n### Bước 6: Tải về và cache model\n\nModel là những file lớn. Thư viện `huggingface_hub` lo việc tải về và cache.\n\n```python\nfrom huggingface_hub import hf_hub_download, snapshot_download\n\nmodel_path = hf_hub_download(\n    repo_id=\"sentence-transformers/all-MiniLM-L6-v2\",\n    filename=\"config.json\"\n)\nprint(f\"Cached at: {model_path}\")\n\nmodel_dir = snapshot_download(\"sentence-transformers/all-MiniLM-L6-v2\")\nprint(f\"Full model at: {model_dir}\")\n```\n\nModel được cache vào `~/.cache/huggingface/hub/`. Một khi đã tải về, những lần chạy sau sẽ load gần như tức thì.\n\n### Bước 7: Xử lý file lớn\n\nTrọng số model và dataset lớn không nên đưa vào git. Có ba lựa chọn:\n\n**Lựa chọn A: .gitignore (đơn giản nhất)**\n\n```\n*.bin\n*.safetensors\n*.pt\n*.onnx\ndata/*.parquet\ndata/*.csv\nmodels/\n```\n\n**Lựa chọn B: Git LFS (theo dõi file lớn trong git)**\n\n```bash\ngit lfs install\ngit lfs track \"*.bin\"\ngit lfs track \"*.safetensors\"\ngit add .gitattributes\n```\n\nGit LFS lưu các con trỏ trong repo của bạn, còn file thật nằm trên một server riêng. GitHub cho bạn 1 GB miễn phí.\n\n**Lựa chọn C: DVC (data version control)**\n\n```bash\npip install dvc\ndvc init\ndvc add data/training_set.parquet\ngit add data/training_set.parquet.dvc data/.gitignore\ngit commit -m \"Track training data with DVC\"\n```\n\nDVC tạo các file `.dvc` nhỏ trỏ tới dữ liệu của bạn. Bản thân dữ liệu nằm trên S3, GCS hoặc một backend lưu trữ từ xa khác.\n\n| Cách tiếp cận | Độ phức tạp | Phù hợp nhất cho |\n|----------|-----------|----------|\n| .gitignore | Thấp | Dự án cá nhân, dữ liệu tải về có thể tải lại |\n| Git LFS | Trung bình | Team chia sẻ trọng số model qua git |\n| DVC | Cao | Thí nghiệm tái lập được, dataset lớn, làm việc nhóm |\n\nTrong khóa học này, `.gitignore` là đủ. Hãy dùng DVC khi bạn cần tái lập chính xác thí nghiệm trên nhiều máy.\n\n### Bước 8: Các mô hình lưu trữ\n\n**Lưu trữ cục bộ** phù hợp với dataset dưới ~10 GB. HF cache tự động lo phần này.\n\n**Lưu trữ cloud** dành cho mọi thứ lớn hơn hoặc cần chia sẻ giữa nhiều máy:\n\n```python\nimport os\n\nlocal_path = os.path.expanduser(\"~/.cache/huggingface/datasets/\")\n\n# s3_path = \"s3://my-bucket/datasets/\"\n# gcs_path = \"gs://my-bucket/datasets/\"\n```\n\nDVC tích hợp trực tiếp với S3 và GCS:\n\n```bash\ndvc remote add -d myremote s3://my-bucket/dvc-store\ndvc push\n```\n\nTrong khóa học này, lưu trữ cục bộ là đủ. Lưu trữ cloud chỉ trở nên cần thiết khi bạn fine-tune trên các instance GPU từ xa.\n\n## Các dataset dùng trong khóa học\n\n| Dataset | Bài học | Dung lượng | Dạy điều gì |\n|---------|---------|------|----------------|\n| IMDB | Tokenization, phân loại | 84 MB | Kiến thức cơ bản về phân loại văn bản |\n| WikiText | Mô hình hóa ngôn ngữ | 181 MB | Dự đoán token tiếp theo |\n| SQuAD | Hệ thống hỏi đáp | 35 MB | Hỏi đáp, span |\n| Common Crawl (tập con) | Embedding | Tùy | Xử lý văn bản quy mô lớn |\n| MNIST | Cơ bản về thị giác máy tính | 21 MB | Nền tảng phân loại ảnh |\n| COCO (tập con) | Đa phương thức | Tùy | Cặp ảnh - văn bản |\n\nBạn không cần tải hết những dataset này ngay bây giờ. Mỗi bài học sẽ ghi rõ nó cần gì.\n\n## Ứng dụng\n\nChạy script tiện ích để kiểm tra mọi thứ hoạt động:\n\n```bash\npython code/data_utils.py\n```\n\nScript này tải về một dataset nhỏ, chuyển đổi định dạng, chia nó ra và in bản tóm tắt.\n\n## Đóng gói & sử dụng\n\nBài học này tạo ra:\n- `code/data_utils.py` - tiện ích load và cache dữ liệu có thể tái sử dụng\n- `outputs/prompt-data-helper.md` - prompt giúp tìm dataset phù hợp cho một tác vụ\n\n## Bài tập\n\n1. Load dataset `glue` với config `mrpc` và xem 5 ví dụ đầu tiên\n2. Stream dataset `c4` và đếm xem bạn xử lý được bao nhiêu ví dụ trong 10 giây\n3. Chuyển một dataset sang Parquet và so sánh dung lượng file với CSV\n4. Tạo phần chia train/val/test theo tỉ lệ 70/15/15 với seed cố định và kiểm tra kích thước các phần\n\n### Gợi ý\n\n**Bài tập 1.** Gọi `load_and_inspect(\"glue\", \"mrpc\")` từ `code/data_utils.py`, hoặc gọi thẳng `load_dataset(\"glue\", \"mrpc\")`, rồi in `ds[\"train\"][:5]`. Mỗi ví dụ phải có các trường `sentence1`, `sentence2` và `label`.\n\n**Bài tập 2.** Load dataset với `streaming=True`, giống như `stream_dataset` làm, rồi đọc các ví dụ trong một vòng lặp dừng lại khi `time.time()` vượt quá thời điểm bắt đầu cộng 10 giây. In ra số đếm; chạy hai lần, vì lần chạy đầu tính cả thời gian khởi tạo kết nối.\n\n**Bài tập 3.** Lưu cùng một dataset bằng `to_csv` và `to_parquet`, giống như `convert_format` làm, rồi so sánh dung lượng bằng `ls -lh` hoặc `os.path.getsize`. Load lại file Parquet bằng `load_from_parquet` và kiểm tra số dòng không thay đổi.\n\n**Bài tập 4.** Dùng `train_test_split` hai lần với `seed` cố định: lần đầu tách ra 30 phần trăm, sau đó chia đôi 30 phần trăm đó. Tổng độ dài ba phần phải bằng độ dài ban đầu, và chạy lần hai với cùng seed phải cho ra cùng dòng đầu tiên ở mỗi phần.\n\n## Thuật ngữ chính\n\n| Thuật ngữ | Người ta hay nói | Ý nghĩa thực sự |\n|------|----------------|----------------------|\n| Dataset split | \"Dữ liệu train\" | Một tập con có tên (train/val/test) dùng ở các giai đoạn khác nhau trong vòng đời ML |\n| Streaming | \"Load kiểu lazy\" | Xử lý dữ liệu theo từng dòng từ một nguồn từ xa mà không tải về toàn bộ dataset |\n| Parquet | \"CSV nén\" | Định dạng file dạng cột, tối ưu cho truy vấn phân tích và hiệu quả lưu trữ |\n| Arrow | \"Dataframe nhanh\" | Định dạng dạng cột trong bộ nhớ, được thư viện datasets dùng bên trong để đọc zero-copy |\n| Git LFS | \"Git cho file lớn\" | Một extension lưu file lớn bên ngoài git repo, trong khi vẫn giữ con trỏ trong hệ thống quản lý phiên bản |\n| DVC | \"Git cho dữ liệu\" | Hệ thống quản lý phiên bản cho dataset và model, tích hợp với lưu trữ cloud |\n| Cache | \"Đã tải rồi\" | Bản sao cục bộ của dữ liệu đã tải trước đó, mặc định lưu tại ~/.cache/huggingface/ |\n", "quiz": {"questions": [{"stage": "pre", "question": "Vì sao cần tách riêng các tập train, validation và test trong machine learning?", "options": ["Để mỗi tập dùng một định dạng file khác nhau", "Để dataset nhỏ hơn, giúp huấn luyện nhanh hơn", "Để phân phối dữ liệu lên nhiều GPU", "Để đánh giá hiệu năng mô hình trên dữ liệu chưa từng thấy và tránh overfitting"], "correct": 3, "explanation": "Tập train dùng để dạy mô hình, tập validation dùng để tinh chỉnh hyperparameter trong lúc huấn luyện, còn tập test cho đánh giá cuối cùng không thiên lệch trên dữ liệu mà mô hình chưa từng thấy."}, {"stage": "pre", "question": "Trong các workflow AI/ML, Hugging Face Hub chủ yếu được dùng để làm gì?", "options": ["Quản lý môi trường ảo Python", "Quản lý version control cho source code giống GitHub", "Chạy các job huấn luyện GPU trên cloud", "Lưu trữ và chia sẻ dataset, mô hình và các artifact ML"], "correct": 3, "explanation": "Hugging Face Hub là nền tảng lưu trữ và chia sẻ mô hình pre-trained, dataset và demo ML. Thư viện 'datasets' cung cấp cách chuẩn để tải dữ liệu từ đó."}, {"stage": "post", "question": "Định dạng Parquet có lợi thế gì so với CSV khi lưu dataset ML?", "options": ["Parquet hỗ trợ nhiều kiểu dữ liệu hơn CSV", "File Parquet đọc được bằng mắt trong mọi trình soạn thảo văn bản", "Parquet lưu trữ theo cột nên file nhỏ hơn và đọc nhanh hơn", "File Parquet có thể chỉnh sửa trong các ứng dụng bảng tính"], "correct": 2, "explanation": "Parquet là định dạng nhị phân lưu theo cột, nén tốt hơn CSV và cho phép đọc nhanh theo từng cột. Đây là định dạng lưu trữ được ưa chuộng cho dataset ML."}, {"stage": "post", "question": "'streaming=True' làm gì khi tải dataset bằng thư viện datasets của Hugging Face?", "options": ["Chuyển dataset sang định dạng video streaming", "Bật cập nhật thời gian thực khi có dữ liệu mới được thêm lên Hub", "Tải dữ liệu từng dòng một mà không cần tải toàn bộ dataset về ổ đĩa", "Tải dataset nhanh hơn bằng nhiều kết nối song song"], "correct": 2, "explanation": "Chế độ streaming tạo một IterableDataset lấy từng dòng khi cần. Mức dùng bộ nhớ giữ nguyên bất kể dataset lớn cỡ nào, điều này rất cần thiết với các dataset quá lớn không vừa ổ đĩa."}, {"stage": "post", "question": "Khi nào bạn nên dùng DVC (Data Version Control) thay vì chỉ dùng .gitignore cho file lớn?", "options": ["Khi bạn cần tái lập chính xác thí nghiệm trên nhiều máy với dữ liệu có quản lý phiên bản", "Khi dự án của bạn chỉ có file CSV", "Khi dataset của bạn nhỏ hơn 1 MB", "Khi bạn làm một mình trong dự án cá nhân"], "correct": 0, "explanation": "DVC theo dõi phiên bản dữ liệu bằng các file con trỏ nhỏ trong git, còn dữ liệu thật được lưu ở remote storage (S3, GCS). Nó đảm bảo bất kỳ ai cũng tái lập được chính xác thí nghiệm của bạn với cùng dữ liệu."}]}, "quiz_lang": "vi", "code": [{"path": "code/data_utils.py", "lang": "python", "content": "import sys\nimport json\nimport hashlib\nfrom pathlib import Path\n\ntry:\n    from datasets import load_dataset, Dataset\nexcept ImportError:\n    print(\"Install the datasets library: pip install datasets\")\n    sys.exit(1)\n\ntry:\n    from huggingface_hub import hf_hub_download\nexcept ImportError:\n    print(\"Install huggingface_hub: pip install huggingface_hub\")\n    sys.exit(1)\n\n\nCACHE_DIR = Path.home() / \".cache\" / \"huggingface\" / \"datasets\"\n\n\ndef load_and_inspect(dataset_name: str, config: str = None, split: str = \"train\"):\n    kwargs = {\"path\": dataset_name}\n    if config:\n        kwargs[\"name\"] = config\n    if split:\n        kwargs[\"split\"] = split\n\n    ds = load_dataset(**kwargs)\n    print(f\"Dataset: {dataset_name}\")\n    print(f\"  Split: {split}\")\n    print(f\"  Rows: {len(ds)}\")\n    print(f\"  Columns: {ds.column_names}\")\n    print(f\"  Features: {ds.features}\")\n    print(f\"  First row: {ds[0]}\")\n    return ds\n\n\ndef stream_dataset(dataset_name: str, config: str = None, max_rows: int = 5):\n    kwargs = {\"path\": dataset_name, \"split\": \"train\", \"streaming\": True}\n    if config:\n        kwargs[\"name\"] = config\n\n    ds = load_dataset(**kwargs)\n    rows = []\n    for i, example in enumerate(ds):\n        rows.append(example)\n        if i >= max_rows - 1:\n            break\n\n    print(f\"Streamed {len(rows)} rows from {dataset_name}\")\n    return rows\n\n\ndef convert_format(ds, output_dir: str, name: str):\n    output_path = Path(output_dir)\n    output_path.mkdir(parents=True, exist_ok=True)\n\n    csv_path = output_path / f\"{name}.csv\"\n    json_path = output_path / f\"{name}.json\"\n    parquet_path = output_path / f\"{name}.parquet\"\n\n    ds.to_csv(str(csv_path))\n    ds.to_json(str(json_path))\n    ds.to_parquet(str(parquet_path))\n\n    csv_size = csv_path.stat().st_size\n    json_size = json_path.stat().st_size\n    parquet_size = parquet_path.stat().st_size\n\n    print(f\"Format comparison for {name}:\")\n    print(f\"  CSV:     {csv_size:>10,} bytes\")\n    print(f\"  JSON:    {json_size:>10,} bytes\")\n    print(f\"  Parquet: {parquet_size:>10,} bytes\")\n    print(f\"  Parquet is {csv_size / parquet_size:.1f}x smaller than CSV\")\n\n    return {\"csv\": csv_path, \"json\": json_path, \"parquet\": parquet_path}\n\n\ndef make_splits(ds, train_ratio: float = 0.8, val_ratio: float = 0.1, seed: int = 42):\n    test_ratio = 1.0 - train_ratio - val_ratio\n    assert test_ratio > 0, \"train_ratio + val_ratio must be less than 1.0\"\n\n    test_size = val_ratio + test_ratio\n    split1 = ds.train_test_split(test_size=test_size, seed=seed)\n    train_ds = split1[\"train\"]\n\n    val_fraction = val_ratio / test_size\n    split2 = split1[\"test\"].train_test_split(test_size=(1.0 - val_fraction), seed=seed)\n    val_ds = split2[\"train\"]\n    test_ds = split2[\"test\"]\n\n    total = len(train_ds) + len(val_ds) + len(test_ds)\n    print(f\"Splits (seed={seed}):\")\n    print(f\"  Train: {len(train_ds):>6} ({len(train_ds)/total:.1%})\")\n    print(f\"  Val:   {len(val_ds):>6} ({len(val_ds)/total:.1%})\")\n    print(f\"  Test:  {len(test_ds):>6} ({len(test_ds)/total:.1%})\")\n\n    return {\"train\": train_ds, \"val\": val_ds, \"test\": test_ds}\n\n\ndef download_model_file(repo_id: str, filename: str):\n    path = hf_hub_download(repo_id=repo_id, filename=filename)\n    size = Path(path).stat().st_size\n    print(f\"Downloaded {filename} from {repo_id}\")\n    print(f\"  Path: {path}\")\n    print(f\"  Size: {size:,} bytes\")\n    return path\n\n\ndef cache_summary():\n    cache_path = CACHE_DIR\n    if not cache_path.exists():\n        print(\"No HF cache found yet.\")\n        return\n\n    total_size = 0\n    file_count = 0\n    for f in cache_path.rglob(\"*\"):\n        if f.is_file():\n            total_size += f.stat().st_size\n            file_count += 1\n\n    print(f\"HF Dataset Cache: {cache_path}\")\n    print(f\"  Files: {file_count}\")\n    print(f\"  Total size: {total_size / (1024 * 1024):.1f} MB\")\n\n\ndef load_from_parquet(path: str):\n    ds = Dataset.from_parquet(path)\n    print(f\"Loaded {len(ds)} rows from {path}\")\n    return ds\n\n\ndef load_from_csv(path: str):\n    ds = Dataset.from_csv(path)\n    print(f\"Loaded {len(ds)} rows from {path}\")\n    return ds\n\n\ndef load_from_json(path: str):\n    ds = Dataset.from_json(path)\n    print(f\"Loaded {len(ds)} rows from {path}\")\n    return ds\n\n\ndef fingerprint(ds, num_rows: int = 100):\n    sample = ds.select(range(min(num_rows, len(ds))))\n    content = json.dumps([row for row in sample], default=str).encode()\n    digest = hashlib.sha256(content).hexdigest()[:16]\n    print(f\"Dataset fingerprint (first {num_rows} rows): {digest}\")\n    return digest\n\n\nif __name__ == \"__main__\":\n    print(\"=\" * 60)\n    print(\"Data Management Utility\")\n    print(\"=\" * 60)\n\n    print(\"\\n--- 1. Load and inspect a dataset ---\")\n    ds = load_and_inspect(\"cornell-movie-review-data/rotten_tomatoes\", split=\"train\")\n\n    print(\"\\n--- 2. Stream a dataset ---\")\n    rows = stream_dataset(\"cornell-movie-review-data/rotten_tomatoes\", max_rows=3)\n    for row in rows:\n        print(f\"  {row['text'][:80]}...\")\n\n    print(\"\\n--- 3. Convert formats ---\")\n    small_ds = ds.select(range(500))\n    paths = convert_format(small_ds, \"/tmp/data_utils_demo\", \"rotten_tomatoes_sample\")\n\n    print(\"\\n--- 4. Create train/val/test splits ---\")\n    splits = make_splits(small_ds, train_ratio=0.8, val_ratio=0.1, seed=42)\n\n    print(\"\\n--- 5. Reload from Parquet ---\")\n    reloaded = load_from_parquet(str(paths[\"parquet\"]))\n    print(f\"  Columns: {reloaded.column_names}\")\n\n    print(\"\\n--- 6. Download a model file ---\")\n    download_model_file(\"sentence-transformers/all-MiniLM-L6-v2\", \"config.json\")\n\n    print(\"\\n--- 7. Dataset fingerprint ---\")\n    fingerprint(ds)\n\n    print(\"\\n--- 8. Cache summary ---\")\n    cache_summary()\n\n    print(\"\\n\" + \"=\" * 60)\n    print(\"All checks passed. Your data pipeline is ready.\")\n    print(\"=\" * 60)\n"}, {"path": "outputs/prompt-data-helper.md", "lang": "markdown", "content": "---\nname: prompt-data-helper\ndescription: Find and load the right dataset for an AI/ML task\nphase: 0\nlesson: 9\n---\n\nYou help people find and load the right dataset for their AI/ML task. When someone describes what they want to build, you recommend specific datasets and show how to load them.\n\nFollow this process:\n\n1. **Clarify the task.** Determine the task type: classification, generation, question answering, summarization, translation, embeddings, image recognition, or multimodal.\n\n2. **Recommend datasets.** For each recommendation, provide:\n   - The Hugging Face dataset ID (e.g., `stanfordnlp/imdb`, `rajpurkar/squad`, `nyu-mll/glue` (config: `mrpc`))\n   - Dataset size and number of examples\n   - What the columns/features contain\n   - Why it fits the task\n\n3. **Show the loading code.** Provide a working Python snippet using the `datasets` library:\n   ```python\n   from datasets import load_dataset\n   ds = load_dataset(\"dataset_name\", split=\"train\")\n   ```\n\n4. **Handle special cases:**\n   - If the dataset is large (>5 GB), show the streaming approach\n   - If it needs a config name, include it: `load_dataset(\"glue\", \"mrpc\")`\n   - If it requires authentication, mention `huggingface-cli login`\n   - If no public dataset exists, suggest how to structure a custom dataset\n\nCommon task-to-dataset mapping:\n\n| Task | Starter Dataset | HF ID |\n|------|----------------|-------|\n| Text classification | Rotten Tomatoes | `cornell-movie-review-data/rotten_tomatoes` |\n| Sentiment analysis | IMDB | `stanfordnlp/imdb` |\n| Natural language inference | MNLI | `nyu-mll/glue` (config:`mnli`) |\n| Question answering | SQuAD | `rajpurkar/squad` |\n| Summarization | CNN/DailyMail | `abisee/cnn_dailymail`(config: `3.0.0`) |\n| Translation | WMT | `wmt/wmt16`(config: `cs-en`) |\n| Language modeling | WikiText | `Salesforce/wikitext` |\n| Token classification | CoNLL-2003 | `lhoestq/conll2003` |\n| Image classification | MNIST / CIFAR-10 | `ylecun/mnist` / `uoft-cs/cifar10` |\n| Object detection | COCO | `detection-datasets/coco` |\n\nWhen recommending, prefer smaller datasets for learning and prototyping. Suggest larger datasets only when the user is ready to train at scale.\n\nAlways verify the dataset exists on the Hugging Face Hub before recommending it. If you are unsure about a dataset ID, say so and suggest searching https://huggingface.co/datasets.\n"}]}, {"id": "10", "slug": "10-terminal-and-shell", "title_en": "Terminal & Shell", "title_vi": "Terminal & Shell", "en": "# Terminal & Shell\n\n> The terminal is where AI engineers live. Get comfortable here.\n\n**Type:** Learn\n**Languages:** --\n**Prerequisites:** Phase 0, Lesson 01\n**Time:** ~35 minutes\n\n## Learning Objectives\n\n- Use piping, redirects, and `grep` to filter and process training logs from the command line\n- Create persistent tmux sessions with multiple panes for concurrent training and GPU monitoring\n- Monitor system and GPU resources with `htop`, `nvtop`, and `nvidia-smi`\n- Transfer files between local and remote machines using SSH, `scp`, and `rsync`\n\n## The Problem\n\nYou will spend more time in the terminal than in any editor. Training runs, GPU monitoring, log tailing, remote SSH sessions, environment management. Every AI workflow touches the shell. If you're slow here, you're slow everywhere.\n\nThis lesson covers the terminal skills that matter for AI work. No history of Unix. No deep-dive into Bash scripting. Just what you need.\n\n## The Concept\n\n```mermaid\ngraph TD\n    subgraph tmux[\"tmux session: training\"]\n        subgraph top[\"Top row\"]\n            P1[\"Pane 1: Training run<br/>python train.py<br/>Epoch 12/100 ...\"]\n            P2[\"Pane 2: GPU monitor<br/>watch -n1 nvidia-smi<br/>GPU: 78% | Mem: 14/24G\"]\n        end\n        P3[\"Pane 3: Logs + experiments<br/>tail -f logs/train.log | grep loss\"]\n    end\n```\n\nThree things running at once. One terminal. You can detach, go home, SSH back in, and reattach. The training keeps running.\n\n```figure\ns0-shell-pipeline\n```\n\n## Build It\n\n### Step 1: Know your shell\n\nCheck which shell you're running:\n\n```bash\necho $SHELL\n```\n\nMost systems use `bash` or `zsh`. Both work fine. The commands in this course work in either.\n\nKey things to know:\n\n```bash\n# Move around\ncd ~/projects/ai-engineering-from-scratch\npwd\nls -la\n\n# History search (most useful shortcut you'll learn)\n# Ctrl+R then type part of a previous command\n# Press Ctrl+R again to cycle through matches\n\n# Clear terminal\nclear   # or Ctrl+L\n\n# Cancel a running command\n# Ctrl+C\n\n# Suspend a running command (resume with fg)\n# Ctrl+Z\n```\n\n### Step 2: Piping and redirects\n\nPiping connects commands together. This is how you process logs, filter output, and chain tools. You will use this constantly.\n\n```bash\n# Count how many times \"loss\" appears in a log\ncat train.log | grep \"loss\" | wc -l\n\n# Extract just the loss values from training output\ngrep \"loss:\" train.log | awk '{print $NF}' > losses.txt\n\n# Watch a log file update in real time, filtering for errors\ntail -f train.log | grep --line-buffered \"ERROR\"\n\n# Sort experiments by final accuracy\ngrep \"final_accuracy\" results/*.log | sort -t= -k2 -n -r\n\n# Redirect stdout and stderr to separate files\npython train.py > output.log 2> errors.log\n\n# Redirect both to the same file\npython train.py > train_full.log 2>&1\n```\n\nThe four redirects and the pipe you need:\n\n| Symbol | What it does |\n|--------|-------------|\n| `>` | Write stdout to file (overwrite) |\n| `>>` | Append stdout to file |\n| `2>` | Write stderr to file |\n| `2>&1` | Send stderr to same place as stdout |\n| `\\|` | Send stdout of one command as stdin to the next |\n\n### Step 3: Background processes\n\nTraining runs take hours. You don't want to keep your terminal open the whole time.\n\n```bash\n# Run in background (output still goes to terminal)\npython train.py &\n\n# Run in background, immune to hangup (closing terminal won't kill it)\nnohup python train.py > train.log 2>&1 &\n\n# Check what's running in background\njobs\nps aux | grep train.py\n\n# Bring a background job to foreground\nfg %1\n\n# Kill a background process\nkill %1\n# or find its PID and kill that\nkill $(pgrep -f \"train.py\")\n```\n\nThe difference between `&`, `nohup`, and `screen`/`tmux`:\n\n| Method | Survives terminal close? | Can reattach? |\n|--------|-------------------------|---------------|\n| `command &` | No | No |\n| `nohup command &` | Yes | No (check log file) |\n| `screen` / `tmux` | Yes | Yes |\n\nFor anything longer than a few minutes, use tmux.\n\n### Step 4: tmux\n\ntmux lets you create persistent terminal sessions with multiple panes. This is the single most useful tool for managing training runs.\n\n```bash\n# Install\n# macOS\nbrew install tmux\n# Ubuntu\nsudo apt install tmux\n\n# Start a named session\ntmux new -s training\n\n# Split horizontally\n# Ctrl+B then \"\n\n# Split vertically\n# Ctrl+B then %\n\n# Navigate between panes\n# Ctrl+B then arrow keys\n\n# Detach (session keeps running)\n# Ctrl+B then d\n\n# Reattach\ntmux attach -t training\n\n# List sessions\ntmux ls\n\n# Kill a session\ntmux kill-session -t training\n```\n\nA typical AI workflow session:\n\n```bash\ntmux new -s train\n\n# Pane 1: start training\npython train.py --epochs 100 --lr 1e-4\n\n# Ctrl+B, \" to split, then run GPU monitor\nwatch -n1 nvidia-smi\n\n# Ctrl+B, % to split vertically, tail the logs\ntail -f logs/experiment.log\n\n# Now detach with Ctrl+B, d\n# SSH out, go get coffee, come back\n# tmux attach -t train\n```\n\n### Step 5: Monitoring with htop and nvtop\n\n```bash\n# System processes (better than top)\nhtop\n\n# GPU processes (if you have NVIDIA GPU)\n# Install: sudo apt install nvtop (Ubuntu) or brew install nvtop (macOS)\nnvtop\n\n# Quick GPU check without nvtop\nnvidia-smi\n\n# Watch GPU usage update every second\nwatch -n1 nvidia-smi\n\n# See which processes are using the GPU\nnvidia-smi --query-compute-apps=pid,name,used_memory --format=csv\n```\n\n`htop` keybindings you'll use:\n- `F6` or `>` to sort by column (sort by memory to find memory leaks)\n- `F5` to toggle tree view (see child processes)\n- `F9` to kill a process\n- `/` to search for a process name\n\n### Step 6: SSH for remote GPU boxes\n\nWhen you rent a cloud GPU (Lambda, RunPod, Vast.ai), you connect via SSH.\n\n```bash\n# Basic connection\nssh user@gpu-box-ip\n\n# With a specific key\nssh -i ~/.ssh/my_gpu_key user@gpu-box-ip\n\n# Copy files to remote\nscp model.pt user@gpu-box-ip:~/models/\n\n# Copy files from remote\nscp user@gpu-box-ip:~/results/metrics.json ./\n\n# Sync a whole directory (faster for many files)\nrsync -avz ./data/ user@gpu-box-ip:~/data/\n\n# Port forward (access remote Jupyter/TensorBoard locally)\nssh -L 8888:localhost:8888 user@gpu-box-ip\n# Now open localhost:8888 in your browser\n\n# SSH config for convenience\n# Add to ~/.ssh/config:\n# Host gpu\n#     HostName 192.168.1.100\n#     User ubuntu\n#     IdentityFile ~/.ssh/gpu_key\n#\n# Then just:\n# ssh gpu\n```\n\n### Step 7: Useful aliases for AI work\n\nAdd these to your `~/.bashrc` or `~/.zshrc`:\n\n```bash\nsource phases/00-setup-and-tooling/10-terminal-and-shell/code/shell_aliases.sh\n```\n\nOr copy the ones you want. The key aliases:\n\n```bash\n# GPU status at a glance\nalias gpu='nvidia-smi --query-gpu=index,name,utilization.gpu,memory.used,memory.total,temperature.gpu --format=csv,noheader'\n\n# Kill all Python training processes\nalias killtraining='pkill -f \"python.*train\"'\n\n# Quick virtual environment activate\nalias ae='source .venv/bin/activate'\n\n# Watch training loss\nalias watchloss='tail -f logs/*.log | grep --line-buffered \"loss\"'\n```\n\nSee `code/shell_aliases.sh` for the full set.\n\n### Step 8: Common AI terminal patterns\n\nThese come up repeatedly in practice:\n\n```bash\n# Run training, log everything, notify when done\npython train.py 2>&1 | tee train.log; echo \"DONE\" | mail -s \"Training complete\" you@email.com\n\n# Compare two experiment logs side by side\ndiff <(grep \"accuracy\" exp1.log) <(grep \"accuracy\" exp2.log)\n\n# Find the largest model files (clean up disk space)\nfind . -name \"*.pt\" -o -name \"*.safetensors\" | xargs du -h | sort -rh | head -20\n\n# Download a model from Hugging Face\nwget https://huggingface.co/model/resolve/main/model.safetensors\n\n# Untar a dataset\ntar xzf dataset.tar.gz -C ./data/\n\n# Count lines in all Python files (see how big your project is)\nfind . -name \"*.py\" | xargs wc -l | tail -1\n\n# Check disk space (training data fills disks fast)\ndf -h\ndu -sh ./data/*\n\n# Environment variable check before training\nenv | grep -i cuda\nenv | grep -i torch\n```\n\n## Use It\n\nHere's when each tool comes into play during this course:\n\n| Tool | When you use it |\n|------|----------------|\n| tmux | Every training run (Phases 3+) |\n| `tail -f` + `grep` | Monitoring training logs |\n| `nohup` / `&` | Quick background tasks |\n| `htop` / `nvtop` | Debugging slow training, OOM errors |\n| SSH + `rsync` | Working on cloud GPUs |\n| Piping + redirects | Processing experiment results |\n| Aliases | Saving time on repetitive commands |\n\n## Exercises\n\n1. Install tmux, create a session with three panes, and run `htop` in one, `watch -n1 date` in another, and a Python script in the third. Detach and reattach.\n2. Add the aliases from `code/shell_aliases.sh` to your shell config and reload with `source ~/.zshrc` (or `~/.bashrc`).\n3. Create a fake training log with `for i in $(seq 1 100); do echo \"epoch $i loss: $(echo \"scale=4; 1/$i\" | bc)\"; sleep 0.1; done > fake_train.log` and then use `grep`, `tail`, and `awk` to extract just the loss values.\n4. Set up an SSH config entry for a server you have access to (or use `localhost` to practice the syntax).\n\n### Hints\n\n**Exercise 1.** Start with `tmux new -s practice`, then split with the prefix `Ctrl+B` followed by `\"` and `%`, and move between panes with `Ctrl+B` and an arrow key. Detach with `Ctrl+B` then `d`, run `tmux ls`, and attach again with `tmux attach -t practice`; all three programs must still run.\n\n**Exercise 2.** Copy the lines from `code/shell_aliases.sh` to the end of `~/.zshrc` or `~/.bashrc`, then run `source` on that file. Run `alias` or `type <name>` for one of the new aliases to confirm that the shell knows it.\n\n**Exercise 3.** First run `tail -5 fake_train.log` to see the line format. Then filter with `grep loss` and print only the last field with `awk '{print $NF}'`; the output must be 100 numbers that get smaller.\n\n**Exercise 4.** Copy the `Host gpu` block from the lesson into `~/.ssh/config` and change `HostName` and `User` to your server, or to `localhost` and your user name. Run `ssh -G gpu` to print the settings that SSH will use. If you have a reachable SSH server that accepts your key, run `ssh gpu` to connect.\n\n## Key Terms\n\n| Term | What people say | What it actually means |\n|------|----------------|----------------------|\n| Shell | \"The terminal\" | The program that interprets your commands (bash, zsh, fish) |\n| tmux | \"Terminal multiplexer\" | A program that lets you run multiple terminal sessions inside one window, and detach/reattach |\n| Pipe | \"The bar thing\" | The `\\|` operator that sends one command's output as input to another |\n| PID | \"Process ID\" | A unique number assigned to every running process, used to monitor or kill it |\n| nohup | \"No hangup\" | Runs a command immune to the hangup signal, so closing the terminal won't kill it |\n| SSH | \"Connecting to the server\" | Secure Shell, an encrypted protocol for running commands on a remote machine |\n", "vi": "# Terminal & Shell\n\n> Terminal là nơi các AI engineer \"sống\". Hãy làm quen với nó.\n\n**Type:** Learn\n**Languages:** --\n**Prerequisites:** Phase 0, Lesson 01\n**Time:** ~35 minutes\n\n## Mục tiêu bài học\n\n- Dùng pipe, redirect và `grep` để lọc và xử lý log training ngay trên command line\n- Tạo các session tmux bền vững với nhiều pane để vừa chạy training vừa theo dõi GPU\n- Theo dõi tài nguyên hệ thống và GPU bằng `htop`, `nvtop` và `nvidia-smi`\n- Chuyển file giữa máy local và máy từ xa bằng SSH, `scp` và `rsync`\n\n## Vấn đề\n\nBạn sẽ dành nhiều thời gian trong terminal hơn bất kỳ editor nào. Chạy training, theo dõi GPU, xem log, SSH vào máy từ xa, quản lý môi trường. Mọi quy trình làm việc AI đều đụng tới shell. Nếu bạn chậm ở đây, bạn sẽ chậm ở mọi nơi.\n\nBài học này đề cập đến những kỹ năng terminal thực sự quan trọng cho công việc AI. Không kể lịch sử Unix. Không đào sâu vào Bash scripting. Chỉ những gì bạn cần.\n\n## Khái niệm\n\n```mermaid\ngraph TD\n    subgraph tmux[\"tmux session: training\"]\n        subgraph top[\"Top row\"]\n            P1[\"Pane 1: Training run<br/>python train.py<br/>Epoch 12/100 ...\"]\n            P2[\"Pane 2: GPU monitor<br/>watch -n1 nvidia-smi<br/>GPU: 78% | Mem: 14/24G\"]\n        end\n        P3[\"Pane 3: Logs + experiments<br/>tail -f logs/train.log | grep loss\"]\n    end\n```\n\nBa thứ chạy cùng lúc. Một terminal. Bạn có thể detach, đi về nhà, SSH vào lại rồi reattach. Training vẫn tiếp tục chạy.\n\n```figure\ns0-shell-pipeline\n```\n\n## Tự xây dựng\n\n### Bước 1: Biết shell của bạn\n\nKiểm tra xem bạn đang chạy shell nào:\n\n```bash\necho $SHELL\n```\n\nPhần lớn hệ thống dùng `bash` hoặc `zsh`. Cả hai đều ổn. Các lệnh trong khóa học này chạy được trên cả hai.\n\nNhững điều quan trọng cần biết:\n\n```bash\n# Move around\ncd ~/projects/ai-engineering-from-scratch\npwd\nls -la\n\n# History search (most useful shortcut you'll learn)\n# Ctrl+R then type part of a previous command\n# Press Ctrl+R again to cycle through matches\n\n# Clear terminal\nclear   # or Ctrl+L\n\n# Cancel a running command\n# Ctrl+C\n\n# Suspend a running command (resume with fg)\n# Ctrl+Z\n```\n\n### Bước 2: Pipe và redirect\n\nPipe nối các lệnh lại với nhau. Đây là cách bạn xử lý log, lọc output và xâu chuỗi các công cụ. Bạn sẽ dùng nó liên tục.\n\n```bash\n# Count how many times \"loss\" appears in a log\ncat train.log | grep \"loss\" | wc -l\n\n# Extract just the loss values from training output\ngrep \"loss:\" train.log | awk '{print $NF}' > losses.txt\n\n# Watch a log file update in real time, filtering for errors\ntail -f train.log | grep --line-buffered \"ERROR\"\n\n# Sort experiments by final accuracy\ngrep \"final_accuracy\" results/*.log | sort -t= -k2 -n -r\n\n# Redirect stdout and stderr to separate files\npython train.py > output.log 2> errors.log\n\n# Redirect both to the same file\npython train.py > train_full.log 2>&1\n```\n\nBốn redirect và pipe mà bạn cần:\n\n| Ký hiệu | Tác dụng |\n|--------|-------------|\n| `>` | Ghi stdout ra file (ghi đè) |\n| `>>` | Nối thêm stdout vào cuối file |\n| `2>` | Ghi stderr ra file |\n| `2>&1` | Gửi stderr tới cùng chỗ với stdout |\n| `\\|` | Gửi stdout của một lệnh làm stdin cho lệnh tiếp theo |\n\n### Bước 3: Tiến trình chạy nền\n\nCác lần chạy training kéo dài hàng giờ. Bạn không muốn phải mở terminal suốt thời gian đó.\n\n```bash\n# Run in background (output still goes to terminal)\npython train.py &\n\n# Run in background, immune to hangup (closing terminal won't kill it)\nnohup python train.py > train.log 2>&1 &\n\n# Check what's running in background\njobs\nps aux | grep train.py\n\n# Bring a background job to foreground\nfg %1\n\n# Kill a background process\nkill %1\n# or find its PID and kill that\nkill $(pgrep -f \"train.py\")\n```\n\nSự khác nhau giữa `&`, `nohup` và `screen`/`tmux`:\n\n| Cách | Còn sống khi đóng terminal? | Reattach được không? |\n|--------|-------------------------|---------------|\n| `command &` | Không | Không |\n| `nohup command &` | Có | Không (xem file log) |\n| `screen` / `tmux` | Có | Có |\n\nVới bất cứ việc gì kéo dài hơn vài phút, hãy dùng tmux.\n\n### Bước 4: tmux\n\ntmux cho phép bạn tạo các session terminal bền vững với nhiều pane. Đây là công cụ hữu ích nhất để quản lý các lần chạy training.\n\n```bash\n# Install\n# macOS\nbrew install tmux\n# Ubuntu\nsudo apt install tmux\n\n# Start a named session\ntmux new -s training\n\n# Split horizontally\n# Ctrl+B then \"\n\n# Split vertically\n# Ctrl+B then %\n\n# Navigate between panes\n# Ctrl+B then arrow keys\n\n# Detach (session keeps running)\n# Ctrl+B then d\n\n# Reattach\ntmux attach -t training\n\n# List sessions\ntmux ls\n\n# Kill a session\ntmux kill-session -t training\n```\n\nMột session làm việc AI điển hình:\n\n```bash\ntmux new -s train\n\n# Pane 1: start training\npython train.py --epochs 100 --lr 1e-4\n\n# Ctrl+B, \" to split, then run GPU monitor\nwatch -n1 nvidia-smi\n\n# Ctrl+B, % to split vertically, tail the logs\ntail -f logs/experiment.log\n\n# Now detach with Ctrl+B, d\n# SSH out, go get coffee, come back\n# tmux attach -t train\n```\n\n### Bước 5: Theo dõi bằng htop và nvtop\n\n```bash\n# System processes (better than top)\nhtop\n\n# GPU processes (if you have NVIDIA GPU)\n# Install: sudo apt install nvtop (Ubuntu) or brew install nvtop (macOS)\nnvtop\n\n# Quick GPU check without nvtop\nnvidia-smi\n\n# Watch GPU usage update every second\nwatch -n1 nvidia-smi\n\n# See which processes are using the GPU\nnvidia-smi --query-compute-apps=pid,name,used_memory --format=csv\n```\n\nCác phím tắt `htop` bạn sẽ dùng:\n- `F6` hoặc `>` để sắp xếp theo cột (sắp theo bộ nhớ để tìm memory leak)\n- `F5` để bật/tắt chế độ xem dạng cây (thấy các tiến trình con)\n- `F9` để kill một tiến trình\n- `/` để tìm theo tên tiến trình\n\n### Bước 6: SSH vào các máy GPU từ xa\n\nKhi thuê GPU trên cloud (Lambda, RunPod, Vast.ai), bạn kết nối qua SSH.\n\n```bash\n# Basic connection\nssh user@gpu-box-ip\n\n# With a specific key\nssh -i ~/.ssh/my_gpu_key user@gpu-box-ip\n\n# Copy files to remote\nscp model.pt user@gpu-box-ip:~/models/\n\n# Copy files from remote\nscp user@gpu-box-ip:~/results/metrics.json ./\n\n# Sync a whole directory (faster for many files)\nrsync -avz ./data/ user@gpu-box-ip:~/data/\n\n# Port forward (access remote Jupyter/TensorBoard locally)\nssh -L 8888:localhost:8888 user@gpu-box-ip\n# Now open localhost:8888 in your browser\n\n# SSH config for convenience\n# Add to ~/.ssh/config:\n# Host gpu\n#     HostName 192.168.1.100\n#     User ubuntu\n#     IdentityFile ~/.ssh/gpu_key\n#\n# Then just:\n# ssh gpu\n```\n\n### Bước 7: Các alias hữu ích cho công việc AI\n\nThêm những dòng này vào `~/.bashrc` hoặc `~/.zshrc`:\n\n```bash\nsource phases/00-setup-and-tooling/10-terminal-and-shell/code/shell_aliases.sh\n```\n\nHoặc chỉ copy những alias bạn muốn. Các alias chính:\n\n```bash\n# GPU status at a glance\nalias gpu='nvidia-smi --query-gpu=index,name,utilization.gpu,memory.used,memory.total,temperature.gpu --format=csv,noheader'\n\n# Kill all Python training processes\nalias killtraining='pkill -f \"python.*train\"'\n\n# Quick virtual environment activate\nalias ae='source .venv/bin/activate'\n\n# Watch training loss\nalias watchloss='tail -f logs/*.log | grep --line-buffered \"loss\"'\n```\n\nXem `code/shell_aliases.sh` để có bộ đầy đủ.\n\n### Bước 8: Các mẫu dùng terminal phổ biến trong AI\n\nNhững mẫu này lặp đi lặp lại trong thực tế:\n\n```bash\n# Run training, log everything, notify when done\npython train.py 2>&1 | tee train.log; echo \"DONE\" | mail -s \"Training complete\" you@email.com\n\n# Compare two experiment logs side by side\ndiff <(grep \"accuracy\" exp1.log) <(grep \"accuracy\" exp2.log)\n\n# Find the largest model files (clean up disk space)\nfind . -name \"*.pt\" -o -name \"*.safetensors\" | xargs du -h | sort -rh | head -20\n\n# Download a model from Hugging Face\nwget https://huggingface.co/model/resolve/main/model.safetensors\n\n# Untar a dataset\ntar xzf dataset.tar.gz -C ./data/\n\n# Count lines in all Python files (see how big your project is)\nfind . -name \"*.py\" | xargs wc -l | tail -1\n\n# Check disk space (training data fills disks fast)\ndf -h\ndu -sh ./data/*\n\n# Environment variable check before training\nenv | grep -i cuda\nenv | grep -i torch\n```\n\n## Ứng dụng\n\nĐây là lúc mỗi công cụ được dùng đến trong khóa học này:\n\n| Công cụ | Khi nào dùng |\n|------|----------------|\n| tmux | Mọi lần chạy training (Phase 3 trở đi) |\n| `tail -f` + `grep` | Theo dõi log training |\n| `nohup` / `&` | Các tác vụ chạy nền nhanh |\n| `htop` / `nvtop` | Debug training chậm, lỗi OOM |\n| SSH + `rsync` | Làm việc trên GPU cloud |\n| Pipe + redirect | Xử lý kết quả thí nghiệm |\n| Alias | Tiết kiệm thời gian với các lệnh lặp lại |\n\n## Bài tập\n\n1. Cài tmux, tạo một session với ba pane, chạy `htop` ở một pane, `watch -n1 date` ở pane khác, và một script Python ở pane thứ ba. Detach rồi reattach.\n2. Thêm các alias trong `code/shell_aliases.sh` vào file cấu hình shell của bạn rồi reload bằng `source ~/.zshrc` (hoặc `~/.bashrc`).\n3. Tạo một log training giả bằng `for i in $(seq 1 100); do echo \"epoch $i loss: $(echo \"scale=4; 1/$i\" | bc)\"; sleep 0.1; done > fake_train.log`, sau đó dùng `grep`, `tail` và `awk` để trích xuất riêng các giá trị loss.\n4. Thiết lập một mục cấu hình SSH cho một server bạn có quyền truy cập (hoặc dùng `localhost` để tập cú pháp).\n\n### Gợi ý\n\n**Bài tập 1.** Bắt đầu với `tmux new -s practice`, rồi chia pane bằng prefix `Ctrl+B` theo sau là `\"` và `%`, di chuyển giữa các pane bằng `Ctrl+B` và một phím mũi tên. Detach bằng `Ctrl+B` rồi `d`, chạy `tmux ls`, và attach lại bằng `tmux attach -t practice`; cả ba chương trình phải vẫn đang chạy.\n\n**Bài tập 2.** Copy các dòng trong `code/shell_aliases.sh` vào cuối `~/.zshrc` hoặc `~/.bashrc`, rồi chạy `source` trên file đó. Chạy `alias` hoặc `type <name>` cho một trong các alias mới để xác nhận shell đã nhận nó.\n\n**Bài tập 3.** Trước tiên chạy `tail -5 fake_train.log` để xem định dạng dòng. Sau đó lọc bằng `grep loss` và chỉ in trường cuối cùng bằng `awk '{print $NF}'`; output phải là 100 con số giảm dần.\n\n**Bài tập 4.** Copy khối `Host gpu` trong bài vào `~/.ssh/config` và đổi `HostName` và `User` thành server của bạn, hoặc thành `localhost` và tên user của bạn. Chạy `ssh -G gpu` để in ra các thiết lập mà SSH sẽ dùng. Nếu bạn có một SSH server truy cập được và chấp nhận key của bạn, chạy `ssh gpu` để kết nối.\n\n## Thuật ngữ chính\n\n| Thuật ngữ | Người ta hay nói | Ý nghĩa thực sự |\n|------|----------------|----------------------|\n| Shell | \"Cái terminal\" | Chương trình thông dịch các lệnh của bạn (bash, zsh, fish) |\n| tmux | \"Terminal multiplexer\" | Chương trình cho phép chạy nhiều session terminal trong một cửa sổ, và detach/reattach được |\n| Pipe | \"Cái dấu gạch đứng\" | Toán tử `\\|` gửi output của một lệnh làm input cho lệnh khác |\n| PID | \"Process ID\" | Số định danh duy nhất gán cho mỗi tiến trình đang chạy, dùng để theo dõi hoặc kill nó |\n| nohup | \"No hangup\" | Chạy một lệnh miễn nhiễm với tín hiệu hangup, nên đóng terminal cũng không kill nó |\n| SSH | \"Kết nối vào server\" | Secure Shell, một giao thức mã hóa để chạy lệnh trên
