g | grep --line-buffered \"ERROR\\|error\\|Exception\"'\n\ntaillog() {\n    local pattern=\"${1:-loss}\"\n    tail -f logs/*.log 2>/dev/null | grep --line-buffered \"$pattern\"\n}\n\n# --- Disk space (training data fills disks fast) ---\n\nalias diskuse='df -h .'\nalias bigfiles='find . -type f -size +100M | xargs du -h 2>/dev/null | sort -rh | head -20'\nalias bigmodels='find . \\( -name \"*.pt\" -o -name \"*.pth\" -o -name \"*.safetensors\" -o -name \"*.ckpt\" -o -name \"*.bin\" \\) | xargs du -h 2>/dev/null | sort -rh | head -20'\n\n# --- Quick environment checks ---\n\nalias checkgpu='python -c \"import torch; print(f\\\"CUDA: {torch.cuda.is_available()}\\\"); print(f\\\"Device: {torch.cuda.get_device_name(0)}\\\") if torch.cuda.is_available() else None\"'\nalias checkcuda='env | grep -i cuda'\nalias checkenv='python --version && pip --version && python -c \"import torch; print(f\\\"PyTorch {torch.__version__}, CUDA {torch.cuda.is_available()}\\\")\" 2>/dev/null'\n\n# --- tmux shortcuts ---\n\nalias ta='tmux attach -t'\nalias tls='tmux ls'\nalias tn='tmux new -s'\nalias tk='tmux kill-session -t'\n\ntrainenv() {\n    local name=\"${1:-train}\"\n    tmux new-session -d -s \"$name\"\n    tmux split-window -h -t \"$name\"\n    tmux split-window -v -t \"$name\"\n    tmux send-keys -t \"$name:0.1\" 'watch -n1 nvidia-smi' C-m\n    tmux send-keys -t \"$name:0.2\" 'htop' C-m\n    tmux select-pane -t \"$name:0.0\"\n    tmux attach -t \"$name\"\n}\n\n# --- SSH helpers ---\n\nsyncto() {\n    if [ -z \"$1\" ] || [ -z \"$2\" ]; then\n        echo \"Usage: syncto <host> <remote_path> [local_path]\"\n        echo \"Example: syncto gpu ~/data ./data\"\n        return 1\n    fi\n    local host=\"$1\"\n    local remote=\"$2\"\n    local local_path=\"${3:-.}\"\n    rsync -avz --progress \"$local_path\" \"${host}:${remote}\"\n}\n\nsyncfrom() {\n    if [ -z \"$1\" ] || [ -z \"$2\" ]; then\n        echo \"Usage: syncfrom <host> <remote_path> [local_path]\"\n        echo \"Example: syncfrom gpu ~/results ./results\"\n        return 1\n    fi\n    local host=\"$1\"\n    local remote=\"$2\"\n    local local_path=\"${3:-.}\"\n    rsync -avz --progress \"${host}:${remote}\" \"$local_path\"\n}\n\n# --- Experiment management ---\n\nnewexp() {\n    local name=\"${1:-experiment}\"\n    local dir=\"experiments/${name}_$(date +%Y%m%d_%H%M%S)\"\n    mkdir -p \"$dir/logs\" \"$dir/checkpoints\" \"$dir/configs\"\n    echo \"Created experiment directory: $dir\"\n    echo \"$dir\"\n}\n\nlastexp() {\n    ls -dt experiments/*/ 2>/dev/null | head -1\n}\n\n# --- Model download helpers ---\n\nhfdownload() {\n    if [ -z \"$1\" ]; then\n        echo \"Usage: hfdownload <model_id> [filename]\"\n        echo \"Example: hfdownload meta-llama/Llama-2-7b config.json\"\n        return 1\n    fi\n    local model=\"$1\"\n    local file=\"${2:-}\"\n    if [ -n \"$file\" ]; then\n        wget \"https://huggingface.co/${model}/resolve/main/${file}\"\n    else\n        echo \"Cloning full repo (use git-lfs)...\"\n        git lfs install\n        git clone \"https://huggingface.co/${model}\"\n    fi\n}\n\n# --- Process management ---\n\nmemhogs() {\n    ps aux --sort=-%mem 2>/dev/null | head -11 || ps aux -m | head -11\n}\n\npsg() {\n    ps aux | grep -v grep | grep -i \"$1\"\n}\n"}]}, {"id": "11", "slug": "11-linux-for-ai", "title_en": "Linux for AI", "title_vi": "Linux cho AI", "en": "# Linux for AI\n\n> Most AI runs on Linux. You need to know enough to not be stuck.\n\n**Type:** Learn\n**Languages:** --\n**Prerequisites:** Phase 0, Lesson 01\n**Time:** ~30 minutes\n\n## Learning Objectives\n\n- Navigate the Linux file system and perform essential file operations from the command line\n- Manage file permissions with `chmod` and `chown` to resolve \"Permission denied\" errors\n- Install system packages with `apt` and set up a fresh GPU box for AI work\n- Identify macOS-to-Linux differences that commonly trip up developers working on remote machines\n\n## The Problem\n\nYou develop on macOS or Windows. But the moment you SSH into a cloud GPU box, rent a Lambda instance, or spin up an EC2 machine, you land in Ubuntu. The terminal is your only interface. There is no Finder, no Explorer, no GUI. If you can't navigate the file system, install packages, and manage processes from the command line, you're stuck paying for idle GPU hours while googling \"how to unzip a file in Linux.\"\n\nThis is a survival guide. It covers exactly what you need to operate on a remote Linux machine for AI work. Nothing more.\n\n## File System Layout\n\nLinux organizes everything under a single root `/`. There is no `C:\\` or `/Volumes`. The directories you'll actually touch:\n\n```mermaid\ngraph TD\n    root[\"/\"] --> home[\"home/your-username/<br/>Your files — clone repos, run training\"]\n    root --> tmp[\"tmp/<br/>Temporary files, cleared on reboot\"]\n    root --> usr[\"usr/<br/>System programs and libraries\"]\n    root --> etc[\"etc/<br/>Config files\"]\n    root --> varlog[\"var/log/<br/>Logs — check when something breaks\"]\n    root --> mnt[\"mnt/ or /media/<br/>External drives and volumes\"]\n    root --> proc[\"proc/ and /sys/<br/>Virtual files — kernel and hardware info\"]\n```\n\nYour home directory is `~` or `/home/your-username`. Almost everything you do happens here.\n\n## Essential Commands\n\nThese are the 13 commands that cover most of what you'll do on a remote GPU box.\n\n### Moving Around\n\n```bash\npwd                         # Where am I?\nls                          # What's here?\nls -la                      # What's here, including hidden files with details?\ncd /path/to/dir             # Go there\ncd ~                        # Go home\ncd ..                       # Go up one level\n```\n\n### Files and Directories\n\n```bash\nmkdir my-project            # Create a directory\nmkdir -p a/b/c              # Create nested directories in one shot\n\ncp file.txt backup.txt      # Copy a file\ncp -r src/ src-backup/      # Copy a directory (recursive)\n\nmv old.txt new.txt          # Rename a file\nmv file.txt /tmp/           # Move a file\n\nrm file.txt                 # Delete a file (no trash, it's gone)\nrm -rf my-dir/              # Delete a directory and everything inside\n```\n\n`rm -rf` is permanent. There is no undo. Double-check the path before hitting enter.\n\n### Reading Files\n\n```bash\ncat file.txt                # Print entire file\nhead -20 file.txt           # First 20 lines\ntail -20 file.txt           # Last 20 lines\ntail -f log.txt             # Follow a log file in real time (Ctrl+C to stop)\nless file.txt               # Scroll through a file (q to quit)\n```\n\n### Searching\n\n```bash\ngrep \"error\" training.log           # Find lines containing \"error\"\ngrep -r \"learning_rate\" .           # Search all files in current directory\ngrep -i \"cuda\" config.yaml          # Case-insensitive search\n\nfind . -name \"*.py\"                 # Find all Python files under current dir\nfind . -name \"*.ckpt\" -size +1G     # Find checkpoint files larger than 1GB\n```\n\n## Permissions\n\nEvery file in Linux has an owner and permission bits. You'll run into this when scripts won't execute or you can't write to a directory.\n\n```bash\nls -l train.py\n# -rwxr-xr-- 1 user group 2048 Mar 19 10:00 train.py\n#  ^^^             owner permissions: read, write, execute\n#     ^^^          group permissions: read, execute\n#        ^^        everyone else: read only\n```\n\nCommon fixes:\n\n```bash\nchmod +x train.sh           # Make a script executable\nchmod 755 deploy.sh         # Owner: full, others: read+execute\nchmod 644 config.yaml       # Owner: read+write, others: read only\n\nchown user:group file.txt   # Change who owns a file (needs sudo)\n```\n\nWhen something says \"Permission denied,\" it's almost always a permissions issue. `chmod +x` or `sudo` will fix most cases.\n\n## Package Management (apt)\n\nUbuntu uses `apt`. This is how you install system-level software.\n\n```bash\nsudo apt update             # Refresh the package list (always do this first)\nsudo apt install -y htop    # Install a package (-y skips confirmation)\nsudo apt install -y build-essential  # C compiler, make, etc. Needed by many Python packages\nsudo apt install -y tmux    # Terminal multiplexer (keep sessions alive after disconnect)\n\napt list --installed        # What's installed?\nsudo apt remove htop        # Uninstall\n```\n\nCommon packages you'll install on a fresh GPU box:\n\n```bash\nsudo apt update && sudo apt install -y \\\n    build-essential \\\n    git \\\n    curl \\\n    wget \\\n    tmux \\\n    htop \\\n    unzip \\\n    python3-venv\n```\n\n## Users and sudo\n\nYou're usually logged in as a regular user. Some operations need root (admin) access.\n\n```bash\nwhoami                      # What user am I?\nsudo command                # Run a single command as root\nsudo su                     # Become root (exit to go back, use sparingly)\n```\n\nOn cloud GPU instances, you're typically the only user and already have sudo access. Don't run everything as root. Use sudo only when needed.\n\n## Processes and systemd\n\nWhen your training hangs, or you need to check what's running:\n\n```bash\nhtop                        # Interactive process viewer (q to quit)\nps aux | grep python        # Find running Python processes\nkill 12345                  # Gracefully stop process with PID 12345\nkill -9 12345               # Force kill (use when graceful doesn't work)\nnvidia-smi                  # GPU processes and memory usage\n```\n\nsystemd manages services (background daemons). You'll use it if you run inference servers:\n\n```bash\nsudo systemctl start nginx          # Start a service\nsudo systemctl stop nginx           # Stop it\nsudo systemctl restart nginx        # Restart it\nsudo systemctl status nginx         # Check if it's running\nsudo systemctl enable nginx         # Start automatically on boot\n```\n\n## Disk Space\n\nGPU boxes often have limited disk space. Models and datasets fill it fast.\n\n```bash\ndf -h                       # Disk usage for all mounted drives\ndf -h /home                 # Disk usage for /home specifically\n\ndu -sh *                    # Size of each item in current directory\ndu -sh ~/.cache             # Size of your cache (pip, huggingface models land here)\ndu -sh /data/checkpoints/   # Check how big your checkpoints are\n\n# Find the biggest space hogs\ndu -h --max-depth=1 / 2>/dev/null | sort -hr | head -20\n```\n\nCommon space savers:\n\n```bash\n# Clear pip cache\npip cache purge\n\n# Clear apt cache\nsudo apt clean\n\n# Remove old checkpoints you don't need\nrm -rf checkpoints/epoch_01/ checkpoints/epoch_02/\n```\n\n## Networking\n\nYou'll download models, transfer files, and hit APIs from the command line.\n\n```bash\n# Download files\nwget https://example.com/model.bin                   # Download a file\ncurl -O https://example.com/data.tar.gz              # Same thing with curl\ncurl -s https://api.example.com/health | python3 -m json.tool  # Hit an API, pretty-print JSON\n\n# Transfer files between machines\nscp model.bin user@remote:/data/                     # Copy file to remote machine\nscp user@remote:/data/results.csv .                  # Copy file from remote to local\nscp -r user@remote:/data/checkpoints/ ./local-dir/   # Copy directory\n\n# Sync directories (faster than scp for large transfers, resumes on failure)\nrsync -avz --progress ./data/ user@remote:/data/\nrsync -avz --progress user@remote:/results/ ./results/\n```\n\nUse `rsync` over `scp` for anything large. It only transfers changed bytes and handles interrupted connections.\n\n## tmux: Keep Sessions Alive\n\nWhen you SSH into a remote box, closing your laptop kills your training run. tmux prevents this.\n\n```bash\ntmux new -s train           # Start a new session named \"train\"\n# ... start your training, then:\n# Ctrl+B, then D            # Detach (training keeps running)\n\ntmux ls                     # List sessions\ntmux attach -t train        # Reattach to session\n\n# Inside tmux:\n# Ctrl+B, then %            # Split pane vertically\n# Ctrl+B, then \"            # Split pane horizontally\n# Ctrl+B, then arrow keys   # Switch between panes\n```\n\nAlways run long training jobs inside tmux. Always.\n\n## WSL2 for Windows Users\n\nIf you're on Windows, WSL2 gives you a real Linux environment without dual-booting.\n\n```bash\n# In PowerShell (admin)\nwsl --install -d Ubuntu-24.04\n\n# After restart, open Ubuntu from Start menu\nsudo apt update && sudo apt upgrade -y\n```\n\nWSL2 runs a real Linux kernel. Everything in this lesson works inside it. Your Windows files are at `/mnt/c/Users/YourName/` from inside WSL.\n\nGPU passthrough works with NVIDIA drivers installed on the Windows side. Install the Windows NVIDIA driver (not the Linux one), and CUDA will be available inside WSL2.\n\n## Gotchas: macOS to Linux\n\nThings that will trip you up if you're coming from macOS:\n\n| macOS | Linux | Notes |\n|-------|-------|-------|\n| `brew install` | `sudo apt install` | Different package names sometimes. `brew install htop` vs `sudo apt install htop` works the same, but `brew install readline` vs `sudo apt install libreadline-dev` does not. |\n| `open file.txt` | `xdg-open file.txt` | But you won't have a GUI on a remote box. Use `cat` or `less`. |\n| `pbcopy` / `pbpaste` | Not available | Pipe to/from clipboard doesn't exist over SSH. |\n| `~/.zshrc` | `~/.bashrc` | macOS defaults to zsh. Most Linux servers use bash. |\n| `/opt/homebrew/` | `/usr/bin/`, `/usr/local/bin/` | Binaries live in different places. |\n| `sed -i '' 's/a/b/' file` | `sed -i 's/a/b/' file` | macOS sed needs an empty string after `-i`. Linux does not. |\n| Case-insensitive filesystem | Case-sensitive filesystem | `Model.py` and `model.py` are two different files on Linux. |\n| Line endings `\\n` | Line endings `\\n` | Same. But Windows uses `\\r\\n`, which breaks bash scripts. Run `dos2unix` to fix. |\n\n## Quick Reference Card\n\n```\nNavigation:     pwd, ls, cd, find\nFiles:          cp, mv, rm, mkdir, cat, head, tail, less\nSearch:         grep, find\nPermissions:    chmod, chown, sudo\nPackages:       apt update, apt install\nProcesses:      htop, ps, kill, nvidia-smi\nServices:       systemctl start/stop/restart/status\nDisk:           df -h, du -sh\nNetwork:        curl, wget, scp, rsync\nSessions:       tmux new/attach/detach\n```\n\n```figure\ns0-process-fork\n```\n\n## Exercises\n\n1. SSH into any Linux machine (or open WSL2) and navigate to your home directory. Create a project folder, create three empty files inside it with `touch`, then list them with `ls -la`.\n2. Install `htop` with apt, run it, and identify which process is using the most memory.\n3. Start a tmux session, run `sleep 300` inside it, detach, list sessions, and reattach.\n4. Use `df -h` to check available disk space, then use `du -sh ~/.cache/*` to find what's taking up space in your cache.\n5. Transfer a file from your local machine to a remote one using `scp`, then do the same transfer with `rsync` and compare the experience.\n\n### Hints\n\n**Exercise 1.** Use `cd ~`, `mkdir`, and `cd` into the new folder, then run `touch` with three file names. In the `ls -la` output, check that the three files show a size of 0 and your user name as owner.\n\n**Exercise 2.** Install with `sudo apt install -y htop`, start it, and press `F6` (or click the column name) to sort by `MEM%`. The process at the top of the list uses the most memory.\n\n**Exercise 3.** Use `tmux new -s train` from the lesson, run `sleep 300`, and detach with `Ctrl+B` then `d`. Run `tmux ls` to see the session, then `tmux attach -t train`; the `sleep` must still run.\n\n**Exercise 4.** Run `df -h` and read the `Avail` column for the file system that holds your home folder. Then run `du -sh ~/.cache/* | sort -h` so that the largest folder is on the last line.\n\n**Exercise 5.** Copy a file with `scp file.txt user@host:~/`, then run `rsync -avP file.txt user@host:~/` for the same file. Run the `rsync` command a second time: it sends almost nothing, because the file on the remote side did not change.\n", "vi": "# Linux cho AI\n\n> Phần lớn AI chạy trên Linux. Bạn cần biết đủ để không bị kẹt.\n\n**Type:** Learn\n**Languages:** --\n**Prerequisites:** Phase 0, Lesson 01\n**Time:** ~30 minutes\n\n## Mục tiêu bài học\n\n- Di chuyển trong hệ thống file Linux và thực hiện các thao tác file thiết yếu từ command line\n- Quản lý quyền file bằng `chmod` và `chown` để xử lý lỗi \"Permission denied\"\n- Cài package hệ thống bằng `apt` và thiết lập một máy GPU mới tinh cho công việc AI\n- Nhận ra những khác biệt giữa macOS và Linux hay làm khó các developer khi làm việc trên máy từ xa\n\n## Vấn đề\n\nBạn phát triển trên macOS hoặc Windows. Nhưng ngay khi SSH vào một máy GPU trên cloud, thuê một instance Lambda hay dựng một máy EC2, bạn sẽ đáp xuống Ubuntu. Terminal là giao diện duy nhất. Không có Finder, không có Explorer, không có GUI. Nếu bạn không biết di chuyển trong hệ thống file, cài package và quản lý tiến trình từ command line, bạn sẽ mắc kẹt trả tiền cho những giờ GPU ngồi không trong lúc google \"how to unzip a file in Linux\".\n\nĐây là cẩm nang sinh tồn. Nó đề cập đúng những gì bạn cần để làm việc trên một máy Linux từ xa cho công việc AI. Không hơn.\n\n## Cấu trúc hệ thống file\n\nLinux tổ chức mọi thứ dưới một gốc duy nhất `/`. Không có `C:\\` hay `/Volumes`. Những thư mục bạn thực sự sẽ đụng tới:\n\n```mermaid\ngraph TD\n    root[\"/\"] --> home[\"home/your-username/<br/>Your files — clone repos, run training\"]\n    root --> tmp[\"tmp/<br/>Temporary files, cleared on reboot\"]\n    root --> usr[\"usr/<br/>System programs and libraries\"]\n    root --> etc[\"etc/<br/>Config files\"]\n    root --> varlog[\"var/log/<br/>Logs — check when something breaks\"]\n    root --> mnt[\"mnt/ or /media/<br/>External drives and volumes\"]\n    root --> proc[\"proc/ and /sys/<br/>Virtual files — kernel and hardware info\"]\n```\n\nThư mục home của bạn là `~` hoặc `/home/your-username`. Gần như mọi thứ bạn làm đều diễn ra ở đây.\n\n## Các lệnh thiết yếu\n\nĐây là 13 lệnh bao quát phần lớn những gì bạn sẽ làm trên một máy GPU từ xa.\n\n### Di chuyển\n\n```bash\npwd                         # Where am I?\nls                          # What's here?\nls -la                      # What's here, including hidden files with details?\ncd /path/to/dir             # Go there\ncd ~                        # Go home\ncd ..                       # Go up one level\n```\n\n### File và thư mục\n\n```bash\nmkdir my-project            # Create a directory\nmkdir -p a/b/c              # Create nested directories in one shot\n\ncp file.txt backup.txt      # Copy a file\ncp -r src/ src-backup/      # Copy a directory (recursive)\n\nmv old.txt new.txt          # Rename a file\nmv file.txt /tmp/           # Move a file\n\nrm file.txt                 # Delete a file (no trash, it's gone)\nrm -rf my-dir/              # Delete a directory and everything inside\n```\n\n`rm -rf` là xóa vĩnh viễn. Không có undo. Hãy kiểm tra kỹ đường dẫn trước khi nhấn enter.\n\n### Đọc file\n\n```bash\ncat file.txt                # Print entire file\nhead -20 file.txt           # First 20 lines\ntail -20 file.txt           # Last 20 lines\ntail -f log.txt             # Follow a log file in real time (Ctrl+C to stop)\nless file.txt               # Scroll through a file (q to quit)\n```\n\n### Tìm kiếm\n\n```bash\ngrep \"error\" training.log           # Find lines containing \"error\"\ngrep -r \"learning_rate\" .           # Search all files in current directory\ngrep -i \"cuda\" config.yaml          # Case-insensitive search\n\nfind . -name \"*.py\"                 # Find all Python files under current dir\nfind . -name \"*.ckpt\" -size +1G     # Find checkpoint files larger than 1GB\n```\n\n## Quyền\n\nMọi file trong Linux đều có chủ sở hữu (owner) và các bit quyền. Bạn sẽ gặp chuyện này khi script không chạy được hoặc bạn không ghi được vào một thư mục.\n\n```bash\nls -l train.py\n# -rwxr-xr-- 1 user group 2048 Mar 19 10:00 train.py\n#  ^^^             owner permissions: read, write, execute\n#     ^^^          group permissions: read, execute\n#        ^^        everyone else: read only\n```\n\nCác cách sửa thường gặp:\n\n```bash\nchmod +x train.sh           # Make a script executable\nchmod 755 deploy.sh         # Owner: full, others: read+execute\nchmod 644 config.yaml       # Owner: read+write, others: read only\n\nchown user:group file.txt   # Change who owns a file (needs sudo)\n```\n\nKhi gặp thông báo \"Permission denied\", gần như chắc chắn đó là vấn đề về quyền. `chmod +x` hoặc `sudo` sẽ giải quyết được phần lớn trường hợp.\n\n## Quản lý package (apt)\n\nUbuntu dùng `apt`. Đây là cách bạn cài phần mềm ở cấp hệ thống.\n\n```bash\nsudo apt update             # Refresh the package list (always do this first)\nsudo apt install -y htop    # Install a package (-y skips confirmation)\nsudo apt install -y build-essential  # C compiler, make, etc. Needed by many Python packages\nsudo apt install -y tmux    # Terminal multiplexer (keep sessions alive after disconnect)\n\napt list --installed        # What's installed?\nsudo apt remove htop        # Uninstall\n```\n\nCác package thường cài trên một máy GPU mới:\n\n```bash\nsudo apt update && sudo apt install -y \\\n    build-essential \\\n    git \\\n    curl \\\n    wget \\\n    tmux \\\n    htop \\\n    unzip \\\n    python3-venv\n```\n\n## User và sudo\n\nThông thường bạn đăng nhập bằng một user thường. Một số thao tác cần quyền root (admin).\n\n```bash\nwhoami                      # What user am I?\nsudo command                # Run a single command as root\nsudo su                     # Become root (exit to go back, use sparingly)\n```\n\nTrên các instance GPU cloud, bạn thường là user duy nhất và đã có sẵn quyền sudo. Đừng chạy mọi thứ bằng root. Chỉ dùng sudo khi cần.\n\n## Tiến trình và systemd\n\nKhi training bị treo, hoặc bạn cần kiểm tra cái gì đang chạy:\n\n```bash\nhtop                        # Interactive process viewer (q to quit)\nps aux | grep python        # Find running Python processes\nkill 12345                  # Gracefully stop process with PID 12345\nkill -9 12345               # Force kill (use when graceful doesn't work)\nnvidia-smi                  # GPU processes and memory usage\n```\n\nsystemd quản lý các service (daemon chạy nền). Bạn sẽ dùng nó nếu chạy các server inference:\n\n```bash\nsudo systemctl start nginx          # Start a service\nsudo systemctl stop nginx           # Stop it\nsudo systemctl restart nginx        # Restart it\nsudo systemctl status nginx         # Check if it's running\nsudo systemctl enable nginx         # Start automatically on boot\n```\n\n## Dung lượng ổ đĩa\n\nMáy GPU thường có dung lượng ổ đĩa hạn chế. Model và dataset lấp đầy nó rất nhanh.\n\n```bash\ndf -h                       # Disk usage for all mounted drives\ndf -h /home                 # Disk usage for /home specifically\n\ndu -sh *                    # Size of each item in current directory\ndu -sh ~/.cache             # Size of your cache (pip, huggingface models land here)\ndu -sh /data/checkpoints/   # Check how big your checkpoints are\n\n# Find the biggest space hogs\ndu -h --max-depth=1 / 2>/dev/null | sort -hr | head -20\n```\n\nCác cách giải phóng dung lượng thường dùng:\n\n```bash\n# Clear pip cache\npip cache purge\n\n# Clear apt cache\nsudo apt clean\n\n# Remove old checkpoints you don't need\nrm -rf checkpoints/epoch_01/ checkpoints/epoch_02/\n```\n\n## Mạng\n\nBạn sẽ tải model, chuyển file và gọi API ngay từ command line.\n\n```bash\n# Download files\nwget https://example.com/model.bin                   # Download a file\ncurl -O https://example.com/data.tar.gz              # Same thing with curl\ncurl -s https://api.example.com/health | python3 -m json.tool  # Hit an API, pretty-print JSON\n\n# Transfer files between machines\nscp model.bin user@remote:/data/                     # Copy file to remote machine\nscp user@remote:/data/results.csv .                  # Copy file from remote to local\nscp -r user@remote:/data/checkpoints/ ./local-dir/   # Copy directory\n\n# Sync directories (faster than scp for large transfers, resumes on failure)\nrsync -avz --progress ./data/ user@remote:/data/\nrsync -avz --progress user@remote:/results/ ./results/\n```\n\nDùng `rsync` thay cho `scp` với bất cứ thứ gì lớn. Nó chỉ truyền những byte đã thay đổi và xử lý được khi kết nối bị gián đoạn.\n\n## tmux: Giữ cho session luôn sống\n\nKhi SSH vào một máy từ xa, gập laptop lại là lần chạy training của bạn bị kill. tmux ngăn chuyện này.\n\n```bash\ntmux new -s train           # Start a new session named \"train\"\n# ... start your training, then:\n# Ctrl+B, then D            # Detach (training keeps running)\n\ntmux ls                     # List sessions\ntmux attach -t train        # Reattach to session\n\n# Inside tmux:\n# Ctrl+B, then %            # Split pane vertically\n# Ctrl+B, then \"            # Split pane horizontally\n# Ctrl+B, then arrow keys   # Switch between panes\n```\n\nLuôn chạy các job training dài bên trong tmux. Luôn luôn.\n\n## WSL2 cho người dùng Windows\n\nNếu bạn dùng Windows, WSL2 cho bạn một môi trường Linux thật mà không cần dual-boot.\n\n```bash\n# In PowerShell (admin)\nwsl --install -d Ubuntu-24.04\n\n# After restart, open Ubuntu from Start menu\nsudo apt update && sudo apt upgrade -y\n```\n\nWSL2 chạy một Linux kernel thật. Mọi thứ trong bài này đều chạy được bên trong nó. Các file Windows của bạn nằm ở `/mnt/c/Users/YourName/` khi nhìn từ bên trong WSL.\n\nGPU passthrough hoạt động khi đã cài driver NVIDIA phía Windows. Hãy cài driver NVIDIA cho Windows (không phải bản cho Linux), và CUDA sẽ dùng được bên trong WSL2.\n\n## Những cái bẫy: từ macOS sang Linux\n\nNhững thứ sẽ làm bạn vấp nếu bạn chuyển từ macOS sang:\n\n| macOS | Linux | Ghi chú |\n|-------|-------|-------|\n| `brew install` | `sudo apt install` | Đôi khi tên package khác nhau. `brew install htop` so với `sudo apt install htop` thì giống nhau, nhưng `brew install readline` so với `sudo apt install libreadline-dev` thì không. |\n| `open file.txt` | `xdg-open file.txt` | Nhưng trên máy từ xa bạn sẽ không có GUI. Hãy dùng `cat` hoặc `less`. |\n| `pbcopy` / `pbpaste` | Không có | Pipe vào/ra clipboard không tồn tại qua SSH. |\n| `~/.zshrc` | `~/.bashrc` | macOS mặc định dùng zsh. Phần lớn server Linux dùng bash. |\n| `/opt/homebrew/` | `/usr/bin/`, `/usr/local/bin/` | Các file binary nằm ở những chỗ khác nhau. |\n| `sed -i '' 's/a/b/' file` | `sed -i 's/a/b/' file` | sed trên macOS cần một chuỗi rỗng sau `-i`. Linux thì không. |\n| Hệ thống file không phân biệt hoa thường | Hệ thống file phân biệt hoa thường | `Model.py` và `model.py` là hai file khác nhau trên Linux. |\n| Ký tự xuống dòng `\\n` | Ký tự xuống dòng `\\n` | Giống nhau. Nhưng Windows dùng `\\r\\n`, thứ làm hỏng các script bash. Chạy `dos2unix` để sửa. |\n\n## Bảng tra cứu nhanh\n\n```\nNavigation:     pwd, ls, cd, find\nFiles:          cp, mv, rm, mkdir, cat, head, tail, less\nSearch:         grep, find\nPermissions:    chmod, chown, sudo\nPackages:       apt update, apt install\nProcesses:      htop, ps, kill, nvidia-smi\nServices:       systemctl start/stop/restart/status\nDisk:           df -h, du -sh\nNetwork:        curl, wget, scp, rsync\nSessions:       tmux new/attach/detach\n```\n\n```figure\ns0-process-fork\n```\n\n## Bài tập\n\n1. SSH vào một máy Linux bất kỳ (hoặc mở WSL2) và di chuyển tới thư mục home. Tạo một thư mục project, tạo ba file rỗng bên trong bằng `touch`, rồi liệt kê chúng bằng `ls -la`.\n2. Cài `htop` bằng apt, chạy nó, và xác định tiến trình nào đang dùng nhiều bộ nhớ nhất.\n3. Mở một session tmux, chạy `sleep 300` bên trong, detach, liệt kê các session, rồi reattach.\n4. Dùng `df -h` để kiểm tra dung lượng ổ đĩa còn trống, rồi dùng `du -sh ~/.cache/*` để tìm xem cái gì đang chiếm chỗ trong cache.\n5. Chuyển một file từ máy local sang máy từ xa bằng `scp`, rồi làm lại đúng việc đó bằng `rsync` và so sánh trải nghiệm.\n\n### Gợi ý\n\n**Bài tập 1.** Dùng `cd ~`, `mkdir`, rồi `cd` vào thư mục mới, sau đó chạy `touch` với ba tên file. Trong output của `ls -la`, kiểm tra ba file có kích thước 0 và chủ sở hữu là user của bạn.\n\n**Bài tập 2.** Cài bằng `sudo apt install -y htop`, khởi động nó, rồi nhấn `F6` (hoặc click vào tên cột) để sắp xếp theo `MEM%`. Tiến trình ở đầu danh sách là tiến trình dùng nhiều bộ nhớ nhất.\n\n**Bài tập 3.** Dùng `tmux new -s train` như trong bài, chạy `sleep 300`, rồi detach bằng `Ctrl+B` rồi `d`. Chạy `tmux ls` để thấy session, sau đó `tmux attach -t train`; lệnh `sleep` phải vẫn đang chạy.\n\n**Bài tập 4.** Chạy `df -h` và đọc cột `Avail` của hệ thống file chứa thư mục home. Sau đó chạy `du -sh ~/.cache/* | sort -h` để thư mục lớn nhất nằm ở dòng cuối.\n\n**Bài tập 5.** Copy một file bằng `scp file.txt user@host:~/`, rồi chạy `rsync -avP file.txt user@host:~/` cho cùng file đó. Chạy lệnh `rsync` lần thứ hai: nó gần như không gửi gì, vì file ở phía máy từ xa không thay đổi.\n", "quiz": {"questions": [{"stage": "pre", "question": "Ký hiệu '~' đại diện cho gì trong đường dẫn file trên Linux?", "options": ["Thư mục gốc của hệ thống file", "Thư mục chứa file tạm", "Thư mục home của người dùng hiện tại", "Thư mục cài đặt các chương trình hệ thống"], "correct": 2, "explanation": "Dấu ngã (~) là cách viết tắt cho thư mục home của người dùng hiện tại, thường là /home/username trên Linux. 'cd ~' đưa bạn về home từ bất kỳ đâu."}, {"stage": "pre", "question": "'sudo' đặt trước một lệnh dùng để làm gì?", "options": ["Chạy lệnh với quyền root (quản trị viên)", "Chạy lệnh trong một môi trường sandbox", "Tăng tốc độ thực thi lệnh", "Ghi output của lệnh vào một file hệ thống"], "correct": 0, "explanation": "sudo (superuser do) tạm thời nâng quyền của bạn lên mức root cho một lệnh duy nhất. Cần dùng cho các thao tác cấp hệ thống như cài package bằng apt."}, {"stage": "post", "question": "Bạn gặp lỗi 'Permission denied' khi chạy một shell script. Lệnh nào sửa được lỗi này?", "options": ["chown root script.sh", "mv script.sh /usr/bin/", "chmod +x script.sh", "sudo rm script.sh"], "correct": 2, "explanation": "chmod +x thêm quyền thực thi cho file. Nếu chưa bật bit thực thi, shell sẽ từ chối chạy script ngay cả khi bạn là chủ sở hữu file."}, {"stage": "post", "question": "Trên một máy GPU từ xa, dữ liệu huấn luyện làm đầy ổ đĩa. Lệnh nào cho thấy các thư mục chiếm nhiều dung lượng nhất?", "options": ["ls -la /", "cat /proc/meminfo", "du -h --max-depth=1 / | sort -hr | head -20", "free -h"], "correct": 2, "explanation": "du -h hiển thị dung lượng đã dùng theo từng thư mục, --max-depth=1 giới hạn ở các thư mục cấp cao nhất, và sort -hr sắp xếp theo kích thước giảm dần. Nhờ đó bạn thấy thư mục nào đang chiếm nhiều dung lượng nhất."}, {"stage": "post", "question": "Khác biệt quan trọng giữa 'sed -i' trên macOS và trên Linux là gì?", "options": ["sed trên Linux nhanh hơn sed trên macOS", "sed trên Linux không hỗ trợ regular expression", "sed trên macOS không sửa file tại chỗ được", "sed trên macOS yêu cầu một tham số chuỗi rỗng sau -i ('sed -i \"\"'), còn Linux thì không"], "correct": 3, "explanation": "macOS dùng BSD sed, yêu cầu 'sed -i \"\" pattern file', còn Linux dùng GNU sed, chấp nhận 'sed -i pattern file'. Đây là lỗi hay gặp khi chuyển script giữa các hệ thống."}]}, "quiz_lang": "vi", "code": []}, {"id": "12", "slug": "12-debugging-and-profiling", "title_en": "Debugging and Profiling", "title_vi": "Debug và Profiling", "en": "# Debugging and Profiling\n\n> The worst AI bugs don't crash. They train silently on garbage and report a beautiful loss curve.\n\n**Type:** Build\n**Language:** Python\n**Prerequisites:** Lesson 1 (Dev Environment), basic PyTorch familiarity\n**Time:** ~60 minutes\n\n## Learning Objectives\n\n- Use conditional `breakpoint()` and `debug_print` to inspect tensor shapes, dtypes, and NaN values mid-training\n- Profile training loops with `cProfile`, `line_profiler`, and `tracemalloc` to find bottlenecks\n- Detect common AI bugs: shape mismatches, NaN loss, data leakage, and wrong-device tensors\n- Set up TensorBoard to visualize loss curves, weight histograms, and gradient distributions\n\n## The Problem\n\nAI code fails differently than regular code. A web app crashes with a stack trace. A misconfigured training loop runs for 8 hours, burns $200 in GPU time, and produces a model that predicts the mean of every input. The code never errored. The bug was a tensor on the wrong device, a forgotten `.detach()`, or labels leaking into features.\n\nYou need debugging tools that catch these silent failures before they waste your time and compute.\n\n## The Concept\n\nAI debugging operates at three levels:\n\n```mermaid\ngraph TD\n    L3[\"3. Training Dynamics<br/>Loss curves, gradient norms, activations\"] --> L2\n    L2[\"2. Tensor Operations<br/>Shapes, dtypes, devices, NaN/Inf values\"] --> L1\n    L1[\"1. Standard Python<br/>Breakpoints, logging, profiling, memory\"]\n```\n\nMost people jump straight to level 3 (staring at TensorBoard). But 80% of AI bugs live at levels 1 and 2.\n\n```figure\ns0-flame-hot\n```\n\n## Build It\n\n### Part 1: Print Debugging (Yes, It Works)\n\nPrint debugging gets dismissed. It shouldn't. For tensor code, a targeted print statement beats stepping through a debugger because you need to see shapes, dtypes, and value ranges all at once.\n\n```python\ndef debug_print(name, tensor):\n    print(f\"{name}: shape={tensor.shape}, dtype={tensor.dtype}, \"\n          f\"device={tensor.device}, \"\n          f\"min={tensor.min().item():.4f}, max={tensor.max().item():.4f}, \"\n          f\"mean={tensor.mean().item():.4f}, \"\n          f\"has_nan={tensor.isnan().any().item()}\")\n```\n\nCall this after every suspicious operation. When the bug is found, remove the prints. Simple.\n\n### Part 2: Python Debugger (pdb and breakpoint)\n\nThe built-in debugger is underrated for AI work. Drop `breakpoint()` into your training loop and inspect tensors interactively.\n\n```python\ndef training_step(model, batch, criterion, optimizer):\n    inputs, labels = batch\n    outputs = model(inputs)\n    loss = criterion(outputs, labels)\n\n    if loss.item() > 100 or torch.isnan(loss):\n        breakpoint()\n\n    loss.backward()\n    optimizer.step()\n```\n\nWhen the debugger drops you in, useful commands:\n\n- `p outputs.shape` to check shapes\n- `p loss.item()` to see the loss value\n- `p torch.isnan(outputs).sum()` to count NaNs\n- `p model.fc1.weight.grad` to check gradients\n- `c` to continue, `q` to quit\n\nThis is conditional debugging. You only stop when something looks wrong. For a 10,000-step training run, that matters.\n\n### Part 3: Python Logging\n\nReplace print statements with logging when your debugging goes beyond a quick check.\n\n```python\nimport logging\n\nlogging.basicConfig(\n    level=logging.INFO,\n    format=\"%(asctime)s [%(levelname)s] %(message)s\",\n    handlers=[\n        logging.FileHandler(\"training.log\"),\n        logging.StreamHandler()\n    ]\n)\nlogger = logging.getLogger(__name__)\n\nlogger.info(\"Starting training: lr=%.4f, batch_size=%d\", lr, batch_size)\nlogger.warning(\"Loss spike detected: %.4f at step %d\", loss.item(), step)\nlogger.error(\"NaN loss at step %d, stopping\", step)\n```\n\nLogging gives you timestamps, severity levels, and file output. When a training run fails at 3 AM, you want a log file, not terminal output that scrolled off screen.\n\n### Part 4: Timing Code Sections\n\nKnowing where time goes is the first step to optimization.\n\n```python\nimport time\n\nclass Timer:\n    def __init__(self, name=\"\"):\n        self.name = name\n\n    def __enter__(self):\n        self.start = time.perf_counter()\n        return self\n\n    def __exit__(self, *args):\n        elapsed = time.perf_counter() - self.start\n        print(f\"[{self.name}] {elapsed:.4f}s\")\n\nwith Timer(\"data loading\"):\n    batch = next(dataloader_iter)\n\nwith Timer(\"forward pass\"):\n    outputs = model(batch)\n\nwith Timer(\"backward pass\"):\n    loss.backward()\n```\n\nCommon finding: data loading takes 60% of training time. The fix is `num_workers > 0` in your DataLoader, not a faster GPU.\n\n### Part 5: cProfile and line_profiler\n\nWhen you need more than manual timers:\n\n```bash\npython -m cProfile -s cumtime train.py\n```\n\nThis shows every function call sorted by cumulative time. For line-by-line profiling:\n\n```bash\npip install line_profiler\n```\n\n```python\n@profile\ndef train_step(model, data, target):\n    output = model(data)\n    loss = F.cross_entropy(output, target)\n    loss.backward()\n    return loss\n\n# Run with: kernprof -l -v train.py\n```\n\n### Part 6: Memory Profiling\n\n#### CPU Memory with tracemalloc\n\n```python\nimport tracemalloc\n\ntracemalloc.start()\n\n# your code here\nmodel = build_model()\ndata = load_dataset()\n\nsnapshot = tracemalloc.take_snapshot()\ntop_stats = snapshot.statistics(\"lineno\")\nfor stat in top_stats[:10]:\n    print(stat)\n```\n\n#### CPU Memory with memory_profiler\n\n```bash\npip install memory_profiler\n```\n\n```python\nfrom memory_profiler import profile\n\n@profile\ndef load_data():\n    raw = read_csv(\"data.csv\")       # watch memory jump here\n    processed = preprocess(raw)       # and here\n    return processed\n```\n\nRun with `python -m memory_profiler your_script.py` to see line-by-line memory usage.\n\n#### GPU Memory with PyTorch\n\n```python\nimport torch\n\nif torch.cuda.is_available():\n    print(torch.cuda.memory_summary())\n\n    print(f\"Allocated: {torch.cuda.memory_allocated() / 1e9:.2f} GB\")\n    print(f\"Cached: {torch.cuda.memory_reserved() / 1e9:.2f} GB\")\n```\n\nWhen you hit OOM (Out of Memory):\n\n1. Reduce batch size (first thing to try, always)\n2. Use `torch.cuda.empty_cache()` to free cached memory\n3. Use `del tensor` followed by `torch.cuda.empty_cache()` for large intermediates\n4. Use mixed precision (`torch.cuda.amp`) to halve memory usage\n5. Use gradient checkpointing for very deep models\n\n### Part 7: Common AI Bugs and How to Catch Them\n\n#### Shape Mismatch\n\nThe most frequent bug. A tensor has shape `[batch, features]` when the model expects `[batch, channels, height, width]`.\n\n```python\ndef check_shapes(model, sample_input):\n    print(f\"Input: {sample_input.shape}\")\n    hooks = []\n\n    def make_hook(name):\n        def hook(module, inp, out):\n            in_shape = inp[0].shape if isinstance(inp, tuple) else inp.shape\n            out_shape = out.shape if hasattr(out, \"shape\") else type(out)\n            print(f\"  {name}: {in_shape} -> {out_shape}\")\n        return hook\n\n    for name, module in model.named_modules():\n        hooks.append(module.register_forward_hook(make_hook(name)))\n\n    with torch.no_grad():\n        model(sample_input)\n\n    for h in hooks:\n        h.remove()\n```\n\nRun this once with a sample batch. It maps every shape transformation in your model.\n\n#### NaN Loss\n\nNaN loss means something exploded. Common causes:\n\n- Learning rate too high\n- Division by zero in custom loss\n- Log of zero or negative number\n- Exploding gradients in RNNs\n\n```python\ndef detect_nan(model, loss, step):\n    if torch.isnan(loss):\n        print(f\"NaN loss at step {step}\")\n        for name, param in model.named_parameters():\n            if param.grad is not None:\n                if torch.isnan(param.grad).any():\n                    print(f\"  NaN gradient in {name}\")\n                if torch.isinf(param.grad).any():\n                    print(f\"  Inf gradient in {name}\")\n        return True\n    return False\n```\n\n#### Data Leakage\n\nYour model gets 99% accuracy on the test set. Sounds great. It's a bug.\n\n```python\ndef check_data_leakage(train_set, test_set, id_column=\"id\"):\n    train_ids = set(train_set[id_column].tolist())\n    test_ids = set(test_set[id_column].tolist())\n    overlap = train_ids & test_ids\n    if overlap:\n        print(f\"DATA LEAKAGE: {len(overlap)} samples in both train and test\")\n        return True\n    return False\n```\n\nAlso check for temporal leakage: using future data to predict the past. Sort by timestamp before splitting.\n\n#### Wrong Device\n\nTensors on different devices (CPU vs GPU) cause runtime errors. But sometimes a tensor silently stays on CPU while everything else is on GPU, and training just runs slowly.\n\n```python\ndef check_devices(model, *tensors):\n    model_device = next(model.parameters()).device\n    print(f\"Model device: {model_device}\")\n    for i, t in enumerate(tensors):\n        if t.device != model_device:\n            print(f\"  WARNING: tensor {i} on {t.device}, model on {model_device}\")\n```\n\n### Part 8: TensorBoard Basics\n\nTensorBoard shows you what's happening inside training over time.\n\n```bash\npip install tensorboard\n```\n\n```python\nfrom torch.utils.tensorboard import SummaryWriter\n\nwriter = SummaryWriter(\"runs/experiment_1\")\n\nfor step in range(num_steps):\n    loss = train_step(model, batch)\n\n    writer.add_scalar(\"loss/train\", loss.item(), step)\n    writer.add_scalar(\"lr\", optimizer.param_groups[0][\"lr\"], step)\n\n    if step % 100 == 0:\n        for name, param in model.named_parameters():\n            writer.add_histogram(f\"weights/{name}\", param, step)\n            if param.grad is not None:\n                writer.add_histogram(f\"grads/{name}\", param.grad, step)\n\nwriter.close()\n```\n\nLaunch it:\n\n```bash\ntensorboard --logdir=runs\n```\n\nWhat to look for:\n\n- **Loss not decreasing**: Learning rate too low, or model architecture issue\n- **Loss oscillating wildly**: Learning rate too high\n- **Loss goes to NaN**: Numerical instability (see NaN section above)\n- **Train loss decreasing, val loss increasing**: Overfitting\n- **Weight histograms collapsing to zero**: Vanishing gradients\n- **Gradient histograms exploding**: Need gradient clipping\n\n### Part 9: VS Code Debugger\n\nFor interactive debugging, configure VS Code with a `launch.json`:\n\n```json\n{\n    \"version\": \"0.2.0\",\n    \"configurations\": [\n        {\n            \"name\": \"Debug Training\",\n            \"type\": \"debugpy\",\n            \"request\": \"launch\",\n            \"program\": \"${file}\",\n            \"console\": \"integratedTerminal\",\n            \"justMyCode\": false\n        }\n    ]\n}\n```\n\nSet breakpoints by clicking the gutter. Use the Variables pane to inspect tensor properties. The Debug Console lets you run arbitrary Python expressions mid-execution.\n\nUseful for stepping through data preprocessing pipelines where you want to see each transformation.\n\n## Use It\n\nHere's the debugging workflow that catches most AI bugs:\n\n1. **Before training**: Run `check_shapes` with a sample batch. Verify input and output dimensions match expectations.\n2. **First 10 steps**: Use `debug_print` on loss, outputs, and gradients. Confirm nothing is NaN and values are in reasonable ranges.\n3. **During training**: Log loss, learning rate, and gradient norms. Use TensorBoard for visualization.\n4. **When something breaks**: Drop `breakpoint()` at the failure point. Inspect tensors interactively.\n5. **For performance**: Time your data loading vs forward vs backward pass. Profile memory if you're near OOM.\n\n## Ship It\n\nRun the debugging toolkit script:\n\n```bash\npython phases/00-setup-and-tooling/12-debugging-and-profiling/code/debug_tools.py\n```\n\nSee `outputs/prompt-debug-ai-code.md` for a prompt that helps diagnose AI-specific bugs.\n\n## Exercises\n\n1. Run `debug_tools.py` and read through each section's output. Modify the dummy model to introduce a NaN (hint: divide by zero in the forward pass) and watch the detector catch it.\n2. Profile a training loop with `cProfile` and identify the slowest function.\n3. Use `tracemalloc` to find which line in your data loading pipeline allocates the most memory.\n4. Set up TensorBoard for a simple training run and identify whether the model is overfitting.\n5. Use `breakpoint()` inside a training loop. Practice inspecting tensor shapes, devices, and gradient values from the debugger prompt.\n\n### Hints\n\n**Exercise 1.** Run `python3 phases/00-setup-and-tooling/12-debugging-and-profiling/code/debug_tools.py` and read the output of each demo function. Then change the model in `demo_nan_detection` so that its output divides by zero, and run again; `detect_nan` must print a NaN warning with the step number.\n\n**Exercise 2.** Run the loop under `python -m cProfile -s cumtime your_script.py`, or wrap it in `cProfile.Profile()`. Read the top rows of the `cumtime` column; the function with the largest time that is your own code is the slowest one.\n\n**Exercise 3.** Call `tracemalloc.start()` before the data loading code and `tracemalloc.take_snapshot()` after it, as in `demo_memory_tracking`. Print `snapshot.statistics(\"lineno\")[:5]`; the first line shows the file and line number with the largest allocation.\n\n**Exercise 4.** Log the training loss and the validation loss to a `SummaryWriter` at each epoch, then run `tensorboard --logdir=runs`. If the training loss continues to go down while the validation loss goes up, the model overfits.\n\n**Exercise 5.** Put `breakpoint()` inside the loop after `loss.backward()` and run the script. At the `(Pdb)` prompt, print `x.shape`, `x.device`, and `next(model.parameters()).grad`, then type `c` to continue to the next step.\n", "vi": "# Debug và Profiling\n\n> Những bug AI tệ nhất không làm chương trình crash. Chúng âm thầm train trên dữ liệu rác và báo về một đường loss đẹp như mơ.\n\n**Type:** Build\n**Language:** Python\n**Prerequisites:** Lesson 1 (Dev Environment), basic PyTorch familiarity\n**Time:** ~60 minutes\n\n## Mục tiêu bài học\n\n- Dùng `breakpoint()` có điều kiện và `debug_print` để kiểm tra shape, dtype và giá trị NaN của tensor ngay giữa lúc training\n- Profiling vòng lặp training bằng `cProfile`, `line_profiler` và `tracemalloc` để tìm bottleneck\n- Phát hiện các bug AI phổ biến: lệch shape, loss NaN, rò rỉ dữ liệu (data leakage) và tensor nằm sai device\n- Thiết lập TensorBoard để trực quan hóa đường loss, histogram của trọng số và phân phối gradient\n\n## Vấn đề\n\nCode AI hỏng theo cách khác với code thông thường. Một web app crash và để lại stack trace. Còn một vòng lặp training cấu hình sai thì chạy 8 tiếng, đốt $200 tiền GPU, rồi cho ra một model dự đoán giá trị trung bình cho mọi input. Code không hề báo lỗi. Bug nằm ở một tensor sai device, một lần quên `.detach()`, hoặc label bị rò rỉ vào feature.\n\nBạn cần những công cụ debug bắt được các lỗi âm thầm này trước khi chúng lãng phí thời gian và tài nguyên tính toán của bạn.\n\n## Khái niệm\n\nDebug AI diễn ra ở ba tầng:\n\n```mermaid\ngraph TD\n    L3[\"3. Training Dynamics<br/>Loss curves, gradient norms, activations\"] --> L2\n    L2[\"2. Tensor Operations<br/>Shapes, dtypes, devices, NaN/Inf values\"] --> L1\n    L1[\"1. Standard Python<br/>Breakpoints, logging, profiling, memory\"]\n```\n\nPhần lớn mọi người nhảy thẳng tới tầng 3 (ngồi nhìn TensorBoard). Nhưng 80% bug AI nằm ở tầng 1 và 2.\n\n```figure\ns0-flame-hot\n```\n\n## Tự xây dựng\n\n### Phần 1: Debug bằng print (Đúng vậy, nó hiệu quả)\n\nDebug bằng print hay bị xem nhẹ. Không nên như vậy. Với code tensor, một lệnh print có chủ đích hiệu quả hơn việc bước từng dòng trong debugger, vì bạn cần thấy shape, dtype và khoảng giá trị cùng một lúc.\n\n```python\ndef debug_print(name, tensor):\n    print(f\"{name}: shape={tensor.shape}, dtype={tensor.dtype}, \"\n          f\"device={tensor.device}, \"\n          f\"min={tensor.min().item():.4f}, max={tensor.max().item():.4f}, \"\n          f\"mean={tensor.mean().item():.4f}, \"\n          f\"has_nan={tensor.isnan().any().item()}\")\n```\n\nGọi hàm này sau mọi phép toán đáng ngờ. Khi tìm ra bug, xóa các lệnh print đi. Đơn giản.\n\n### Phần 2: Python Debugger (pdb và breakpoint)\n\nDebugger tích hợp sẵn bị đánh giá thấp trong công việc AI. Thả một `breakpoint()` vào vòng lặp training và kiểm tra tensor một cách tương tác.\n\n```python\ndef training_step(model, batch, criterion, optimizer):\n    inputs, labels = batch\n    outputs = model(inputs)\n    loss = criterion(outputs, labels)\n\n    if loss.item() > 100 or torch.isnan(loss):\n        breakpoint()\n\n    loss.backward()\n    optimizer.step()\n```\n\nKhi debugger dừng lại cho bạn thao tác, những lệnh hữu ích:\n\n- `p outputs.shape` để kiểm tra shape\n- `p loss.item()` để xem giá trị loss\n- `p torch.isnan(outputs).sum()` để đếm số NaN\n- `p model.fc1.weight.grad` để kiểm tra gradient\n- `c` để tiếp tục, `q` để thoát\n\nĐây là debug có điều kiện. Bạn chỉ dừng lại khi có gì đó trông không ổn. Với một lần training 10.000 bước, điều này rất quan trọng.\n\n### Phần 3: Logging trong Python\n\nHãy thay các lệnh print bằng logging khi việc debug vượt quá một lần kiểm tra nhanh.\n\n```python\nimport logging\n\nlogging.basicConfig(\n    level=logging.INFO,\n    format=\"%(asctime)s [%(levelname)s] %(message)s\",\n    handlers=[\n        logging.FileHandler(\"training.log\"),\n        logging.StreamHandler()\n    ]\n)\nlogger = logging.getLogger(__name__)\n\nlogger.info(\"Starting training: lr=%.4f, batch_size=%d\", lr, batch_size)\nlogger.warning(\"Loss spike detected: %.4f at step %d\", loss.item(), step)\nlogger.error(\"NaN loss at step %d, stopping\", step)\n```\n\nLogging cho bạn timestamp, mức độ nghiêm trọng và output ra file. Khi một lần training hỏng lúc 3 giờ sáng, bạn muốn có file log, chứ không phải output terminal đã trôi mất khỏi màn hình.\n\n### Phần 4: Đo thời gian từng đoạn code\n\nBiết thời gian đang tiêu tốn ở đâu là bước đầu tiên để tối ưu.\n\n```python\nimport time\n\nclass Timer:\n    def __init__(self, name=\"\"):\n        self.name = name\n\n    def __enter__(self):\n        self.start = time.perf_counter()\n        return self\n\n    def __exit__(self, *args):\n        elapsed = time.perf_counter() - self.start\n        print(f\"[{self.name}] {elapsed:.4f}s\")\n\nwith Timer(\"data loading\"):\n    batch = next(dataloader_iter)\n\nwith Timer(\"forward pass\"):\n    outputs = model(batch)\n\nwith Timer(\"backward pass\"):\n    loss.backward()\n```\n\nPhát hiện thường gặp: việc load dữ liệu chiếm 60% thời gian training. Cách sửa là đặt `num_workers > 0` trong DataLoader, chứ không phải mua GPU nhanh hơn.\n\n### Phần 5: cProfile và line_profiler\n\nKhi bạn cần nhiều hơn các timer thủ công:\n\n```bash\npython -m cProfile -s cumtime train.py\n```\n\nLệnh này hiển thị mọi lời gọi hàm, sắp xếp theo thời gian tích lũy. Để profiling theo từng dòng:\n\n```bash\npip install line_profiler\n```\n\n```python\n@profile\ndef train_step(model, data, target):\n    output = model(data)\n    loss = F.cross_entropy(output, target)\n    loss.backward()\n    return loss\n\n# Run with: kernprof -l -v train.py\n```\n\n### Phần 6: Profiling bộ nhớ\n\n#### Bộ nhớ CPU với tracemalloc\n\n```python\nimport tracemalloc\n\ntracemalloc.start()\n\n# your code here\nmodel = build_model()\ndata = load_dataset()\n\nsnapshot = tracemalloc.take_snapshot()\ntop_stats = snapshot.statistics(\"lineno\")\nfor stat in top_stats[:10]:\n    print(stat)\n```\n\n#### Bộ nhớ CPU với memory_profiler\n\n```bash\npip install memory_profiler\n```\n\n```python\nfrom memory_profiler import profile\n\n@profile\ndef load_data():\n    raw = read_csv(\"data.csv\")       # watch memory jump here\n    processed = preprocess(raw)       # and here\n    return processed\n```\n\nChạy bằng `python -m memory_profiler your_script.py` để xem mức dùng bộ nhớ theo từng dòng.\n\n#### Bộ nhớ GPU với PyTorch\n\n```python\nimport torch\n\nif torch.cuda.is_available():\n    print(torch.cuda.memory_summary())\n\n    print(f\"Allocated: {torch.cuda.memory_allocated() / 1e9:.2f} GB\")\n    print(f\"Cached: {torch.cuda.memory_reserved() / 1e9:.2f} GB\")\n```\n\nKhi bạn gặp OOM (Out of Memory):\n\n1. Giảm batch size (luôn là việc đầu tiên cần thử)\n2. Dùng `torch.cuda.empty_cache()` để giải phóng bộ nhớ đang được cache\n3. Dùng `del tensor` rồi gọi `torch.cuda.empty_cache()` cho các tensor trung gian lớn\n4. Dùng mixed precision (`torch.cuda.amp`) để giảm một nửa bộ nhớ sử dụng\n5. Dùng gradient checkpointing cho các model rất sâu\n\n### Phần 7: Các bug AI phổ biến và cách bắt chúng\n\n#### Lệch shape\n\nBug hay gặp nhất. Một tensor có shape `[batch, features]` trong khi model lại chờ `[batch, channels, height, width]`.\n\n```python\ndef check_shapes(model, sample_input):\n    print(f\"Input: {sample_input.shape}\")\n    hooks = []\n\n    def make_hook(name):\n        def hook(module, inp, out):\n            in_shape = inp[0].shape if isinstance(inp, tuple) else inp.shape\n            out_shape = out.shape if hasattr(out, \"shape\") else type(out)\n            print(f\"  {name}: {in_shape} -> {out_shape}\")\n        return hook\n\n    for name, module in model.named_modules():\n        hooks.append(module.register_forward_hook(make_hook(name)))\n\n    with torch.no_grad():\n        model(sample_input)\n\n    for h in hooks:\n        h.remove()\n```\n\nChạy hàm này một lần với một batch mẫu. Nó vẽ ra mọi phép biến đổi shape trong model của bạn.\n\n#### Loss NaN\n\nLoss NaN nghĩa là có thứ gì đó đã bùng nổ. Các nguyên nhân phổ biến:\n\n- Learning rate quá cao\n- Chia cho 0 trong hàm loss tự viết\n- Lấy log của 0 hoặc số âm\n- Gradient bùng nổ trong RNN\n\n```python\ndef detect_nan(model, loss, step):\n    if torch.isnan(loss):\n        print(f\"NaN loss at step {step}\")\n        for name, param in model.named_parameters():\n            if param.grad is not None:\n                if torch.isnan(param.grad).any():\n                    print(f\"  NaN gradient in {name}\")\n                if torch.isinf(param.grad).any():\n                    print(f\"  Inf gradient in {name}\")\n        return True\n    return False\n```\n\n#### Rò rỉ dữ liệu\n\nModel của bạn đạt 99% accuracy trên tập test. Nghe thì tuyệt. Nhưng đó là bug.\n\n```python\ndef check_data_leakage(train_set, test_set, id_column=\"id\"):\n    train_ids = set(train_set[id_column].tolist())\n    test_ids = set(test_set[id_column].tolist())\n    overlap = train_ids & test_ids\n    if overlap:\n        print(f\"DATA LEAKAGE: {len(overlap)} samples in both train and test\")\n        return True\n    return False\n```\n\nCũng cần kiểm tra rò rỉ theo thời gian: dùng dữ liệu tương lai để dự đoán quá khứ. Hãy sắp xếp theo timestamp trước khi chia.\n\n#### Sai device\n\nCác tensor nằm trên những device khác nhau (CPU và GPU) sẽ gây lỗi runtime. Nhưng đôi khi một tensor âm thầm nằm lại trên CPU trong khi mọi thứ khác ở trên GPU, và training chỉ đơn giản là chạy chậm.\n\n```python\ndef check_devices(model, *tensors):\n    model_device = next(model.parameters()).device\n    print(f\"Model device: {model_device}\")\n    for i, t in enumerate(tensors):\n        if t.device != model_device:\n            print(f\"  WARNING: tensor {i} on {t.device}, model on {model_device}\")\n```\n\n### Phần 8: TensorBoard cơ bản\n\nTensorBoard cho bạn thấy những gì đang diễn ra bên trong quá trình training theo thời gian.\n\n```bash\npip install tensorboard\n```\n\n```python\nfrom torch.utils.tensorboard import SummaryWriter\n\nwriter = SummaryWriter(\"runs/experiment_1\")\n\nfor step in range(num_steps):\n    loss = train_step(model, batch)\n\n    writer.add_scalar(\"loss/train\", loss.item(), step)\n    writer.add_scalar(\"lr\", optimizer.param_groups[0][\"lr\"], step)\n\n    if step % 100 == 0:\n        for name, param in model.named_parameters():\n            writer.add_histogram(f\"weights/{name}\", param, step)\n            if param.grad is not None:\n                writer.add_histogram(f\"grads/{name}\", param.grad, step)\n\nwriter.close()\n```\n\nKhởi chạy nó:\n\n```bash\ntensorboard --logdir=runs\n```\n\nNhững điều cần để ý:\n\n- **Loss không giảm**: Learning rate quá thấp, hoặc kiến trúc model có vấn đề\n- **Loss dao động dữ dội**: Learning rate quá cao\n- **Loss thành NaN**: Mất ổn định số học (xem phần NaN ở trên)\n- **Train loss giảm, val loss tăng**: Overfitting\n- **Histogram trọng số co dần về 0**: Vanishing gradient\n- **Histogram gradient bùng nổ**: Cần gradient clipping\n\n### Phần 9: Debugger của VS Code\n\nĐể debug tương tác, cấu hình VS Code bằng một file `launch.json`:\n\n```json\n{\n    \"version\": \"0.2.0\",\n    \"configurations\": [\n        {\n            \"name\": \"Debug Training\",\n            \"type\": \"debugpy\",\n            \"request\": \"launch\",\n            \"program\": \"${file}\",\n            \"console\": \"integratedTerminal\",\n            \"justMyCode\": false\n        }\n    ]\n}\n```\n\nĐặt breakpoint bằng cách click vào lề trái (gutter). Dùng pane Variables để kiểm tra các thuộc tính của tensor. Debug Console cho phép bạn chạy bất kỳ biểu thức Python nào ngay giữa lúc chương trình đang thực thi.\n\nRất hữu ích khi bước qua từng bước của pipeline tiền xử lý dữ liệu, nơi bạn muốn thấy từng phép biến đổi.\n\n## Ứng dụng\n\nĐây là quy trình debug bắt được phần lớn bug AI:\n\n1. **Trước khi training**: Chạy `check_shapes` với một batch mẫu. Xác nhận số chiều của input và output đúng như kỳ vọng.\n2. **10 bước đầu tiên**: Dùng `debug_print` cho loss, output và gradient. Xác nhận không có gì là NaN và các giá trị nằm trong khoảng hợp lý.\n3. **Trong lúc training**: Log loss, learning rate và gradient norm. Dùng TensorBoard để trực quan hóa.\n4. **Khi có gì đó hỏng**: Thả `breakpoint()` tại điểm lỗi. Kiểm tra tensor một cách tương tác.\n5. **Về hiệu năng**: Đo thời gian load dữ liệu so với forward pass và backward pass. Profiling bộ nhớ nếu bạn sắp chạm OOM.\n\n## Đóng gói & sử dụng\n\nChạy script bộ công cụ debug:\n\n```bash\npython phases/00-setup-and-tooling/12-debugging-and-profiling/code/debug_tools.py\n```\n\nXem `outputs/prompt-debug-ai-code.md` để có một prompt giúp chẩn đoán các bug đặc thù của AI.\n\n## Bài tập\n\n1. Chạy `debug_tools.py` và đọc kỹ output của từng phần. Sửa model giả để tạo ra NaN (gợi ý: chia cho 0 trong forward pass) và xem bộ phát hiện bắt được nó.\n2. Profiling một vòng lặp training bằng `cProfile` và xác định hàm chậm nhất.\n3. Dùng `tracemalloc` để tìm dòng nào trong pipeline load dữ liệu cấp phát nhiều bộ nhớ nhất.\n4. Thiết lập TensorBoard cho một lần training đơn giản và xác định xem model có bị overfitting không.\n5. Dùng `breakpoint()` bên trong vòng lặp training. Thực hành kiểm tra shape, device và giá trị gradient của tensor từ prompt của debugger.\n\n### Gợi ý\n\n**Bài tập 1.** Chạy `python3 phases/00-setup-and-tooling/12-debugging-and-profiling/code/debug_tools.py` và đọc output của từng hàm demo. Sau đó sửa model trong `demo_nan_detection` để output của nó chia cho 0, rồi chạy lại; `detect_nan` phải in ra cảnh báo NaN kèm số bước.\n\n**Bài tập 2.** Chạy vòng lặp dưới `python -m cProfile -s cumtime your_script.py`, hoặc bọc nó trong `cProfile.Profile()`. Đọc các dòng đầu của cột `cumtime`; hàm có thời gian lớn nhất mà là code của chính bạn chính là hàm chậm nhất.\n\n**Bài tập 3.** Gọi `tracemalloc.start()` trước đoạn code load dữ liệu và `tracemalloc.take_snapshot()` sau đó, giống như trong `demo_memory_tracking`. In `snapshot.statistics(\"lineno\")[:5]`; dòng đầu tiên cho biết file và số dòng có lượng cấp phát lớn nhất.\n\n**Bài tập 4.** Log training loss và validation loss vào một `SummaryWriter` ở mỗi epoch, rồi chạy `tensorboard --logdir=runs`. Nếu training loss tiếp tục giảm trong khi validation loss tăng lên, model đang bị overfitting.\n\n**Bài tập 5.** Đặt `breakpoint()` bên trong vòng lặp, sau `loss.backward()`, rồi chạy script. Tại prompt `(Pdb)`, in `x.shape`, `x.device` và `next(model.parameters()).grad`, rồi gõ `c` để tiếp tục sang bước tiếp theo.\n", "quiz": {"questions": [{"stage": "pre", "question": "Điều gì khiến việc debug code AI/ML khác hẳn so với de g song với việc tính toán trên GPU."}, {"stage": "post", "question": "Bạn thấy loss bằng NaN ở step 500. Cách nào giúp bạn tìm ra nguyên nhân gốc?", "options": ["Đổi optimizer từ Adam sang SGD", "Huấn luyện lại từ đầu với random seed khác", "Tăng batch size để ổn định gradient", "Dùng detect_nan để kiểm tra NaN/Inf trong gradient và thêm breakpoint() tại điểm bị lỗi"], "correct": 3, "explanation": "Trước hết hãy xác định NaN bắt nguồn TỪ ĐÂU bằng cách kiểm tra gradient của từng tham số. Một breakpoint có điều kiện tại step xuất hiện NaN cho phép bạn xem giá trị tensor một cách tương tác. Nguyên nhân thường gặp: learning rate quá cao, log(0), hoặc chia cho 0."}]}, "quiz_lang": "vi", "code": [{"path": "code/debug_tools.py", "lang": "python", "content": "import sys\nimport time\nimport tracemalloc\nimport logging\n\nlogging.basicConfig(\n    level=logging.INFO,\n    format=\"%(asctime)s [%(levelname)s] %(message)s\",\n)\nlogger = logging.getLogger(__name__)\n\ntry:\n    import torch\n    import torch.nn as nn\n    HAS_TORCH = True\nexcept ImportError:\n    HAS_TORCH = False\n\n\ndef debug_print(name, tensor):\n    print(f\"  {name}: shape={tensor.shape}, dtype={tensor.dtype}, \"\n          f\"device={tensor.device}, \"\n          f\"min={tensor.min().item():.4f}, max={tensor.max().item():.4f}, \"\n          f\"mean={tensor.mean().item():.4f}, \"\n          f\"has_nan={tensor.isnan().any().item()}\")\n\n\nclass Timer:\n    def __init__(self, name=\"\"):\n        self.name = name\n        self.elapsed = 0.0\n\n    def __enter__(self):\n        self.start = time.perf_counter()\n        return self\n\n    def __exit__(self, *args):\n        self.elapsed = time.perf_counter() - self.start\n        print(f\"  [{self.name}] {self.elapsed:.4f}s\")\n\n\ndef check_shapes(model, sample_input):\n    print(f\"  Input: {sample_input.shape}\")\n    hooks = []\n\n    def make_hook(name):\n        def hook(module, inp, out):\n            in_shape = inp[0].shape if isinstance(inp, tuple) else inp.shape\n            out_shape = out.shape if hasattr(out, \"shape\") else type(out).__name__\n            print(f\"    {name}: {in_shape} -> {out_shape}\")\n        return hook\n\n    for name, module in model.named_modules():\n        if name:\n            hooks.append(module.register_forward_hook(make_hook(name)))\n\n    with torch.no_grad():\n        model(sample_input)\n\n    for h in hooks:\n        h.remove()\n\n\ndef detect_nan(model, loss, step):\n    if torch.isnan(loss):\n        print(f\"  NaN loss detected at step {step}\")\n        for name, param in model.named_parameters():\n            if param.grad is not None:\n                if torch.isnan(param.grad).any():\n                    print(f\"    NaN gradient in {name}\")\n                if torch.isinf(param.grad).any():\n                    print(f\"    Inf gradient in {name}\")\n        return True\n    return False\n\n\ndef check_devices(model, *tensors):\n    model_device = next(model.parameters()).device\n    print(f\"  Model device: {model_device}\")\n    for i, t in enumerate(tensors):\n        status = \"OK\" if t.device == model_device else \"MISMATCH\"\n        print(f\"    Tensor {i}: {t.device} [{status}]\")\n\n\ndef check_gradient_health(model):\n    total_norm = 0.0\n    for name, param in model.named_parameters():\n        if param.grad is not None:\n            grad_norm = param.grad.data.norm(2).item()\n            total_norm += grad_norm ** 2\n            if grad_norm > 100:\n                print(f\"    WARNING: large gradient in {name}: {grad_norm:.2f}\")\n            if grad_norm == 0:\n                print(f\"    WARNING: zero gradient in {name}\")\n    total_norm = total_norm ** 0.5\n    print(f\"  Total gradient norm: {total_norm:.4f}\")\n    return total_norm\n\n\ndef demo_print_debugging():\n    print(\"\\n--- 1. Print Debugging for Tensors ---\")\n    x = torch.randn(32, 784)\n    debug_print(\"input batch\", x)\n\n    w = torch.randn(784, 128)\n    out = x @ w\n    debug_print(\"after matmul\", out)\n\n    with_nan = out.clone()\n    with_nan[0, 0] = float(\"nan\")\n    debug_print(\"with injected NaN\", with_nan)\n\n\ndef demo_timing():\n    print(\"\\n--- 2. Timing Code Sections ---\")\n\n    with Timer(\"matrix multiply 1000x1000\"):\n        a = torch.randn(1000, 1000)\n        b = torch.randn(1000, 1000)\n        _ = a @ b\n\n    with Timer(\"matrix multiply 5000x5000\"):\n        a = torch.randn(5000, 5000)\n        b = torch.randn(5000, 5000)\n        _ = a @ b\n\n\ndef demo_memory_tracking():\n    print(\"\\n--- 3. Memory Tracking (tracemalloc) ---\")\n    tracemalloc.start()\n\n    if HAS_TORCH:\n        data = [torch.randn(100, 100) for _ in range(100)]\n        more_data = torch.randn(1000, 1000)\n    else:\n        data = [bytearray(4 * 100 * 100) for _ in range(100)]\n        more_data = bytearray(4 * 1000 * 1000)\n\n    snapshot = tracemalloc.take_snapshot()\n    top_stats = snapshot.statistics(\"lineno\")\n    print(\"  Top 5 memory allocations:\")\n    for stat in top_stats[:5]:\n        print(f\"    {stat}\")\n\n    del data, more_data\n    tracemalloc.stop()\n\n\ndef demo_shape_checking():\n    print(\"\\n--- 4. Shape Checking Through Model ---\")\n\n    model = nn.Sequential(\n        nn.Linear(784, 256),\n        nn.ReLU(),\n        nn.Linear(256, 64),\n        nn.ReLU(),\n        nn.Linear(64, 10),\n    )\n\n    sample = torch.randn(4, 784)\n    check_shapes(model, sample)\n\n\ndef demo_nan_detection():\n    print(\"\\n--- 5. NaN Detection ---\")\n\n    model = nn.Sequential(\n        nn.Linear(784, 256),\n        nn.ReLU(),\n        nn.Linear(256, 10),\n    )\n\n    x = torch.randn(4, 784)\n    target = torch.randint(0, 10, (4,))\n    criterion = nn.CrossEntropyLoss()\n    optimizer = torch.optim.SGD(model.parameters(), lr=0.01)\n\n    optimizer.zero_grad()\n    output = model(x)\n    loss = criterion(output, target)\n    loss.backward()\n    print(f\"  Normal loss: {loss.item():.4f}\")\n    nan_found = detect_nan(model, loss, step=0)\n    print(f\"  NaN detected: {nan_found}\")\n\n    fake_nan_loss = torch.tensor(float(\"nan\"))\n    print(f\"  Simulated NaN loss: {fake_nan_loss.item()}\")\n    nan_found = detect_nan(model, fake_nan_loss, step=99)\n    print(f\"  NaN detected: {nan_found}\")\n\n\ndef demo_device_checking():\n    print(\"\\n--- 6. Device Checking ---\")\n\n    model = nn.Linear(10, 5)\n    t1 = torch.randn(4, 10)\n    t2 = torch.randn(4, 10)\n\n    check_devices(model, t1, t2)\n\n    accel = None\n    if torch.cuda.is_available():\n        accel = \"cuda\"\n    elif torch.backends.mps.is_available():\n        accel = \"mps\"\n    if accel:\n        model_gpu = model.to(accel)\n        t_cpu = torch.randn(4, 10)\n        t_gpu = torch.randn(4, 10).to(accel)\n        print(\"  With mixed devices:\")\n        check_devices(model_gpu, t_cpu, t_gpu)\n\n\ndef demo_gradient_health():\n    print(\"\\n--- 7. Gradient Health Check ---\")\n\n    model = nn.Sequential(\n        nn.Linear(784, 256),\n        nn.ReLU(),\n        nn.Linear(256, 10),\n    )\n\n    x = torch.randn(4, 784)\n    target = torch.randint(0, 10, (4,))\n    criterion = nn.CrossEntropyLoss()\n\n    output = model(x)\n    loss = criterion(output, target)\n    loss.backward()\n    check_gradient_health(model)\n\n\ndef demo_gpu_memory():\n    print(\"\\n--- 8. GPU Memory Summary ---\")\n\n    if torch.cuda.is_available():\n        print(f\"  GPU: {torch.cuda.get_device_name(0)}\")\n        print(f\"  Allocated: {torch.cuda.memory_allocated() / 1e6:.1f} MB\")\n        print(f\"  Cached: {torch.cuda.memory_reserved() / 1e6:.1f} MB\")\n\n        large_tensor = torch.randn(10000, 10000, device=\"cuda\")\n        print(\"  After 10k x 10k tensor:\")\n        print(f\"    Allocated: {torch.cuda.memory_allocated() / 1e6:.1f} MB\")\n\n        del large_tensor\n        torch.cuda.empty_cache()\n        print(\"  After cleanup:\")\n        print(f\"    Allocated: {torch.cuda.memory_allocated() / 1e6:.1f} MB\")\n        return\n\n    if torch.backends.mps.is_available():\n        print(\"  GPU: Apple Silicon (MPS) — unified memory\")\n        print(f\"  Allocated: {torch.mps.current_allocated_memory() / 1e6:.1f} MB\")\n\n        large_tensor = torch.randn(10000, 10000, device=\"mps\")\n        print(\"  After 10k x 10k tensor:\")\n        print(f\"    Allocated: {torch.mps.current_allocated_memory() / 1e6:.1f} MB\")\n\n        del large_tensor\n        torch.mps.empty_cache()\n        print(\"  After cleanup:\")\n        print(f\"    Allocated: {torch.mps.current_allocated_memory() / 1e6:.1f} MB\")\n        return\n\n    print(\"  No GPU available. Skipping GPU memory demo.\")\n    print(\"  On a GPU machine, torch.cuda.memory_summary() shows:\")\n    print(\"    - Allocated memory per block size\")\n    print(\"    - Cached (reserved) memory\")\n    print(\"    - Peak memory usage\")\n\n\ndef demo_logging():\n    print(\"\\n--- 9. Structured Logging ---\")\n\n    logger.info(\"Training started: lr=0.001, batch_size=32, epochs=10\")\n    logger.info(\"Step 100: loss=2.3026, accuracy=0.10\")\n    logger.warning(\"Loss spike detected: 15.7 at step 450\")\n    logger.info(\"Step 1000: loss=0.4512, accuracy=0.87\")\n    logger.info(\"Training complete: best_loss=0.3201\")\n\n\ndef demo_conditional_breakpoint():\n    print(\"\\n--- 10. Conditional Breakpoint Pattern ---\")\n    print(\"  In real code, use this pattern:\")\n    print()\n    print(\"    for step in range(num_steps):\")\n    print(\"        loss = train_step(model, batch)\")\n    print(\"        if loss.item() > 10 or torch.isnan(loss):\")\n    print(\"            breakpoint()  # drops into pdb\")\n    print()\n    print(\"  Useful pdb commands once inside:\")\n    print(\"    p tensor.shape       # print shape\")\n    print(\"    p tensor.device      # check device\")\n    print(\"    p tensor.grad        # inspect gradients\")\n    print(\"    p tensor.isnan().sum()  # count NaNs\")\n    print(\"    c                    # continue execution\")\n    print(\"    q                    # quit debugger\")\n\n\ndef main():\n    print(\"=\" * 60)\n    print(\"  AI Debugging and Profiling Toolkit\")\n    print(\"  Phase 0, Lesson 12\")\n    print(\"=\" * 60)\n\n    if not HAS_TORCH:\n        print(\"\\nPyTorch not installed. Install with:\")\n        print(\"  uv pip install torch\")\n        print(\"\\nRunning non-PyTorch demos only...\\n\")\n        demo_memory_tracking()\n        demo_logging()\n        return 1\n\n    demo_print_debugging()\n    demo_timing()\n    demo_memory_tracking()\n    demo_shape_checking()\n    demo_nan_detection()\n    demo_device_checking()\n    demo_gradient_health()\n    demo_gpu_memory()\n    demo_logging()\n    demo_conditional_breakpoint()\n\n    print(\"\\n\" + \"=\" * 60)\n    print(\"  All demos complete.\")\n    print(\"  Next: introduce bugs intentionally and practice catching them.\")\n    print(\"=\" * 60 + \"\\n\")\n    return 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n"}, {"path": "outputs/prompt-debug-ai-code.md", "lang": "markdown", "content": "---\nname: prompt-debug-ai-code\ndescription: Diagnose AI-specific bugs including NaN loss, shape errors, training failures, and OOM\nphase: 0\nlesson: 12\n---\n\nYou are an AI/ML debugging specialist. The user is training or running a machine learning model and has hit a bug. Your job is to diagnose the root cause and provide the exact fix.\n\nWhen the user describes a problem, follow this process:\n\n1. Classify the bug into one of these categories:\n   - **NaN/Inf loss**: numerical instability during training\n   - **Shape mismatch**: tensor dimension errors\n   - **Training not converging**: loss not decreasing or stuck\n   - **OOM (Out of Memory)**: GPU or CPU memory exhaustion\n   - **Data issue**: leakage, wrong preprocessing, corrupted inputs\n   - **Device mismatch**: tensors on different devices\n   - **Silent failure**: code runs but model learns nothing\n\n2. Ask for the specific diagnostic output based on the category:\n\n   For **NaN loss**, ask the user to run:\n   ```python\n   for name, param in model.named_parameters():\n       if param.grad is not None:\n           print(f\"{name}: grad_norm={param.grad.norm():.4f}, \"\n                 f\"has_nan={param.grad.isnan().any()}, \"\n                 f\"has_inf={param.grad.isinf().any()}\")\n   ```\n\n   For **shape mismatch**, ask for:\n   ```python\n   print(f\"Input shape: {x.shape}\")\n   print(f\"Expected: {model.fc1.in_features}\")\n   print(f\"Output shape: {model(x).shape}\")\n   print(f\"Target shape: {target.shape}\")\n   ```\n\n   For **training not converging**, ask for:\n   - Learning rate value\n   - Loss values at steps 0, 10, 100, 1000\n   - Whether data is shuffled\n   - Whether gradients are being zeroed each step\n\n   For **OOM**, ask for:\n   ```python\n   print(f\"Batch size: {batch_size}\")\n   print(f\"Model params: {sum(p.numel() for p in model.parameters()):,}\")\n   print(f\"GPU memory: {torch.cuda.memory_allocated()/1e9:.2f} GB / \"\n         f\"{torch.cuda.get_device_properties(0).total_memory/1e9:.2f} GB\")\n   ```\n\n3. Provide the fix. Be specific. Not \"try reducing the learning rate\" but \"change lr from 0.1 to 0.001\" or \"add torch.nn.utils.clip_grad_norm_(model.parameters(), max_norm=1.0) before optimizer.step()\".\n\nCommon root causes and their fixes:\n\n- **NaN after a few steps**: Learning rate too high. Reduce by 10x. Add gradient clipping.\n- **NaN immediately**: Log of zero or negative number in loss. Add epsilon: `torch.log(x + 1e-8)`.\n- **NaN in specific layer**: Check for division by zero. BatchNorm with batch_size=1 will NaN.\n- **Loss stuck at ln(num_classes)**: Model predicting uniform distribution. Check that gradients flow (no accidental `.detach()` or `with torch.no_grad()` around the forward pass).\n- **Loss stuck at high value**: Wrong loss function for the task. CrossEntropyLoss expects raw logits, not softmax output.\n- **Loss decreasing then exploding**: Learning rate too high for later training. Use a learning rate scheduler.\n- **Perfect training accuracy, bad test accuracy**: Overfitting. Add dropout, reduce model size, add data augmentation, or get more data.\n- **99% test accuracy on first epoch**: Data leakage. Labels are in the features, or train/test sets overlap.\n- **OOM during forward pass**: Batch size too large or model too big. Halve the batch size. Use mixed precision with `torch.cuda.amp.autocast()`.\n- **OOM during backward pass**: Gradient accumulation without clearing. Call `optimizer.zero_grad()` each step.\n- **RuntimeError about device**: Move all tensors to the same device. Use `model.to(device)` and `tensor.to(device)` consistently.\n- **Slow training, GPU utilization low**: Data loading is the bottleneck. Set `num_workers=4` (or higher) in DataLoader. Use `pin_memory=True`.\n\nAlways end with a verification step the user can run to confirm the fix worked.\n"}]}, {"id": "13", "slug": "13-python-for-ai-engineering", "title_en": "Python for AI Engineering", "title_vi": "Python cho AI Engineering", "en": "# Python for AI Engineering\n\n> Most code in this course uses the same small set of Python idioms. Learn that set here, before the math and model lessons depend on it.\n\n**Type:** Build\n**Languages:** Python, TypeScript\n**Prerequisites:** Dev Environment, Python Environments\n**Time:** ~120 minutes\n\n## Learning Objectives\n\n- Read and write the idioms that most course code uses, from unpacking and f-strings to dataclasses and comprehensions.\n- Find three Python mistakes that give wrong results with no error: shared lists, mutable defaults, and used-up generators.\n- Build a CSV and JSON loader, a seeded split, and a mini-batch generator with only the standard library.\n- Write dot product, mean, and standard deviation in pure Python, and measure their speed and memory use.\n- Explain why a pure-Python loop over numbers is slow, and how NumPy broadcasting moves the loop into compiled code.\n\n## The Problem\n\nThe lessons after this phase use plain Python for the math and the models. Of the 541 Python files in the lessons, 276 import `dataclasses`. Also, 187 files call `random.seed` or create a `random.Random` generator. If those idioms are new to you, you read syntax when you want to read the math.\n\nPython also has behaviors that give wrong results with no error message. Two names can refer to one list, so a change through one name also changes the other. A default argument keeps its value from one call to the next. A generator is empty after one pass, so a second training epoch gets no data and the loss does not change.\n\nThe last problem is speed. On our test laptop, a pure-Python loop over a million floats took about 30 milliseconds. NumPy computed the same dot product in less than one millisecond. You need to know the reason, so that you can choose between a clear loop and an array operation.\n\n## The Concept\n\n### What the course code uses\n\nWe parsed all 541 Python files in `phases/*/*/code/` with the `ast` module. The table counts the files that use each construct at least once. The counts are from the day we wrote this lesson, and they change as lessons are added.\n\n| Construct | Files | Share |\n|-----------|-------|-------|\n| Function definitions | 541 | 100% |\n| `if __name__ == \"__main__\":` | 529 | 98% |\n| f-strings | 517 | 96% |\n| Tuple unpacking | 448 | 83% |\n| Classes | 379 | 70% |\n| List comprehensions | 375 | 69% |\n| Type hints on functions | 342 | 63% |\n| Generator expressions | 326 | 60% |\n| Slices | 314 | 58% |\n| `lambda` | 175 | 32% |\n| `try` and `except` | 120 | 22% |\n| `with` statements | 96 | 18% |\n| Dict comprehensions | 93 | 17% |\n| Generator functions with `yield` | 14 | 3% |\n\nImports show which standard modules matter. Of the 541 files, 340 start with `from __future__ import annotations`, and 276 import `dataclasses`. The `math`, `random`, and `json` modules appear in 187, 175, and 126 files. The `collections` module appears in 70 files, and `itertools` appears in only 4.\n\nNo lesson calls `map()` or `filter()`. Comprehensions do that work. Calls to `sorted`, `min`, `max`, or `.sort` with a `key=` function appear in more than 140 files. This lesson spends the most time on the idioms at the top of these lists.\n\n### Names refer to objects\n\nIn Python, a variable is a name that refers to an object. Assignment binds a name to an object. It does not copy the object. When two names refer to one list, a change through either name is visible through both. Numbers, strings, and tuples cannot change, so this rule causes no problems for them. Lists, dicts, and sets can change, so make a copy when you need an independent version.\n\n### A list holds pointers, an array holds numbers\n\nA Python list does not store numbers directly. It stores pointers, and each pointer refers to a full Python object. On a 64-bit build of CPython, each pointer takes 8 bytes and each `float` object takes 24 bytes. A NumPy `float64` array stores the raw 8-byte values side by side in one block of memory.\n\n```mermaid\ngraph LR\n    subgraph PY[\"Python list of 3 floats\"]\n        L[\"list object<br/>3 pointers, 8 bytes each\"] --> F1[\"float object<br/>24 bytes\"]\n        L --> F2[\"float object<br/>24 bytes\"]\n        L --> F3[\"float object<br/>24 bytes\"]\n    end\n    subgraph NP[\"NumPy float64 array of 3 values\"]\n        A[\"one data block<br/>3 values, 8 bytes each\"]\n    end\n```\n\nA loop over a list does a lot of work for each element. The interpreter runs one bytecode instruction at a time. For each element, it follows a pointer and checks the type of each operand. Then it calls the float multiply code and makes a Python float object to hold the result.\n\nNumPy does the same arithmetic in a loop of compiled code over the raw values. It checks the data type once for the whole array, and it makes no Python object for each
